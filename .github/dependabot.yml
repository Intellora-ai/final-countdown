# DEPENDABOT — the other half of pinning.
#
# Pinning without an upgrade path is just a slower kind of rot: every `uses:`
# in this repository is now an immutable 40-char commit SHA and every Python
# dependency is a `==` pin with a sha256, which means nothing moves until
# something moves it. This is what moves it.
#
# TWO ECOSYSTEMS, BOTH WEEKLY.
#
#   github-actions — reads every `uses:` in .github/workflows/*.yml. It
#   understands SHA pins with a trailing version comment, and opens a PR that
#   bumps BOTH the SHA and the comment together, which is exactly the format
#   used here. Without this, a pinned action never receives a security fix.
#
#   pip — reads requirements.txt, the human-editable list of DIRECT
#   dependencies.
#
# KNOWN LIMIT, STATED RATHER THAN HIDDEN.
# Dependabot's pip ecosystem discovers `*requirements*.txt`-shaped files. It
# does NOT read requirements.lock, so it will not regenerate the hashes, and
# the `>=` floors in requirements.txt are satisfied by every future release,
# so pip PRs here will be rare by construction. The lock is regenerated by
# hand with the command in its own header; that command is the upgrade
# procedure for Python dependencies. This entry exists so that a floor that
# genuinely must move (a yanked release, an advisory on the floor itself)
# still surfaces as a PR rather than as nothing at all.
#
# ALSO: repository-level `dependabot_security_updates` is now ENABLED on
# Intellora-ai/final-countdown, alongside automated-security-fixes. Those are
# repository settings, not files, so they cannot be asserted from here and
# tests/test_supply_chain.py does not try — it guards this file. Confirm them
# with:
#
#   gh api repos/Intellora-ai/final-countdown \
#       --jq .security_and_analysis.dependabot_security_updates.status
#   gh api repos/Intellora-ai/final-countdown/automated-security-fixes
#
# The two halves are complementary: the version updates configured below run
# on the weekly schedule, security updates fire out-of-band on an advisory.

version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - python
