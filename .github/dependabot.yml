# DEPENDABOT — the other half of pinning.
#
# Pinning without an upgrade path is just a slower kind of rot: every `uses:`
# in this repository is now an immutable 40-char commit SHA and every Python
# dependency is a `==` pin with a sha256, which means nothing moves until
# something moves it. This is what moves it.
#
# ALSO: repository-level `dependabot_security_updates` is ENABLED on
# Intellora-ai/final-countdown, alongside automated-security-fixes. Those are
# repository settings, not files, so they cannot be asserted from here and
# tests/test_supply_chain.py does not try — it guards this file. Confirm them
# with:
#
#   gh api repos/Intellora-ai/final-countdown \
#       --jq .security_and_analysis.dependabot_security_updates.status
#   gh api repos/Intellora-ai/final-countdown/automated-security-fixes
#
# The two halves are complementary: the version updates configured below run
# on the weekly schedule, security updates fire out-of-band on an advisory.

version: 2

updates:
  # ---------------------------------------------------------------------------
  # GITHUB ACTIONS — reads every `uses:` in .github/workflows/*.yml. Understands
  # SHA pins with a trailing version comment and bumps BOTH together, which is
  # the exact format used here. Without this, a pinned action never receives a
  # security fix.
  #
  # The `groups` block collapses every action bump into ONE pull request per
  # run instead of up to five. That is the point: the actions in this
  # repository are bumped as a set and verified by a single CI run, so five
  # separate PRs would mean five runs of the same pipeline to prove the same
  # thing. The cost is shared fate — one bad action bump blocks the others in
  # that PR until it is dropped.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns: ["*"]

  # ---------------------------------------------------------------------------
  # PIP — reads requirements.txt, the human-editable list of DIRECT deps.
  #
  # KNOWN LIMIT, STATED RATHER THAN HIDDEN: Dependabot's pip ecosystem
  # discovers `*requirements*.txt`-shaped files. It does NOT read
  # requirements.lock, so it will not regenerate the hashes, and the `>=`
  # floors in requirements.txt are satisfied by every future release, so pip
  # PRs here will be rare by construction. The lock is regenerated by hand
  # with the command in its own header; that command is the upgrade procedure
  # for Python dependencies. This entry exists so a floor that genuinely must
  # move (a yanked release, an advisory on the floor itself) still surfaces as
  # a PR rather than as nothing at all.
  #
  # DELIBERATELY ABSENT: `versioning-strategy: lockfile-only`.
  # Per GitHub's own definition that value means "only create pull requests to
  # update lockfiles; ignore any new versions that would require package
  # manifest changes". Dependabot's pip ecosystem recognises Pipfile.lock and
  # poetry.lock as lockfiles. This repository has neither — requirements.lock
  # is a pip-compile artefact Dependabot does not read, which is the KNOWN
  # LIMIT stated two paragraphs up and cited by tests/test_lock_consistency.py.
  # So the only pip file Dependabot can see here is a manifest, and setting
  # lockfile-only would forbid the one edit it is able to make. The entry would
  # open zero pull requests for the rest of its life while still appearing to
  # be configured, which is the precise failure this file exists to prevent.
  # Leaving the option unset keeps the default (`auto`) and keeps the rare
  # floor bump reachable.
  # ---------------------------------------------------------------------------
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - python
    groups:
      python:
        patterns: ["*"]

  # ---------------------------------------------------------------------------
  # NPM — the frontend. THE GAP THIS FILE PREVIOUSLY HAD.
  #
  # frontend/package-lock.json is tracked and frontend/package.json separates
  # `dependencies` (13 runtime packages: react, three, echarts, zod, ...) from
  # `devDependencies` (18 build and test packages: vite, vitest, typescript,
  # playwright, eslint, ...), so both groups below are real and each one has
  # members. Runtime and dev are grouped separately on purpose: a dev-tool bump
  # can only break the build, a runtime bump can break what students see, and
  # those two deserve to be reviewed apart rather than merged as one diff.
  #
  # `versioning-strategy: increase` bumps the `^` floor in package.json to
  # match the new release rather than leaving a floor that every future version
  # already satisfies. This is an application, not a published library, so
  # there is no downstream consumer whose resolution a raised floor could
  # constrain — the floor should say what is actually being run.
  #
  # SCOPE: this entry covers frontend/ ONLY. Other tracked npm manifests exist
  # (./package.json, practice-map/, technology-universe/runtimes/*) and are
  # NOT watched by this file. See .agent/deferred.md.
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    rebase-strategy: auto
    versioning-strategy: increase
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - frontend
    groups:
      runtime:
        dependency-type: production
      dev:
        dependency-type: development
