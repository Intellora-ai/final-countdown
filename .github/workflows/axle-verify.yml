name: AXLE Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  axle-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install AXLE CLI
        run: pip install axiom-axle          # NOT axle-cli (unrelated package)
      # Runs first so an outage is named as an outage in the log, instead of
      # surfacing as a wall of proof failures.
      - name: AXLE service health
        run: python3 scripts/axle_health.py
      - name: Enforce strong specs (syntactic)
        run: python3 scripts/enforce_spec.py specs/*_spec.lean
      # axle_gate.py owns the pass/fail decision because `axle verify-proof`
      # exits 0 on "okay": false, and emits plain-text `Error:` (no JSON) when
      # the statement fails to compile — so neither the exit code nor a grep
      # for '"okay": false' blocks on its own. It proves SPEC_SET == PROOF_SET
      # and that the set is non-empty BEFORE checking any proof, and it writes
      # its own reports/axle-verify.json, so it is not wrapped in run_gate.py.
      - name: Verify all proofs with AXLE
        run: python3 scripts/axle_gate.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-axle-verify
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
