name: ci-integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # Runs BEFORE the gates matter. If the verification system itself is broken -
  # a gate deleted, a job renamed, a command suppressed, a script missing - the
  # merge is blocked even though every other check would be green.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gate integrity
        run: python3 scripts/gate_integrity.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-preflight
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
