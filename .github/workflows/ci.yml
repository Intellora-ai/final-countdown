name: Release gates
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-preflight.lock
      - run: python3 -m pip install --require-hashes -r requirements-preflight.lock
      - run: python3 ci/check_workflows.py
      - run: python3 -m unittest discover -s ci/tests
      - run: python3 ci/install_actionlint.py
      # Latest actionlint 1.7.12 predates GitHub's documented code-quality permission.
      # check_workflows.py independently enforces its exact coverage-only grant.
      - run: .ci-tools/actionlint -color -ignore '^unknown permission scope "code-quality"\.'
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:ci
      - run: npm run test:strength
      - run: npm run build
      - run: npm run test:production
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unit-and-coverage
          path: |
            frontend/test-results/unit.json
            frontend/coverage/coverage-summary.json
            frontend/coverage/cobertura-coverage.xml
            frontend/test-results/mutations.json
          retention-days: 7
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [core]
    permissions:
      contents: read
      code-quality: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unit-and-coverage
          path: coverage-evidence
      - uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: coverage-evidence/coverage/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/vitest
          fail-on-error: true
          wait-for-processing-timeout: 160
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx --no-install playwright install --with-deps chromium
      - run: TEST_PRODUCTION=1 npm run test:e2e -- --fail-on-flaky-tests
      - run: npm run test:e2e -- tests/browser/learning.spec.ts --fail-on-flaky-tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failure-traces
          path: frontend/test-results
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: frontend/.nvmrc
      - run: docker build -t canvas-ci .
      - run: node frontend/scripts/check-container.mjs canvas-ci
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@f3c49fd1ef3281abc41069b3dd22807a60c963f6 # v4
        with:
          output: codeql-results
          category: /language:${{ matrix.language }}
      - run: python3 ci/check_sarif.py codeql-results
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [integrity, core, browser, container, security, coverage]
    if: always()
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 ci/check_verdict.py
