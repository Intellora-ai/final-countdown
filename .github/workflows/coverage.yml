name: coverage
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install --quiet -r requirements.txt
      - name: pytest with 95% coverage floor
        run: python3 scripts/run_gate.py --name coverage -- pytest --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=95
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-coverage
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
