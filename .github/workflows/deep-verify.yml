# DEEP VERIFICATION LANE — non-required, label-gated, network-reaching.
#
# NOT A REQUIRED CONTEXT. ci/gates.toml declares both jobs `mandatory = false`, and
# `required_checks` stays at seventeen. Nothing here changes a ruleset, modifies a
# required workflow, deploys, publishes, promotes, or creates a release.
#
# WHY IT IS LABEL-GATED RATHER THAN RUNNING ON EVERY PUSH. This lane calls the hosted
# AXLE service for real. A workflow that did so on every synchronize would contact a
# third party dozens of times a day to re-prove something that changes rarely. The
# `pull_request: types: [labeled]` trigger means no run is even CREATED for an ordinary
# push -- the state to record then is NOT_STARTED, not "ran and passed".
#
# FORK PRs ARE BLOCKED, NOT MERELY DISCOURAGED. This workflow holds `id-token: write`,
# which is signing authority. Anyone able to apply a label to a fork pull request would
# otherwise be able to make this repository's identity sign bytes from a branch it does
# not control. The gate job refuses when the head repository is not this repository.
#
# THE SOURCE SHA IS NOT `github.sha`. On a pull_request run GitHub sets `github.sha` to a
# generated test-merge commit that exists in no branch, so a bundle bound to it would be
# bound to a commit nobody can check out. SOURCE_SHA is the pull request head SHA, or the
# required input on a manual dispatch, and `github.sha` is recorded separately as the
# workflow-run SHA it actually is.

name: deep-verify

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit SHA to verify. Never inferred; the branch tip is not substituted.
        required: true
        type: string
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: deep-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # GATE — decide whether this run may proceed, and say so in the vocabulary the
  # milestone defines. The distinction between NOT_STARTED and NOT_RUN is real:
  # the first means GitHub never created a run, the second means a run happened
  # and declined. Only the second can be reported here at all.
  # ---------------------------------------------------------------------------
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      source_sha: ${{ steps.decide.outputs.source_sha }}
    steps:
      - name: Decide whether the deep lane may run
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: ${{ github.event.label.name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          DISPATCH_SHA: ${{ inputs.source_sha }}
          WORKFLOW_RUN_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          echo "EVENT_NAME        $EVENT_NAME"
          echo "WORKFLOW_RUN_SHA  $WORKFLOW_RUN_SHA"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # The dispatch input is free-form text supplied by whoever pressed the
            # button, and it flows into `ref:` on checkout. Constrain it to a bare
            # 40-character hex SHA HERE, before anything downstream consumes it: a ref
            # that can carry arbitrary characters is a ref that can carry an argument.
            case "$DISPATCH_SHA" in
              *[!0-9a-fA-F]* | "")
                echo "STATUS: BLOCK"
                echo "REASON: source_sha is not a bare 40-character hexadecimal commit SHA"
                echo "run=false" >> "$GITHUB_OUTPUT"
                exit 1
                ;;
            esac
            if [ "${#DISPATCH_SHA}" -ne 40 ]; then
              echo "STATUS: BLOCK"
              echo "REASON: source_sha is ${#DISPATCH_SHA} characters; a commit SHA is 40"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "DEEP_WORKFLOW_STATUS: RUN"
            echo "SOURCE_SHA        $DISPATCH_SHA (required dispatch input, validated)"
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "source_sha=$DISPATCH_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "LABEL_NAME        $LABEL_NAME"
          echo "PR_HEAD_SHA       $PR_HEAD_SHA"
          echo "MERGE_SHA         ${MERGE_SHA:-<not supplied>}"

          if [ "$LABEL_NAME" != "deep-verify" ]; then
            echo "DEEP_WORKFLOW_STATUS: NOT_RUN"
            echo "REASON: received label event was not deep-verify"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Signing authority must never be reachable from a branch this repository
          # does not control. This is a refusal, not a skip: BLOCK is the honest status
          # because the lane was asked to run and deliberately did not.
          if [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "STATUS: BLOCK"
            echo "REASON: fork PRs are not authorized to execute network integration tests or keyless signing."
            echo "HEAD_REPO=$HEAD_REPO THIS_REPO=$THIS_REPO"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "DEEP_WORKFLOW_STATUS: RUN"
          echo "SOURCE_SHA        $PR_HEAD_SHA (pull request head, NOT github.sha)"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "source_sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # DEEP VERIFY — the lane, then one authoritative bundle, then proof that the
  # signature belongs to it and to nothing else.
  # ---------------------------------------------------------------------------
  deep-verify:
    needs: [gate]
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      # Keyless signing. Scoped to this job alone; the workflow default above is
      # `contents: read` and every other job keeps it.
      id-token: write
    env:
      SOURCE_SHA: ${{ needs.gate.outputs.source_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The exact commit under test. fetch-depth 0 so the SHA is present rather
          # than only reachable.
          ref: ${{ needs.gate.outputs.source_sha }}
          fetch-depth: 0

      - name: The checked-out tree is the SHA this run claims
        env:
          WORKFLOW_RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "SOURCE_SHA        $SOURCE_SHA"
          echo "CHECKED_OUT_SHA   $ACTUAL"
          echo "WORKFLOW_RUN_SHA  $WORKFLOW_RUN_SHA"
          if [ "$ACTUAL" != "$SOURCE_SHA" ]; then
            echo "STATUS: BLOCK — the checkout is not the commit this run names" >&2
            exit 1
          fi
          git cat-file -e "${SOURCE_SHA}^{commit}"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '3.12', cache: pip,
               cache-dependency-path: requirements.lock}
      - run: pip install --quiet --require-hashes -r requirements.lock

      - name: Deep verification lane
        env:
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/local_gates.py --deep --run-id "gh-${RUN_ID}"

      - name: Build one authoritative verification bundle
        run: |
          set -euo pipefail
          EVIDENCE="$(ls -td .evidence/deep-verify/*/ | head -1)"
          echo "EVIDENCE_DIR $EVIDENCE"
          python3 scripts/build_bundle.py \
            --source-sha "$SOURCE_SHA" \
            --evidence-dir "$EVIDENCE" \
            --out-dir bundle-out

      - name: SBOM and provenance, bound to that bundle
        run: |
          set -euo pipefail
          python3 scripts/generate_sbom.py \
            --bundle-manifest bundle-out/bundle.manifest.json \
            --out bundle-out/sbom.cdx.json
          python3 scripts/generate_provenance.py \
            --bundle-manifest bundle-out/bundle.manifest.json \
            --source-sha "$SOURCE_SHA" \
            --out bundle-out/provenance.intoto.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the bundle bytes, keyless
        run: |
          set -euo pipefail
          BUNDLE="bundle-out/sandbox-verification-bundle-${SOURCE_SHA}.tar"
          # sign-blob, not an image command: this is a file, and there is no OCI
          # registry anywhere in this repository to push one to.
          cosign sign-blob --yes \
            --output-signature bundle-out/bundle.sig \
            --output-certificate bundle-out/bundle.pem \
            "$BUNDLE"

      - name: Verify the signature, and prove the identity was observed
        run: |
          set -euo pipefail
          BUNDLE="bundle-out/sandbox-verification-bundle-${SOURCE_SHA}.tar"

          # The expected identity is DERIVED at runtime from what GitHub reports.
          # Nothing about the owner, repository, workflow filename or ref is written
          # into this file.
          EXPECTED_IDENTITY="${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}"
          EXPECTED_ISSUER="https://token.actions.githubusercontent.com"

          cosign verify-blob \
            --certificate bundle-out/bundle.pem \
            --signature bundle-out/bundle.sig \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer "$EXPECTED_ISSUER" \
            "$BUNDLE"

          # Deriving an expectation from environment variables does not prove the
          # certificate carries it. Read the ACTUAL values out of the certificate and
          # compare, or a passing verification would only prove cosign accepted the
          # arguments this file supplied.
          ACTUAL_IDENTITY="$(openssl x509 -in bundle-out/bundle.pem -noout -ext subjectAltName \
            | tr ',' '\n' | grep -o 'URI:.*' | sed 's/^URI://' | head -1)"
          ACTUAL_ISSUER="$(openssl asn1parse -in bundle-out/bundle.pem -strparse 0 2>/dev/null \
            | grep -A1 '1.3.6.1.4.1.57264.1.8' | tail -1 | sed 's/.*://' || true)"
          if [ -z "$ACTUAL_ISSUER" ]; then
            ACTUAL_ISSUER="$(openssl x509 -in bundle-out/bundle.pem -noout -text \
              | grep -A2 '1.3.6.1.4.1.57264.1.8' | tail -1 | tr -d ' \t' | sed 's/^\.\.//' || true)"
          fi

          RECOMPUTED="$(sha256sum "$BUNDLE" | cut -d' ' -f1)"
          RECORDED="$(python3 -c "import json;print(json.load(open('bundle-out/bundle.manifest.json'))['bundle_sha256'])")"

          echo "EXPECTED_ISSUER            $EXPECTED_ISSUER"
          echo "ACTUAL_ISSUER             $ACTUAL_ISSUER"
          echo "EXPECTED_IDENTITY         $EXPECTED_IDENTITY"
          echo "ACTUAL_CERTIFICATE_IDENTITY $ACTUAL_IDENTITY"
          echo "SOURCE_SHA                $SOURCE_SHA"
          echo "RECORDED_BUNDLE_DIGEST    $RECORDED"
          echo "RECOMPUTED_BUNDLE_DIGEST  $RECOMPUTED"

          FAILED=0
          [ "$ACTUAL_IDENTITY" = "$EXPECTED_IDENTITY" ] || { echo "MISMATCH: certificate identity" >&2; FAILED=1; }
          case "$ACTUAL_ISSUER" in *token.actions.githubusercontent.com*) : ;; *) echo "MISMATCH: issuer" >&2; FAILED=1 ;; esac
          [ "$RECORDED" = "$RECOMPUTED" ] || { echo "MISMATCH: digest" >&2; FAILED=1; }
          if [ "$FAILED" -ne 0 ]; then
            echo "STATUS: FAIL — the certificate does not carry the identity this run expected" >&2
            exit 1
          fi
          echo "STATUS: PASS — issuer, identity, source SHA and digest all match"

      - name: The original signature must reject different bytes
        run: |
          set -uo pipefail
          BUNDLE="bundle-out/sandbox-verification-bundle-${SOURCE_SHA}.tar"

          # NOT an artifact build. This copy is never signed and never uploaded as the
          # authoritative bundle; it exists only so the rejection can be demonstrated
          # against real bytes. A string comparison of two digests would prove nothing
          # about the signature.
          cp "$BUNDLE" altered.tar
          printf '\0' >> altered.tar
          ALTERED_DIGEST="$(sha256sum altered.tar | cut -d' ' -f1)"
          ORIGINAL_DIGEST="$(sha256sum "$BUNDLE" | cut -d' ' -f1)"
          echo "ORIGINAL_DIGEST $ORIGINAL_DIGEST"
          echo "ALTERED_DIGEST  $ALTERED_DIGEST"

          EXPECTED_IDENTITY="${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}"
          set +e
          cosign verify-blob \
            --certificate bundle-out/bundle.pem \
            --signature bundle-out/bundle.sig \
            --certificate-identity "$EXPECTED_IDENTITY" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            altered.tar
          REJECT_EXIT=$?
          set -e
          echo "VERIFY_ALTERED_EXIT_CODE $REJECT_EXIT"
          if [ "$REJECT_EXIT" -eq 0 ]; then
            echo "STATUS: FAIL — the signature validated bytes it never signed" >&2
            exit 1
          fi
          echo "STATUS: PASS — the original signature rejected the altered copy"
          rm -f altered.tar

      # TWO UPLOADS, BECAUSE THEY SURVIVE DIFFERENT FAILURES. On run 32414089692 the
      # lane failed, so no bundle was built, so the single `if: always()` upload of
      # bundle-out/ found nothing and errored -- and the lane's own evidence, which
      # existed and explained the failure, was never uploaded. The log said
      # "INVESTIGATE — read the captured output" while pointing at a directory nobody
      # outside the runner could reach.
      #
      # Lane evidence is uploaded unconditionally: it is the thing a reader needs most
      # when the lane failed. The bundle set is uploaded only when it was actually
      # produced, so `if-no-files-found: error` keeps meaning "the build was supposed
      # to leave files here and did not".
      - name: Upload the deep-lane evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deep-verify-evidence-${{ needs.gate.outputs.source_sha }}
          path: .evidence/deep-verify/
          retention-days: 30
          if-no-files-found: error

      - name: Upload the authoritative artifact set
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sandbox-verification-bundle-${{ needs.gate.outputs.source_sha }}
          path: bundle-out/
          retention-days: 30
          if-no-files-found: error
