name: Honest Report
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  honest-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      # Ten dimensions, reported separately. Blocks on FAIL only: an
      # unestablished contract is information, not a broken build, and
      # collapsing it into PASS/FAIL is exactly the overclaim Layer 10 forbids.
      - name: All ten layers, per function
        run: |
          set -euo pipefail
          python3 scripts/spec_source.py specs/*_spec.lean > /tmp/pairs.txt
          cut -d= -f2 /tmp/pairs.txt | sort -u | while read -r src; do
            specs=$(grep "=${src}$" /tmp/pairs.txt | cut -d= -f1 | tr '\n' ' ')
            python3 scripts/honest_report.py $specs --min-strength 0.9
          done
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-honest-report
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
