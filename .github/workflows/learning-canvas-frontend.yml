# LEARNING CANVAS FRONTEND — the browser-side verification contract.
#
# TWO OF THESE JOBS ARE REQUIRED CONTEXTS. `frontend` and `frontend-verdict` are both listed in
# `ci/gates.toml` `required_checks` and both sit in live ruleset 20990225. The paragraph that stood
# here said the opposite -- "NOT A REQUIRED CONTEXT ... required_checks at seventeen" -- and it was
# simply out of date: the promotion happened, the comment did not follow. This is still a second
# verification domain inside one repository, not a second project: Python and Lean prove what they
# can prove, and TypeScript in a browser proves what they cannot. Forcing frontend code through
# `axle_gate.py` would mean claiming a Lean proof for a React component, and pointing `pyright` at
# a `.tsx` file proves nothing about either.
#
# WHY THE PATH FILTER MOVED OFF `pull_request`, AND WHY THAT WAS A BUG NOT A PREFERENCE.
#
# The frontend lives at `frontend/`. A Python-only commit has nothing here to verify, so running
# Node for it would burn minutes re-proving an untouched tree. That reasoning is still correct and
# is still enforced -- but it cannot be enforced with a workflow-level `paths:` filter on
# `pull_request`, because of how GitHub reports a workflow that never starts:
#
#   workflow skipped by `paths:`  ->  NO check-run is created at all
#   job skipped by `if:`          ->  a check-run IS created, conclusion `skipped`
#
# Branch protection treats a `skipped` check-run as satisfied. It treats a MISSING one as
# "Expected -- waiting for status to be reported", indefinitely. So while `frontend` and
# `frontend-verdict` were required AND filtered by path, every pull request that did not touch
# `frontend/**` was structurally unmergeable: every runnable required context green, two contexts
# that could never exist, and no bypass actor on the ruleset to override it. `gh pr merge --admin`
# was refused as well -- a ruleset with no bypass actors cannot be overridden by anyone, the
# repository owner included.
#
# The fix keeps the cost saving and drops the reporting gap: the workflow now starts on every pull
# request, a cheap `changes` job decides whether `frontend/**` was touched, and each expensive job
# carries `if: needs.changes.outputs.frontend == 'true'`. A Python-only pull request still runs no
# Node -- those jobs skip in seconds -- but they skip VISIBLY, so the required contexts report.
#
# `push:` keeps its `paths:` filter. Required contexts are evaluated on pull requests, so the
# reporting gap does not arise there, and a main-branch push touching no frontend file has nothing
# to verify. `verify.yml` deliberately has NO path filter and therefore still runs for a
# frontend-only pull request -- that is the existing design, not an oversight, and it is unchanged.
#
# WHY EVERY ACTION IS A 40-CHARACTER SHA. A tag is a pointer somebody else can move. Every SHA
# below is already in use elsewhere in this repository, so this workflow introduces no new
# third-party code -- only new calls to code the repository has already accepted.
#
# NO `${{ }}` INSIDE `run:`. `codeql.yml` analyses `languages: actions`, and an expression
# interpolated into a shell body is the script-injection finding it exists to catch. Nothing here
# needs one: every value is a static path.

name: Learning Canvas Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/learning-canvas-frontend.yml"

  # NO `paths:` HERE, DELIBERATELY. See the header. A workflow filtered out by `paths:` creates no
  # check-run at all, and a required context with no check-run blocks its pull request for good.
  # The path decision moved down onto the jobs, where a skip is still reported.
  pull_request:
    branches:
      - main

# Read-only. This workflow verifies; it does not publish, sign, deploy, or comment.
permissions:
  contents: read

# CANCELLATION IS CONDITIONAL, AND THE CONDITION IS LOAD-BEARING.
#
# This was an unconditional `cancel-in-progress: true`, which every other
# workflow in this repository deliberately does not do. On a pull request that
# is correct: a newer commit genuinely obsoletes the older result. On a push to
# `main` it is not, because that run IS the authoritative verification of a
# commit that has ALREADY MERGED. Cancelling it leaves a merged commit with no
# completed verification -- the one outcome this repository exists to prevent --
# and two merges landing close together was all it took.
#
# `verify.yml`, `codeql.yml`, `e2e.yml` and `learning-os.yml` all carry exactly
# this expression, with the reasoning written out in verify.yml. This file was
# the odd one out, and being the odd one out was not a decision anybody recorded.
concurrency:
  group: learning-canvas-frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # THE CHEAP HALF OF THE OLD PATH FILTER.
  #
  # This job does what `paths:` used to do on `pull_request`, and it is deliberately tiny: one
  # checkout and one `git diff --name-only`. It exists so the expensive jobs below can decide to
  # skip WITHOUT the workflow itself being filtered out -- the distinction the header explains, and
  # the whole reason this job is here rather than a `paths:` line.
  #
  # Anything that is not a pull request answers `true` unconditionally. `push:` still carries its
  # own `paths:` filter, so a push reaching this workflow has already been shown to touch the
  # frontend, and answering `false` there could only ever skip work that should have run.
  #
  # NO `${{ }}` INSIDE `run:`, per this file's standing rule -- every value arrives through `env:`.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both endpoints of the diff have to exist locally. A shallow clone has the head but not
          # the merge base, and `git diff` against a commit the runner does not have does not fail
          # quietly -- it reports every file as changed, which would run the full battery on every
          # pull request and hide this regression behind a green result.
          fetch-depth: 0

      - name: Detect frontend changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "not a pull_request: running the full battery"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
              frontend \
              .github/workflows/learning-canvas-frontend.yml
          )"
          if [ -n "$changed" ]; then
            echo "frontend files changed:"
            echo "$changed"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "no frontend file changed: the verification jobs will skip, and report the skip"
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    needs: [changes]
    # A SKIP HERE IS REPORTED. The `paths:` filter this replaces was not.
    if: needs.changes.outputs.frontend == 'true'
    # 15 was sized for a job that ran 1.2-2.1 min. Two checks have since been
    # added that trade wall clock for defect-finding: the mutation gate reruns
    # the unit suite once per mutant (115s measured on a runner) and the
    # browser step went from one Playwright project to five. 25 leaves room for
    # both to grow without the timeout becoming the thing that fails.
    timeout-minutes: 25

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # node-version-file rather than a literal: the version lives in frontend/.nvmrc, so a
      # developer's local shell and this runner read the same single declaration.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci`, never `npm install`: it installs the lockfile exactly and fails if
      # package.json and package-lock.json disagree, which is the property that makes this run
      # reproducible rather than merely repeatable.
      - name: Install dependencies
        run: npm ci

      # EVERY VERIFICATION STEP RUNS, EVEN AFTER ONE FAILS.
      #
      # These steps used to stop the job at the first non-zero exit. A branch
      # with a type error therefore never learned whether it also had a lint
      # error, a failing test, a budget overrun or a broken render: you fixed
      # one, pushed, waited for a full runner, and discovered the next. Serial
      # discovery across N defects costs N round trips.
      #
      # `continue-on-error` lets the whole battery run and report together, and
      # the gate at the end of the job restores the failing verdict. One push,
      # every error.
      #
      # Each step also writes machine-readable output that the next step turns
      # into `::error file=...,line=...` workflow commands. Without those, a
      # failure is text inside a collapsed log group with no source location;
      # with them, GitHub pins an annotation to the exact line and the raw log
      # carries an `##[error]` entry that a census can count.
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        # `set -o pipefail` is load-bearing. GitHub's default shell is
        # `bash -e`, NOT `bash -eo pipefail`, so `npm run typecheck | tee`
        # reports tee's exit status and the step could never fail. This clause
        # of the verification gate was dead until this line existed. Every
        # other workflow in this repository already sets it -- verify.yml:821,
        # e2e.yml:108, deep-verify.yml in eight places.
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee "$RUNNER_TEMP/tsc.log"

      - name: Annotate typecheck
        if: always()
        continue-on-error: true
        # STEP_OUTCOME lets the annotator detect the one state that made
        # these logs useless: a failed step with no location anywhere on the
        # run. Passed through env, not interpolated into the run body.
        env:
          STEP_OUTCOME: ${{ steps.typecheck.outcome }}
        run: node scripts/gh-annotate.mjs tsc < "$RUNNER_TEMP/tsc.log"

      # LAW 4, ENFORCED RATHER THAN REQUESTED.
      #
      # `design-value` is a local AST rule -- no third-party plugin -- that refuses a
      # raw colour or an arbitrary size anywhere the canvas can paint from JavaScript:
      # JSX style objects, SVG presentation attributes, and three.js material props.
      # That last surface is the reason the token layer is TypeScript rather than CSS:
      # `<meshStandardMaterial color="var(--x)" />` does not resolve, it throws.
      #
      # Scoped to src/canvas deliberately. src/components, src/data and src/styles are
      # the dashboard, they are out of scope for this refactor, and pointing a canvas
      # token rule at them would restyle a design nobody asked to change.
      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          # `npm run lint`, NOT a hand-written eslint invocation.
          #
          # This ran `npx eslint src/canvas` while package.json's `lint` script
          # covered FOUR directories: src/canvas, src/practice, src/agent and
          # src/websearch. All four have matching `files:` blocks in
          # eslint.config.js, so all four were configured to be linted and three
          # of them never were -- in CI or anywhere else that gates a merge.
          #
          # Calling the script means the path list has exactly one definition.
          # A directory added to package.json is linted here the same day
          # instead of waiting for someone to notice the second copy.
          # `--` forwards the reporter flags to eslint without disturbing it.
          npm run lint -- --format json -o "$RUNNER_TEMP/eslint.json" \
            && echo "eslint: clean" \
            || { npm run lint -- --format stylish || true; exit 1; }

      - name: Annotate lint
        if: always()
        continue-on-error: true
        # STEP_OUTCOME lets the annotator detect the one state that made
        # these logs useless: a failed step with no location anywhere on the
        # run. Passed through env, not interpolated into the run body.
        env:
          STEP_OUTCOME: ${{ steps.lint.outcome }}
        run: node scripts/gh-annotate.mjs eslint < "$RUNNER_TEMP/eslint.json"

      - name: Unit tests
        id: unit
        continue-on-error: true
        run: npm test -- --run --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/vitest.json"

      - name: Annotate unit tests
        if: always()
        continue-on-error: true
        # STEP_OUTCOME lets the annotator detect the one state that made
        # these logs useless: a failed step with no location anywhere on the
        # run. Passed through env, not interpolated into the run body.
        env:
          STEP_OUTCOME: ${{ steps.unit.outcome }}
        run: node scripts/gh-annotate.mjs vitest < "$RUNNER_TEMP/vitest.json"

      # The mutation gate used to sit here, between Unit tests and Build. It now
      # runs in the `frontend-mutation` job below, four shards wide. Moving it
      # out is why this job dropped from ~625s to ~75s; the reasoning for why
      # the gate exists at all moved with it.

      # A GATE NOTHING CALLED IS A COMMENT, AND THIS ONE HAD BEEN ONE SINCE IT
      # WAS WRITTEN.
      #
      # `scripts/reachability-gate.mjs` is 29 KB with its own 31 KB test file,
      # and `npm run gate:reachability` appeared in package.json and in NO
      # workflow. Measured before this change: `grep -rn gate:reachability
      # .github/` returned nothing.
      #
      # What it catches is the thing coverage argues AGAINST noticing: a module
      # imported only by its own test reports 100% coverage, and the number goes
      # UP as the orphan is tested more thoroughly. Coverage measures test
      # reach; this measures PRODUCT reach. src/agent once shipped two fully
      # tested modules the product could never load, and 59 green tests said
      # nothing was wrong.
      #
      # It runs before Build because it needs no build output, and its outcome
      # is read by the Verification gate below like every other step here.
      # `--product` IS NOW ARMED, and this is the decision the gate's own
      # comment said belonged to the repository owner rather than to the file.
      #
      # It reported three UNREACHED findings before Phase 10 and now reports
      # none, but NOT because the check was loosened. Two of the three were
      # artefacts of type erasure: `agent/kernel/contracts.ts` and
      # `websearch/port.ts` export only types, so no import could ever reach
      # them and the workaround was to declare them MANIFEST entries -- an
      # exemption with paperwork for a rule they could never satisfy. The gate
      # now follows a type-only edge into a types-only module, and both are
      # genuinely live.
      #
      # The third, `websearch/bench.ts`, is a benchmark harness. It is declared
      # a TOOL entry with a written reason, so the area walk still measures its
      # internals while the meaningless "does the browser reach it" question is
      # not asked.
      #
      # Proven not to be a switch-off: a types-only module nothing imports is
      # still reported ORPHAN, and the fixture tests keep the failing direction
      # under the suite's control rather than the repository's.
      - name: Reachability
        id: reachability
        continue-on-error: true
        run: npm run gate:reachability

      - name: Build
        id: build
        continue-on-error: true
        run: npm run build

      # THE BUDGET WAS UNENFORCED, WHICH IS THE SAME AS ABSENT.
      #
      # `scripts/canvas-bundle-budget.mjs` has measured the initial canvas payload and exited
      # non-zero on an overrun since it was written -- and nothing ever called it. A ceiling
      # nothing checks is a comment. It caught a real 186.55 KB regression against the 150 KB
      # limit only because it was run by hand; the next one would have shipped.
      #
      # It runs AFTER build because it reads dist/, and it needs no path filter of its own: this
      # whole workflow is already scoped to `frontend/**`.
      - name: Bundle budget
        id: budget
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run budget 2>&1 | tee "$RUNNER_TEMP/budget.log"

      # The budget step had no annotation path, so an overrun was a number
      # buried in a log group like every other failure before this change.
      - name: Annotate bundle budget
        if: always()
        continue-on-error: true
        run: |
          if grep -q "canvas-bundle-budget: FAIL" "$RUNNER_TEMP/budget.log"; then
            LINE=$(grep "canvas-bundle-budget: FAIL" "$RUNNER_TEMP/budget.log" | head -1)
            echo "::error file=frontend/scripts/canvas-bundle-budget.mjs,title=bundle budget::$LINE"
          else
            grep "canvas-bundle-budget:" "$RUNNER_TEMP/budget.log" | head -1 || true
          fi

      # The browser guards used to sit here. They now run in the
      # `frontend-scenes` job below, one runner per Playwright project. That is
      # the single largest wall-clock change in this file: five projects ran
      # strictly serially at ~62s each, and they now run concurrently. The
      # reasoning for what those specs may and may not contain moved with them.

      # THE VERDICT, RESTORED.
      #
      # `continue-on-error` above makes each step report instead of halt, which
      # would leave the job green with failures in it. This step is the gate:
      # it reads every outcome and fails the job if any of them failed. The
      # annotations are already on the run by the time it executes, so the
      # summary names what to look at rather than repeating it.
      - name: Verification gate
        # `mutation` and `playwright` left this condition because their steps
        # left this job. They are not unenforced -- they are jobs now, and
        # `frontend-verdict` reads their results exactly as this step reads
        # these outcomes. gate_integrity check (c) requires every
        # continue-on-error step WITH AN ID in this job to appear here; after the
        # move there are five such steps, not seven, and naming a step that no
        # longer exists would make this condition permanently false for it.
        if: >-
          steps.typecheck.outcome == 'failure' ||
          steps.lint.outcome == 'failure' ||
          steps.unit.outcome == 'failure' ||
          steps.reachability.outcome == 'failure' ||
          steps.build.outcome == 'failure' ||
          steps.budget.outcome == 'failure'
        # THE FILELESS ::error WAS DELETED, and it is not an oversight.
        #
        # `::error title=...` with no `file=` does not vanish: GitHub attaches
        # it to the workflow file at whatever line the step sits on. On run
        # 32589708228 that produced `.github:6` and `.github:7` -- two
        # annotations pointing at a YAML line that has nothing to do with any
        # failure, sitting in the same list as the real ones. Three of that
        # run's thirteen annotations were this noise.
        #
        # The annotation list is for LOCATIONS. A summary of which steps failed
        # is not a location, so it belongs in the step summary, which renders
        # as a table at the top of the run and costs the annotation list
        # nothing.
        # OUTCOMES THROUGH `env:`, NOT `${{ }}` INSIDE THE SHELL BODY.
        #
        # This file's own header says "NO `${{ }}` INSIDE `run:`" and gives the
        # reason: codeql analyses `languages: actions` here, and an expression
        # interpolated into a shell body is the script-injection finding that
        # analysis exists to catch. The block below then did it six times.
        #
        # These particular values are workflow-generated and cannot carry
        # attacker text, so this was never exploitable. It is fixed anyway,
        # because the rule's whole value is that no reviewer has to work out
        # which interpolations are the dangerous kind -- an exception that needs
        # per-case reasoning is not a rule.
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          REACHABILITY_OUTCOME: ${{ steps.reachability.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUDGET_OUTCOME: ${{ steps.budget.outcome }}
        shell: bash
        run: |
          set -o pipefail
          {
            echo "### Frontend verification failed"
            echo
            echo "Every step in THIS job ran, so this is the complete list for it,"
            echo "not the first failure. The mutation and browser jobs report"
            echo "separately; \`frontend-verdict\` is the run's single verdict."
            echo
            echo "| step | outcome |"
            echo "| --- | --- |"
            echo "| typecheck | $TYPECHECK_OUTCOME |"
            echo "| lint | $LINT_OUTCOME |"
            echo "| unit | $UNIT_OUTCOME |"
            echo "| reachability | $REACHABILITY_OUTCOME |"
            echo "| build | $BUILD_OUTCOME |"
            echo "| budget | $BUDGET_OUTCOME |"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # THE FINDINGS UPLOAD MOVED TO `frontend-scenes`, AND IT HAD TO.
      #
      # `ci-findings.json` is written by canvas-reporter, which only runs under
      # Playwright. With the browser steps gone from this job, this job produces
      # no findings file -- and the upload carried `if-no-files-found: error`,
      # so leaving it here would have failed every run for a file that is
      # correctly absent. It now runs once per project shard, under a per-shard
      # name, for the reason in that job.

      # `if: always()` so a failed build still uploads whatever it produced -- the partial output
      # is often what identifies the failure. `if-no-files-found: ignore` because a failure before
      # the build step legitimately leaves no dist/ at all, and a missing artifact is not itself
      # a second failure to report.
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: learning-canvas-frontend-build
          path: frontend/dist
          # `error`, not `ignore`. This gate is required, and a required check
          # that goes green while producing nothing is exactly the shape the
          # finalizer exists to catch -- a build that emitted no dist is a build
          # that did not happen, and `ignore` would report that as success.
          if-no-files-found: error

  # THE MUTATION GATE, FOUR SHARDS WIDE.
  #
  # Why the gate exists, unchanged from when it sat inside `frontend`: every
  # other check asks "does the code work", and none asks "would these tests
  # notice if it stopped". The six gates in ci/gates.toml that ask the second
  # question -- mutmut, spec-strength, spec-composition, vacuity-check,
  # counterexample-search, honest-report -- are all scoped to `src/` Python and
  # `specs/` Lean. `pyproject.toml` pins `paths_to_mutate = ["src/"]`. Not one
  # mutates a line of TypeScript, and the frontend has no stryker and no
  # property-testing library at all, so this suite could rot silently. It was
  # not hypothetical: the gate's FIRST run reported a survivor.
  #
  # THE PRECONDITION THIS COMMENT USED TO STATE IS NOW MET.
  #
  # The previous version of this block said, correctly, that `--shard=i/n` must
  # NOT be passed: `scripts/mutation-gate.mjs` had parsed the flag since bae7377,
  # but the guard refusing an empty shard lived in 7c0c36a, which was not on main.
  # Wiring the matrix then would have turned on a sharding path whose safety guard
  # was one unmerged commit away -- issue #18's shape inside the mutation gate, a
  # required check reporting success over work it never did. It set its own exit
  # condition: "the guard lands first, in its own change, with its own test. Then
  # the matrix."
  #
  # Both landed. The guard is on main via #59 (4cf16f8) and its process-level test
  # via #63 (99763ee). Re-verified against this branch's base rather than taken on
  # trust, because the whole point of that condition was that nobody assume it:
  #
  #     npm run test:mutation -- --shard=99/100
  #       -> FAIL, shard 99/100 selected no mutants from a catalogue of 39. exit 1
  #     npm run test:mutation -- --shard=abc
  #       -> bad --shard value --shard=abc. exit 1
  #
  # Both refusals land in under a second. #59 hoisted the argument checks above
  # the ~950-test baseline, so a misconfigured shard costs nothing instead of a
  # full suite per shard -- which is exactly the failure a matrix multiplies.
  #
  # WHY FOUR. The catalogue is 39 mutants, so 4 shards is 10/10/10/9 and no shard
  # can be empty. The guard therefore stays dead code at this width, which is the
  # correct state for a guard: present, tested, and not load-bearing. It becomes
  # reachable only if someone sets n above the catalogue size, which is the
  # misconfiguration it exists to catch. gate_integrity's MUTATION_COUNT_FLOOR of
  # 27 is the floor that keeps 4 safe as the catalogue changes -- a catalogue that
  # shrank below 4 would make an empty shard reachable, and that floor forbids it.
  #
  # `$MUTATION_SHARD` goes through `env:`, never `${{ }}` inside `run:`. codeql
  # analyses `languages: actions` here, and an interpolated run body is precisely
  # the script-injection finding that analysis exists to catch. `frontend-scenes`
  # below binds its matrix the same way.
  #
  # `needs.frontend-mutation.result` in frontend-verdict aggregates the shards:
  # any shard failing makes the whole job's result 'failure'. That is not an
  # assumption about matrices -- frontend-scenes has been a matrix behind that
  # same needs entry since #61, and run 32658532840 proved it in the red
  # direction, one deliberately broken shard turning the verdict red.
  frontend-mutation:
    name: mutation ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    strategy:
      # A surviving mutant in shard 2 says nothing about shard 3, and killing the
      # siblings would hide three quarters of the answer behind the first failure.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Mutation gate
        env:
          MUTATION_SHARD: ${{ matrix.shard }}
        run: npm run test:mutation -- --shard="$MUTATION_SHARD/4"

  # THE BROWSER GUARDS, ONE RUNNER PER PROJECT.
  #
  # THIS DOES NOT CONTRADICT `workers: 1`, WHICH IS THE FIRST THING A REVIEWER
  # WILL CHECK. playwright.config.ts:17-25 sets `workers: 1` and
  # `fullyParallel: false` because the specs measure frame intervals and input
  # latency, and parallel workers on one CPU fight for it and poison every p95
  # they touch. That constraint is about parallelism INSIDE a runner. Each shard
  # here is a separate runner still running one worker, so the measurements keep
  # the isolation the config demands -- this buys wall clock without touching
  # the property the config protects.
  #
  # Measured before the split: the five projects ran strictly serially in one
  # step, ~62s apart end to end (13:27:04, 13:28:07, 13:29:08, 13:30:14,
  # 13:31:14 on run 32642191714). ~310s of that was pure serialisation.
  #
  # What these specs may contain is unchanged and still load-bearing: no spec
  # that makes a timing claim. `scene-regressions.spec.ts` and
  # `composed-renderer.spec.ts` both qualify because every assertion in them is
  # a DOM fact. The perf suite does not, because a p95 measured on a shared
  # runner goes red on a neighbour, and a gate that fails randomly teaches
  # people to ignore gates.
  #
  # No `--with-deps`: the runner image already ships Chromium's shared
  # libraries, matching the reasoning recorded in e2e.yml.
  #
  # `fail-fast: false` so a failure at 375px does not cancel the keyboard run.
  # Which viewports break is the finding; one of them is not.
  frontend-scenes:
    # ONE RUNNER FOR ALL FIVE PROJECTS, AND THE SPLIT WAS COSTING TIME.
    #
    # This was a 5-way matrix, one project per runner. `playwright.config.ts`
    # sets `workers: 4` with `fullyParallel: false`, and its own header records
    # what that combination means: a parallel unit is ONE FILE within ONE
    # project, and these two specs are the only files.
    #
    #     all five projects, one runner   2 files x 5 projects = 10 units -> 4 workers
    #     one project per runner (shard)  2 files x 1 project  =  2 units -> 2 workers
    #
    # So sharding by project starved Playwright of the parallelism it is
    # configured for: every shard could only ever reach 2 workers. The measured
    # numbers in that same header are workers=1 234s, workers=2 149s, workers=4
    # 77s/87s/115s -- for ALL FIVE projects together.
    #
    # Measured on this repository, the 5-way split cost 5 x 92s = 460s of runner
    # time, a third of the whole run's 1398s, and held five of the eight
    # concurrent slots the account allows. One job is ~28s of setup plus ~95s of
    # work. Same five projects, same two specs, same assertions -- the coverage
    # is identical and gate_integrity check (f) still resolves all five, because
    # it reads literal `--project=` flags as well as matrix bindings.
    #
    # IF THE PERF SPECS ARE EVER RECONNECTED, REVERT THIS WITH THEM.
    # playwright.config.ts requires `workers: 1` if `./util/cdp` comes back,
    # because parallel workers poison every p95 they touch. At workers=1 the
    # unit-starvation argument above disappears and one-project-per-runner
    # becomes the faster shape again.
    name: scenes ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    strategy:
      fail-fast: false
      matrix:
        # TWO MACHINES, NOT FIVE, AND NOT ONE. MEASURED BOTH TIMES.
        #
        # Five (one project per runner) starved Playwright: with
        # `fullyParallel: false` a parallel unit is one file within one project,
        # and two specs per project meant every shard capped at 2 of the 4
        # workers it was configured for.
        #
        # One runner fixed the workers and became the critical path instead.
        # Measured on run 32696164041: `Running 290 tests using 4 workers`,
        # `290 passed (3.8m)` -- 230s of work in a 257s job, and the whole CI
        # wall clock was 262s. The config's header quotes 77-115s for workers=4;
        # that was measured before the suite reached 290 tests, and trusting it
        # instead of the runner is what produced the five-way split.
        #
        # `workers: 4` caps the process and the runner has 4 vCPU, so more
        # workers cannot help. Only more MACHINES can. `--shard` splits the
        # tests across them while every shard still runs all five projects, so
        # gate_integrity check (f) reads five literal `--project=` flags here
        # exactly as before.
        # 2 -> 4: each shard was MEASURED at ~15 minutes, the second-longest
        # wall in the repository. Same tests, same five projects per shard --
        # twice the machines, roughly half the wait.
        # 2 -> 4 -> 8: each of two shards was MEASURED at ~15 minutes and was
        # the second-tallest wall in the repository; the per-shard fixed cost
        # (cached npm ci + cached chromium + server build) is ~1.5 minutes, so
        # eight machines put the wall near 1.5m setup + ~2m of tests. Same five
        # projects, same ~290 tests -- Playwright's --shard splits, never skips.
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Was five installs of the same browser, one per shard, at ~11s each.
      # Collapsing the matrix collapses that too, without adding a cache action
      # this repository does not already pin.
      # THE BROWSER BINARIES, CACHED. `playwright install` downloads ~150MB of
      # Chromium on every run of every job that needs a browser -- eight jobs a
      # push, all fetching the same bytes. The INSTALL STEP STAYS: on a cache
      # hit it validates and no-ops in seconds, on a miss or a version bump it
      # downloads exactly as before, so a stale or poisoned cache cannot skip
      # validation -- this trades seconds, never assurance. Keyed on the
      # lockfile: any dependency change rebuilds the cache.
      - name: Cache playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install chromium

      # The projects are written out rather than looped: gate_integrity check
      # (f) reads literal `--project=` flags, so this list IS the coverage
      # claim, and a project silently dropped from it fails preflight.
      - name: Scene regression guards
        # SHARD THROUGH env, NOT INTERPOLATED INTO THE RUN BODY. The value is
        # workflow-defined and harmless, but this repository's convention is
        # that no `${{ }}` reaches a shell line, so no reviewer has to decide
        # which interpolations are the dangerous kind.
        env:
          SHARD: ${{ matrix.shard }}
        # `token-invariance.spec.ts` is Goal 1, and until 2026-08-25 nothing
        # checked it. CLAUDE.md's enforcement table named that filename as the
        # mechanism; the file had never existed on any branch, so the first line
        # of the repository's central principle -- "the design system is
        # constant" -- was documented as guarded and was not.
        #
        # It runs on ALL FIVE projects deliberately. A token that changes at a
        # breakpoint would satisfy a desktop-only check and still break the
        # grammar on a phone, and the measurement is cheap: 2.2s on mobile-375.
        run: >-
          npx playwright test -c playwright.config.ts
          e2e/scene-regressions.spec.ts e2e/composed-renderer.spec.ts
          e2e/token-invariance.spec.ts
          e2e/a11y.spec.ts
          --project=desktop-1440
          --project=square-900
          --project=mobile-375
          --project=reduced-motion
          --project=keyboard
          --shard="$SHARD/8"
          --fail-on-flaky-tests

      # ONE DOWNLOAD INSTEAD OF A LOG CRAWL.
      #
      # canvas-reporter writes ci-findings.json: every failure with its source
      # file, spec location, attempt count and message. The per-project name
      # suffix existed only because five concurrent shards would collide on one
      # artifact name; with a single job the plain name is unambiguous again,
      # and the findings still carry the project on every row.
      #
      # `if: always()` because a green run's findings file is the useful
      # baseline: count 0 proves the reporter ran and found nothing, which is a
      # different claim from the file being absent. `error`, not `warn`, for the
      # reason ci/gates.toml requires on every gate artifact -- a missing
      # artifact reduced to a grey annotation is the same "absence looks like
      # health" failure the reporter exists to close.
      - name: Upload failure findings
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: learning-canvas-frontend-findings-scenes-${{ matrix.shard }}
          path: frontend/ci-findings.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # VISUAL REGRESSION — its own job, and one project.
  #
  # NOT folded into `frontend-scenes`. That job runs five Playwright projects
  # and shards across two runners; a screenshot suite there would capture five
  # baselines per lesson, four of which nobody asked for, and shard them
  # unpredictably across machines.
  #
  # `reduced-motion` only, because animation is the single largest source of
  # screenshot flake and that project settles the page by construction rather
  # than by a timeout somebody tuned.
  #
  # THE UPLOAD IS PART OF THE FEATURE, NOT DEBUGGING SCAFFOLD.
  # docs/visual-review.md requires that a changed image is looked at by a human
  # before any baseline moves. That is impossible without the diff, so the
  # artefact carrying it is uploaded on failure. A gate whose evidence cannot be
  # retrieved is a gate whose verdict has to be taken on trust.
  # ---------------------------------------------------------------------------
  frontend-visual:
    name: visual
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # THE BROWSER BINARIES, CACHED. `playwright install` downloads ~150MB of
      # Chromium on every run of every job that needs a browser -- eight jobs a
      # push, all fetching the same bytes. The INSTALL STEP STAYS: on a cache
      # hit it validates and no-ops in seconds, on a miss or a version bump it
      # downloads exactly as before, so a stale or poisoned cache cannot skip
      # validation -- this trades seconds, never assurance. Keyed on the
      # lockfile: any dependency change rebuilds the cache.
      - name: Cache playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install chromium

      # Playwright REFUSES to create a missing baseline under CI and fails
      # instead. That is the behaviour this job depends on: a first run that
      # silently wrote its own expected images and went green would be the
      # vacuous pass this repository keeps finding elsewhere.
      - name: Visual regression
        run: >-
          npx playwright test -c playwright.config.ts
          e2e/visual.spec.ts
          --project=reduced-motion
          --fail-on-flaky-tests

      - name: Upload the diff so a human can review it
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: learning-canvas-frontend-visual-diff
          path: frontend/test-results/
          if-no-files-found: error

  # THE RUN'S SINGLE VERDICT.
  #
  # Splitting one job into three split the verdict with it: three jobs can fail
  # independently, and a reader scanning a checks list should not have to
  # reconstruct the answer from them. This job is the answer.
  #
  # `if: always()` IS LOAD-BEARING, NOT DEFENSIVE HABIT. Without it, a failed
  # dependency SKIPS this job, and a skipped job reports neutral rather than
  # failing -- the exact "absence looks like health" failure this workflow keeps
  # closing. The job must run precisely when its dependencies did badly.
  #
  # NOT NAMED "Verification gate", AND THAT IS DELIBERATE. gate_integrity
  # requires exactly one step by that name and requires it to live in job
  # `frontend`; a second one here would trip `found 2` and hard-fail preflight.
  # `frontend`'s own gate still decides `frontend`. This decides the run.
  frontend-verdict:
    name: frontend-verdict
    runs-on: ubuntu-latest
    needs: [changes, frontend, frontend-mutation, frontend-scenes]
    if: always()
    # A checkout, one artifact download and one Node script. Measured at 2-3s.
    # Ten minutes is generous; GitHub's undeclared default is six hours, and
    # this is the job that carries the run's single verdict -- the worst one to
    # leave able to hang, because everything else has already finished and is
    # waiting on it.
    timeout-minutes: 10
    steps:
      # THE VERDICT IS WRITTEN DOWN, NOT ONLY EXITED.
      #
      # This is a required check, and `gate_integrity` refuses a mandatory gate
      # that preserves no evidence -- correctly: a check whose only output is an
      # exit code cannot be audited after the run, and "it was green" becomes
      # unfalsifiable the moment the logs age out. The three results are the
      # whole verdict, so the file is three lines.
      - name: Record the three results
        if: always()
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          MUTATION_RESULT: ${{ needs.frontend-mutation.result }}
          SCENES_RESULT: ${{ needs.frontend-scenes.result }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verdict
          {
            echo "frontend=$FRONTEND_RESULT"
            echo "mutation=$MUTATION_RESULT"
            echo "scenes=$SCENES_RESULT"
          } > verdict/frontend-verdict.txt
          cat verdict/frontend-verdict.txt

      - name: Upload the verdict
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: learning-canvas-frontend-verdict
          path: verdict/frontend-verdict.txt
          if-no-files-found: error

      - name: Aggregate verdict
        # `!= 'success'` rather than `== 'failure'`: a cancelled or skipped
        # dependency is also not a pass, and treating either as one is how a
        # run with no evidence behind it reports green.
        #
        # GUARDED ON `changes` FIRST, AND THE GUARD IS NOT A WEAKENING.
        #
        # When the frontend was touched, the rule above is unchanged: a
        # cancelled or skipped dependency is still not a pass, for exactly the
        # reason given. When it was NOT touched, all three dependencies are
        # `skipped` BY DESIGN, and failing on that would convert the reporting
        # fix into a permanent red -- the same block, one step further along.
        if: >-
          needs.changes.outputs.frontend == 'true' && (
            needs.frontend.result != 'success' ||
            needs.frontend-mutation.result != 'success' ||
            needs.frontend-scenes.result != 'success'
          )
        # Through `env:`, for the reason given on the Verification gate above:
        # this file forbids `${{ }}` in a shell body and then used it here.
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          MUTATION_RESULT: ${{ needs.frontend-mutation.result }}
          SCENES_RESULT: ${{ needs.frontend-scenes.result }}
        shell: bash
        run: |
          set -o pipefail
          {
            echo "### Frontend verification failed"
            echo
            echo "All three jobs ran, so this is the complete list, not the"
            echo "first failure. Open the failing job for its own summary."
            echo
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| frontend | $FRONTEND_RESULT |"
            echo "| mutation | $MUTATION_RESULT |"
            echo "| scenes | $SCENES_RESULT |"
            echo
            echo "Browser failures are annotated on the panel source that drew"
            echo "them. The \`learning-canvas-frontend-findings-<project>\`"
            echo "artifacts carry the machine-readable set per viewport."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
