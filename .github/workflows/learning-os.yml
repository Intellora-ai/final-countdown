name: learning-os

# Scoped to its own directory on purpose.
#
# The Learning OS is a separate package with a separate dependency set, and the
# frontend job already takes 12-18 minutes on this repository. A workflow that
# fired on every push would make every frontend change wait on a Python suite
# that could not possibly be affected by it, and vice versa. Paths keep the two
# independent.
on:
  push:
    branches: [main]
    paths:
      - "learning-os/**"
      - ".github/workflows/learning-os.yml"
  pull_request:
    paths:
      - "learning-os/**"
      - ".github/workflows/learning-os.yml"

# Supersede only within the same pull request, matching the convention the other
# workflows in this repository already follow: a newer commit on the SAME PR
# obsoletes the older result, but a push to main is the authoritative
# verification of an already-merged commit and must never be cancelled.
concurrency:
  group: learning-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  learning-os:
    name: learning-os
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learning-os

    # THIS JOB MUST PASS WITH NO NETWORK AND NO API KEY.
    #
    # The engine's tests run against a deterministic fake LLM. That is not a
    # convenience: a suite that needs a real model is a suite that is skipped
    # the first time a key expires, and the tests that would then stop running
    # are precisely the ones asserting the engine does not fabricate confidence.
    # No step below may read LEARNING_OS_LLM_API_KEY.
    env:
      PYTHONHASHSEED: "0"

    steps:
      # Pinned to commit SHAs, not tags. A tag is a mutable ref the upstream
      # owner can move, so `@v4` means the same commit can run different CI on
      # different days -- which makes a green result unrepeatable and therefore
      # not evidence. The `# v...` comment is what keeps the pin reviewable and
      # lets Dependabot bump it. Both are enforced by tests/test_supply_chain.py;
      # this file failed all of it, and these are the SHAs the rest of the
      # repository already uses.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # 3.12 to match every other Python job here. It was 3.11 for no reason
      # beyond `requires-python = ">=3.11"`, and a lone version means this job
      # resolves a different dependency graph than the rest of the repository.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: learning-os/requirements-learning-os.lock

      # ONE HASH-LOCKED INSTALL. No `pip install -e .`, and that is deliberate.
      #
      # tests/test_supply_chain.py rejects any pip install that is not
      # `--require-hashes -r <lock>`, with no exemption for the local package --
      # correctly, because `-e` executes arbitrary build code, and an unverified
      # toolchain inside the verification system defeats the point of the system.
      #
      # So the package is not installed; `src` goes on PYTHONPATH below. The
      # consequence is recorded in the lock file's header: under PYTHONPATH the
      # `import learning_os` sandbox test is weak, because `-I` genuinely strips
      # PYTHONPATH. The test that carries that property here is the one using
      # `pydantic`, which this lock puts into real site-packages -- the same
      # situation the engine is in once deployed.
      - name: Install
        run: pip install --quiet --require-hashes -r requirements-learning-os.lock

      - name: Ruff
        run: ruff check src tests

      - name: Types
        # --strict, because the whole value of this engine is that its state can
        # be trusted after the fact. An untyped value crossing the policy layer
        # is what makes a wrong decision unexplainable.
        #
        # `tests` as well as `src`. Checking only `src` let six type errors
        # accumulate in the test files unseen, and the tests are where the
        # invariants are actually asserted -- a test file that does not
        # type-check is an unenforced enforcement.
        run: mypy --strict src/learning_os tests
        env:
          PYTHONPATH: src

      - name: Tests
        run: pytest tests -q
        env:
          PYTHONPATH: src

      - name: No credential may be committed
        # Cheap, and it catches the one mistake that cannot be undone by a
        # revert. Looks for an assigned key rather than the bare name, so the
        # env-var reference in this file and in the README does not self-trip.
        run: |
          if grep -rInE "LEARNING_OS_LLM_API_KEY[[:space:]]*=[[:space:]]*['\"][^'\"]+" \
               --include='*.py' --include='*.toml' --include='*.json' . ; then
            echo "::error::a value is assigned to LEARNING_OS_LLM_API_KEY in tracked source"
            exit 1
          fi
          echo "no assigned credential found"

      # The offline guarantee is enforced in tests/conftest.py, not here.
      # A CI-only check would pass locally on a machine with wifi on the day
      # someone introduced a live call, and only fail later on somebody else's
      # branch. The autouse fixture fails in the run that adds the dependency.
