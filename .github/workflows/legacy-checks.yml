# Separate manual checks for backends not packaged in the canvas Docker image.
# Their results do not authorize a canvas release or claim formal proof readiness.
name: Legacy backend checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legacy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  root-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python3 -m pip install --require-hashes -r requirements.lock
      - run: python3 -m pytest -m 'not axle'
  learning-os:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    defaults:
      run:
        working-directory: learning-os
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: learning-os/requirements-learning-os.lock
      - run: python3 -m pip install --require-hashes -r requirements-learning-os.lock
      - run: python3 -m pytest tests --ignore=tests/db
  practice-map:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: practice-map
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm run check
