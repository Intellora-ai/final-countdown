name: mutation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install --quiet -r requirements.txt
      # Layer 5: scores the SPEC against AST mutants, not the test suite
      # against mutmut. Equivalent mutants are excluded from the denominator.
      - name: Mutation discrimination (per function)
        run: |
          set -euo pipefail
          python3 scripts/spec_source.py specs/*_spec.lean > /tmp/pairs.txt
          cut -d= -f2 /tmp/pairs.txt | sort -u | while read -r src; do
            specs=$(grep "=${src}$" /tmp/pairs.txt | cut -d= -f1 | tr '\n' ' ')
            echo "── $src"
            python3 scripts/mutation_gate.py $specs --min-score 0.95
          done
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-mutmut
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
