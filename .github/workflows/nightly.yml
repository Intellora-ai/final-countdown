name: nightly

# The deeper generated sweep. Same suites, far more examples.
#
# WHY A SEPARATE SCHEDULE AND NOT JUST A BIGGER NUMBER ON EVERY PULL REQUEST.
#
# `tests/api/test_schemathesis.py` runs 30 examples per operation on every pull
# request, which is enough to catch a route that answers 5xx or returns a shape
# its schema does not describe -- both of which it did catch, on its first run.
# Raising that to 500 would find rarer inputs and add minutes to the critical
# path of every change, most of which touch neither the API nor its schema.
#
# So: a fast profile where speed is the constraint, a thorough one where it is
# not. The number is the only difference. There is no separate suite to keep in
# step, because a nightly suite that diverges from the pull-request suite is two
# things to maintain and one of them is never read.
on:
  schedule:
    # 03:00 UTC. Off the working day for this repository, and after the daily
    # dependency bots have opened whatever they are going to open.
    - cron: "0 3 * * *"
  # Manual runs, so a change to this file can be tested without waiting a day
  # and without committing a temporary schedule.
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  # NEVER cancelled. Unlike a pull request, there is no newer commit that
  # obsoletes this result -- each night is its own measurement.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzzing:
    name: fuzzing
    runs-on: ubuntu-latest
    # The fast profile takes well under a minute. Sixteen times the examples
    # should not approach this, and the ceiling exists to stop a pathological
    # generation holding a runner rather than to bound normal work.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: learning-os

    env:
      PYTHONHASHSEED: "0"
      # Read by tests/api/test_schemathesis.py. Absent on pull requests, so the
      # fast default applies there and nothing has to be remembered.
      SCHEMATHESIS_MAX_EXAMPLES: "500"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: learning-os/requirements-learning-os.lock

      - name: Install
        run: pip install --quiet --require-hashes -r requirements-learning-os.lock

      # The committed document is what the generator reads. A stale one would
      # make this entire run exercise an API that no longer exists, so it is
      # checked before anything is generated rather than after.
      - name: The committed schema matches the code
        run: python3 ../scripts/openapi_drift.py --root ..
        env:
          PYTHONPATH: src

      - name: Generated API sweep
        run: python3 -m pytest tests/api -q
        env:
          PYTHONPATH: src

  llm-eval:
    name: llm-eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    # P11-T6. The evaluation of the four live model call sites.
    #
    # WHY THIS IS THE OFFLINE SUITE AND NOT A LIVE ONE.
    #
    # Every input is a recorded fixture, so this costs nothing and returns the
    # same verdict every run. `practice.eval.test.ts` replaces `fetch` with a
    # throwing stub for the duration of the suite, so an edit that reaches for a
    # real provider fails here rather than quietly adding a bill. A comment
    # saying "runs offline" is a promise; the stub is the guard.
    #
    # A run against the real Anthropic and Gemini APIs is deliberately NOT built.
    # It needs credentials this repository does not hold and it spends money on
    # every execution, and neither is a decision a build step should take on its
    # own. This job is the seam it would land in: add the provider step here,
    # behind the secrets, and the scoring and baselines above already exist.
    #
    # WHY IT RUNS NIGHTLY AT ALL, GIVEN THE PULL-REQUEST SUITE RUNS IT TOO.
    #
    # Not for a different verdict --- for the same verdict on a schedule. The
    # fixtures, the baseline and the metrics it borrows from `src/websearch` all
    # live in files that other work edits. A gate that is only ever exercised by
    # the pull request that changes it can rot for a month without anyone
    # finding out, and a scheduled failure is how that gets noticed on the day
    # rather than at the next release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Typecheck first, and `evals/` is one of the four projects it covers.
      # `e2e/` is covered by none of them, and an undeclared identifier there
      # once reached CI as a ReferenceError after typecheck had passed cleanly.
      - name: Typecheck
        run: npm run typecheck

      - name: Offline model evaluation
        run: npx vitest run evals/ --reporter=basic
