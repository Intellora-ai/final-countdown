name: pr-fast
on:
  pull_request:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      # PyYAML is not optional here: the adversarial tests run
      # gate_integrity.py, which parses workflow YAML. A hand-listed
      # subset drifts from requirements.txt every time a verifier gains
      # a dependency — that is exactly how this job broke.
      - run: pip install --quiet axiom-axle pytest hypothesis PyYAML
      - name: Spec strength gate
        run: python3 scripts/enforce_spec.py specs/*_spec.lean
      - name: AXLE proof gate
        run: python3 scripts/axle_gate.py
      - name: Unit tests
        run: pytest -q
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-fast
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
