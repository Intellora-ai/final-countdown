name: pr-fast
on:
  pull_request:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      # requirements.txt, not a hand-listed subset. This job broke three
      # times from the same cause: a verifier gained a dependency (PyYAML for
      # workflow parsing, bandit[sarif] for SARIF) and this list did not
      # follow. A second dependency declaration drifts by construction, so
      # there is now one.
      - run: pip install --quiet -r requirements.txt
      - name: Spec strength gate
        run: python3 scripts/enforce_spec.py specs/*_spec.lean
      - name: AXLE proof gate
        run: python3 scripts/axle_gate.py
      - name: Unit tests
        run: pytest -q
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reports-fast
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
