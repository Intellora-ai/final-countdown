name: pr-fast
on:
  pull_request:
# Cancel a run only when a newer commit on the SAME pull request has
# superseded it. `github.ref` is the PR ref, so runs on different PRs never
# cancel each other.
#
# cancel-in-progress is deliberately conditional. On a push to main the run IS
# the authoritative verification of a commit that is already merged -- killing
# it would leave a merged commit with no completed verification, which is the
# one outcome this repository exists to prevent. Superseding only happens on
# pull_request, where a newer commit genuinely obsoletes the older result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          # Key the cache on what is actually installed, not on the file of
          # floors that no longer decides anything.
          cache-dependency-path: requirements.lock
      # requirements.lock, not a hand-listed subset. This job broke three
      # times from the same cause: a verifier gained a dependency (PyYAML for
      # workflow parsing, bandit[sarif] for SARIF) and this list did not
      # follow. A second dependency declaration drifts by construction, so
      # there is now one. --require-hashes closes the other half of the same
      # hole: requirements.txt pinned ranges, so the same commit verified
      # against different dependency versions on different days.
      - run: pip install --quiet --require-hashes -r requirements.lock
      - name: Spec strength gate
        run: python3 scripts/enforce_spec.py specs/*_spec.lean
      - name: AXLE proof gate
        run: python3 scripts/axle_gate.py
      - name: Unit tests
        run: pytest -q
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports-fast
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
