name: real-life

on:
  pull_request:
    paths:
      - 'learning-os/**'
      - '.github/workflows/real-life.yml'
  push:
    branches: [main]
    paths:
      - 'learning-os/**'
      - '.github/workflows/real-life.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-life-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deterministic:
    name: deterministic-features
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: learning-os
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: learning-os/requirements-learning-os.lock

      - name: Install locked dependencies
        run: pip install --require-hashes -r requirements-learning-os.lock

      - name: Run product feature suite
        env:
          PYTHONHASHSEED: '0'
          LEARNING_OS_LLM_PROVIDER: fake
        run: behave features/ --no-capture

  live:
    name: live-model
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: learning-os
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            learning-os/requirements-learning-os.lock
            learning-os/requirements-live.lock

      - name: Install locked dependencies
        run: |
          pip install --require-hashes -r requirements-learning-os.lock
          pip install --require-hashes -r requirements-live.lock

      - name: Require the live-model credential
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error title=Missing live-model credential::GEMINI_API_KEY is required for the live-model verification. The job fails instead of skipping verification."
            exit 1
          fi

      - name: Run product feature suite against the real model
        env:
          LEARNING_OS_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LEARNING_OS_LLM_PROVIDER: gemini
          PYTHONHASHSEED: '0'
        run: behave features/ --no-capture

      - name: Upload live-model receipt
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: real-life-receipt-${{ github.sha }}-${{ github.run_id }}
          path: learning-os/.real-infra-proof
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
