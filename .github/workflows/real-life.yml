name: real-life

# THE JOB THAT WAS NEVER BUILT.
#
# WHAT WENT WRONG, MEASURED 2026-09-01
# ------------------------------------
# `learning-os.yml` states, in capitals, that its job "MUST PASS WITH NO
# NETWORK AND NO API KEY", and forbids any step from reading a credential. That
# rule is CORRECT for a unit suite: a suite that needs a key is a suite that is
# skipped the first time the key expires, and the tests that stop running are
# the ones asserting the engine does not fabricate confidence.
#
# The defect was never that rule. It was that nothing was ever built BESIDE it.
# "The unit tests run offline" quietly became "the only tests that exist run
# offline", and so:
#
#   * every learning-os test answered from `llm/client.py` `_SKELETONS`, a dict
#     of format strings;
#   * `features/` -- the suite whose own header says "Nothing here is pretend"
#     -- was run by NO workflow at all (grep: 0 hits for "behave" across
#     .github/workflows on 2026-09-01);
#   * `frontend/scripts/mutation-gate.mjs` (60KB) and `reachability-gate.mjs`,
#     the two tools written specifically to catch a test that cannot fail, were
#     likewise wired to nothing.
#
# So every green tick on this repository certified that `add`, `subtract`,
# `multiply` and `clamp` were correct -- `verify.yml` runs `--cov=src`, and
# `src/` contains exactly those four files -- while the tutor, the canvas and
# the engine were verified by nobody.
#
# This workflow is the missing half. It is the ONLY place a real credential is
# used, so `learning-os.yml`'s offline rule stays intact and unweakened.

on:
  pull_request:
  push:
    branches: [main]
  # THE LIVE MODEL RUNS ON A SCHEDULE AND ON MAIN, NOT ON EVERY PULL REQUEST.
  #
  # Approved by the repository owner on 2026-09-02, after the receipt printed
  # the vendor's own reason for five red runs in a row: `429 RESOURCE_EXHAUSTED
  # ... generate_content_free_tier_requests, limit: 20`. A free-tier key spent
  # by a morning's pushes was deciding the colour of pull requests that had not
  # touched the engine. On a pull request the same suite -- the same shipped
  # process over the same stdin and stdout, every scenario -- runs on the
  # deterministic provider; the live model is proven nightly and on main, where
  # a red is a finding about the model and not about a quota clock.
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: real-life-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ #
  # A REAL MODEL ANSWERS, OR THIS GOES RED.
  # ------------------------------------------------------------------ #
  real-tutor:
    name: real-tutor
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # UNIVERSAL FINDING NET -- registered right after checkout, because the
      # matcher FILE must exist in the workspace before ::add-matcher:: can
      # read it. The matchers turn any mypy / pytest-frame / eslint / pyright /
      # gcc-shaped log line into a file-and-line annotation; ci-findings.yml
      # reconciles what was emitted against what GitHub accepted, post-run.
      - name: Teach the runner to read tool findings
        run: echo "::add-matcher::.github/matchers/tools.json"

      # PYTHON 3.12, AND THE VERSION IS LOAD-BEARING.
      #
      # Measured on the maintainer's machine 2026-09-01: under Python 3.14.7,
      # `behave --version` never returns. It hangs during import --
      #   behave/__init__.py:23 -> step_registry.py:13 -> matchers.py:19
      #     -> parse_type/cfparse.py:11 -> from .parse_util import FieldParser
      # -- and produces no output at all. Captured with faulthandler, from an
      # empty directory, with no project config in scope, so it is the toolchain
      # and not this repository.
      #
      # That is why the Stop hook's log was 0 bytes: it ran behave, behave hung,
      # the 900s timeout killed it, and the gate blocked with nothing to say.
      # The suite had never executed once.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            learning-os/requirements-learning-os.lock
            learning-os/requirements-behave.lock

      - name: Install the engine's dependencies and the runner
        run: |
          pip install --quiet --require-hashes -r learning-os/requirements-learning-os.lock
          # HASH-LOCKED LIKE EVERY OTHER INSTALL IN THIS REPOSITORY, and the
          # comment below already said why: `tests/test_supply_chain.py` forbids
          # a pip install that is not hash-locked, because an unverified
          # toolchain inside the verification system verifies nothing. This line
          # was `pip install --quiet behave` and it failed that test, which is
          # what held the `coverage` gate -- and `coverage` is one of the
          # twenty-one checks the branch ruleset requires, so one unpinned
          # package blocked the merge of everything behind it.
          pip install --quiet --require-hashes -r learning-os/requirements-behave.lock

      # GEMINI, AND THE HISTORY GOES BOTH WAYS -- WRITTEN DOWN SO IT STOPS.
      #
      # This step once selected `gemini` and failed on every run because no
      # Gemini credential existed; it was moved to `groq` because that was the
      # one key the repository held. Then Groq's DAILY TOKEN BUDGET spent
      # itself on 2026-09-01 and this job failed six consecutive reruns across
      # five hours -- a required check red about a vendor's clock while every
      # law in the suite was green. The owner then provisioned Gemini, Mistral
      # and Z.AI credentials and approved this switch, in those words: the
      # receipts must not be welded to one vendor's quota.
      #
      # `gemini_client.py` needs `google.genai`, which the base lock refuses on
      # purpose (its own header says why: the OFFLINE job must stay SDK-free).
      # THIS job is the live-model job, so it installs the live lock -- hash-
      # locked like every install in this repository, which is exactly the
      # shape `tests/test_supply_chain.py` permits.
      #
      # FAIL-CLOSED ON A MISSING CREDENTIAL, AND NOT SILENTLY SKIPPED.
      #
      # The tempting shape is `if: secrets.GROQ_API_KEY != ''`. GitHub counts
      # a skipped job as SATISFYING its required status check, so that spelling
      # turns "we could not verify this" into a green tick -- which is the exact
      # class of false positive this whole workflow exists to remove, reproduced
      # in the fix for it.
      #
      # This repository is single-maintainer and public. A fork pull request has
      # no secrets and will fail here; that is visible and explainable, which is
      # the property being bought. The receipt step below refuses the run
      # anyway, so a missing key can never quietly become a fake-answered pass.
      #
      # THE VARIABLE IS PREFIXED AND THE SECRET IS NOT, AND THAT IS ON PURPOSE.
      # The prefixed spelling is the only name the engine reads, and
      # `features/steps/tutor_steps.py` strips the UNPREFIXED vendor names from
      # the child process to prove the offline path -- a bare vendor key here
      # would be stripped by the very step that is meant to exercise it.
      - name: Install the live-model SDK, hash-locked like everything else
        run: pip install --quiet --require-hashes -r learning-os/requirements-live.lock

      # WHICH PROVIDER, DECIDED BY THE EVENT. See the `schedule` trigger above:
      # a pull request runs the whole suite on the deterministic provider (no
      # key is handed to it at all); a push to main or the nightly run hands it
      # the live key and requires a real answer below. Both are passed through
      # `env:`, never interpolated into the shell body.
      - name: The real-life suite, answered by a real model
        env:
          LEARNING_OS_GEMINI_API_KEY: ${{ github.event_name == 'pull_request' && '' || secrets.GEMINI_API_KEY }}
          LEARNING_OS_LLM_PROVIDER: ${{ github.event_name == 'pull_request' && 'fake' || 'gemini' }}
          PYTHONHASHSEED: '0'
        run: |
          if [ "${LEARNING_OS_LLM_PROVIDER}" = "gemini" ] && [ -z "${LEARNING_OS_GEMINI_API_KEY}" ]; then
            echo "::error title=no credential::secrets.GEMINI_API_KEY is not set on this repository, so the real-life suite cannot reach a model. Add it in Settings > Secrets and variables > Actions. This job fails rather than skipping, because a skipped required check reads as green."
            exit 1
          fi
          echo "real-life suite on provider: ${LEARNING_OS_LLM_PROVIDER} (event: ${GITHUB_EVENT_NAME})"
          behave features/ --no-capture

      # THE RECEIPT IS THE EVIDENCE, AND IT MUST RECORD WHO ANSWERED.
      #
      # Nothing anywhere in this repository records whether an answer came from
      # a model or from a format string, so "was it real?" is not a question the
      # evidence can currently be asked. This step prints the receipt and fails
      # if it is absent or claims no real answers.
      #
      # KNOWN BLOCKER, MEASURED 2026-09-01 AND LEFT LOUD ON PURPOSE.
      # `features/environment.py` writes `.real-infra-proof` with
      # scenarios_run, real_os_processes_started and canvas_compose_present --
      # and no `real_model_answers`. grep across the tree returns that field in
      # this file and nowhere else, so this step fails with "the receipt records
      # zero answers from a real model" EVEN WHEN a real model answered every
      # scenario. Wiring the provider does not fix it; the receipt has to start
      # recording provenance, which `GeneratedContent.note` already carries
      # (`groq:<model>` versus `fake:<strategy>:<digest>`).
      #
      # The check is deliberately NOT relaxed to get past this. A green tick
      # bought by deleting the assertion that a real model answered would
      # recreate the exact false positive this whole workflow was built to
      # remove, and the receipt would go back to being worth nothing.
      # THE RECEIPT IS JUDGED BY WHAT THE RUN WAS ALLOWED TO CLAIM. A live run
      # must record at least one answer from a real model, as before. A pull
      # request ran the deterministic provider, so it must record that ITS
      # scenarios ran and that it claims NO real answer -- a receipt saying a
      # real model answered on the fake would be the false evidence this gate
      # exists to refuse. Neither path is a skip.
      - name: Prove a real model answered
        if: always()
        env:
          EXPECT_LIVE: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ ! -f .real-infra-proof ]; then
            echo "::error title=no receipt::features/environment.py wrote no .real-infra-proof, which it does only when no scenario ran at all."
            exit 1
          fi
          cat .real-infra-proof
          python3 - <<'PY'
          import json, os, sys, pathlib
          receipt = json.loads(pathlib.Path(".real-infra-proof").read_text())
          real = receipt.get("real_model_answers", 0)
          ran = receipt.get("scenarios_run", 0)
          if ran < 1:
              sys.exit("::error title=no scenarios::the receipt records no scenario, so nothing was proven")
          if os.environ.get("EXPECT_LIVE") == "true":
              if real < 1:
                  sys.exit("::error title=no real answers::the receipt records zero answers from a real model")
              print(f"{real} answer(s) came from a real model")
          else:
              if real != 0:
                  sys.exit("::error title=fake claimed real::a pull request runs the deterministic provider, yet the receipt claims a real model answered")
              print(f"{ran} scenario(s) ran on the deterministic provider; the live model is proven on the schedule and on main")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports-real-life
          path: |
            .real-infra-proof
          # THE RECEIPT IS A DOTFILE, AND THE ACTION SKIPS DOTFILES BY DEFAULT
          # since upload-artifact v4.4 -- so every run of this job ended with
          # "No files were found with the provided path: .real-infra-proof"
          # while the prove step above was READING that same file. The proof
          # existed and the evidence trail said it did not, which is the exact
          # absence-looks-like-health failure this workflow exists to close.
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  # ------------------------------------------------------------------ #
  # THE TWO GATES THAT EXISTED AND RAN NOWHERE.
  # ------------------------------------------------------------------ #
  #
  # Both were written, both are substantial, and grep across .github/workflows
  # found zero references to either on 2026-09-01. They ran only from a local
  # Stop hook whose behave step hung, so in practice they never ran at all.
  #
  # Mutation testing is the ONLY mechanical check that answers "can this test
  # fail?". Every other gate in this repository asks whether something ran.
  # That distinction is the whole subject of this repository's problem, so the
  # tool that measures it belongs in CI and not in a hook on one laptop.
  # `cannot-fail-gates` LIVED HERE AND IS GONE, AND NOTHING RUNS LESS.
  #
  # It re-ran `npm run gate:reachability` -- byte-identical to the step inside
  # the REQUIRED `frontend` context -- and `npm run test:mutation` UNSHARDED,
  # the union of what the four `frontend-mutation` shards behind the REQUIRED
  # `frontend-verdict` context already execute. Its own DEBT entry said it
  # blocked nothing. Measured, the unsharded catalogue is ~550-650s: this one
  # advisory duplicate was the longest single stretch of wall clock in the
  # repository. The same two gates run on every PR, once, where a red actually
  # stops the merge.
  real-planner:
    name: real-planner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # UNIVERSAL FINDING NET -- registered right after checkout, because the
      # matcher FILE must exist in the workspace before ::add-matcher:: can
      # read it. The matchers turn any mypy / pytest-frame / eslint / pyright /
      # gcc-shaped log line into a file-and-line annotation; ci-findings.yml
      # reconciles what was emitted against what GitHub accepted, post-run.
      - name: Teach the runner to read tool findings
        run: echo "::add-matcher::.github/matchers/tools.json"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # `dist-server/index.js` is what `npm run server` boots and what
      # `server/boot.test.ts` measures, so the bundle under test here is the
      # one the product ships rather than a `tsx` invocation of the sources.
      - name: Build the planner
        run: npm run server:build

      # FAIL-CLOSED ON A MISSING CREDENTIAL, EXACTLY AS `real-tutor` DOES.
      #
      # Not `if: secrets.GROQ_API_KEY != ''`. GitHub counts a skipped job as
      # SATISFYING a required status check, so that spelling turns "we could
      # not verify this" into a green tick -- the precise false positive this
      # whole workflow exists to remove. The reasoning is written out at length
      # on `real-tutor`'s credential step above and is not repeated here.
      #
      # WHAT A PASS MEANS, STATED SO A GREEN TICK CANNOT BE OVERREAD.
      #   * the credential exists and Gemini accepted it;
      #   * `chooseProvider` picked the gemini branch, printed at boot --
      #     gemini is FIRST in `provider.ts`'s VENDORS, so a present Gemini key
      #     is the primary by construction, and the other keys below are the
      #     standbys `failover.ts` was built for;
      #   * a real model returned a lesson that `validateLesson` ACCEPTED.
      #
      # The third clause is the one with teeth. `handler.ts` answers 502 with
      # "the model returned a lesson that failed validation" when the model is
      # reached and its answer is refused, and 200 only when a real lesson came
      # back whole. Run 33444764358 shows that refusal firing against the unit
      # suite's own fixtures, so it is not a theoretical branch. A 502 here is
      # a genuine finding -- the configured product cannot produce a lesson --
      # and it is reported as one rather than tolerated.
      #
      # THE KEY IS NEVER ECHOED. It reaches the process through `env:` and the
      # emptiness test reads the variable, never prints it; the assertions
      # below print status codes and the model's block text, and the boot log
      # is grepped for the provider NAME, which `boot.test.ts` already proves
      # is printed without the key beside it.
      - name: A real model writes a lesson the validator accepts
        env:
          # THE SECOND GEMINI KEY, WHEN ONE EXISTS. Two live jobs sharing one
          # key share one quota, and one vendor's clock blocking a merge for a
          # night is the exact failure this whole block was rewritten to end.
          # The `||` falls back to the first key, so one key is enough to run.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_2 || secrets.GEMINI_API_KEY }}
          # THE STANDBYS, EVERY SLOT A PLACEHOLDER. `provider.ts` treats a
          # blank as unset ("Blank and whitespace-only are unset"), so a secret
          # that does not exist renders empty here and its vendor is skipped:
          # each line is inert until the owner supplies the secret, and a real
          # standby in `failover.ts`'s chain from the moment they do.
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PORT: '8788'
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "::error file=.github/workflows/real-life.yml,title=no credential::secrets.GEMINI_API_KEY is not set on this repository, so the planner cannot reach a model. Add it in Settings > Secrets and variables > Actions. This job fails rather than skipping, because a skipped required check reads as green."
            exit 1
          fi

          node dist-server/index.js > "$RUNNER_TEMP/planner.log" 2>&1 &
          planner=$!
          trap 'kill "${planner}" 2>/dev/null || true' EXIT

          # Poll rather than sleep: /api/health is the one route that answers a
          # GET precisely so a waiting process can ask "are you there".
          up=""
          for _ in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:8788/api/health" > /dev/null 2>&1; then
              up=1
              break
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/planner.log"

          # Without this check a server that never answered fell through to the
          # grep below and the failure blamed the provider choice instead of
          # the boot -- a message about the wrong thing.
          if [ -z "$up" ]; then
            echo "::error file=frontend/server/index.ts,title=the planner never came up::/api/health did not answer within 60s; the log above holds the boot failure"
            exit 1
          fi

          if ! grep -q "via gemini" "$RUNNER_TEMP/planner.log"; then
            echo "::error file=frontend/server/provider.ts,title=wrong provider::the planner booted without choosing the gemini branch, so whatever answered below was not the model this job is meant to exercise"
            exit 1
          fi

          status=$(curl -sS -o "$RUNNER_TEMP/lesson.json" -w '%{http_code}' \
            -X POST "http://127.0.0.1:8788/api/lesson" \
            -H 'content-type: application/json' \
            --data '{"concept":"photosynthesis","subject":"biology"}')

          echo "POST /api/lesson -> ${status}"
          cat "$RUNNER_TEMP/lesson.json"
          echo

          python3 - "$status" <<'PY'
          import json, pathlib, os, sys

          status = sys.argv[1]
          raw = pathlib.Path(os.environ["RUNNER_TEMP"], "lesson.json").read_text()

          # A non-JSON body is its own finding and must not arrive as a
          # traceback: `handler.ts` answers JSON on every path it owns, so
          # anything else means the reply did not come from the planner at all.
          try:
              body = json.loads(raw)
          except json.JSONDecodeError:
              sys.exit(
                  "::error file=frontend/server/handler.ts,title=the reply was not JSON::"
                  f"POST /api/lesson answered {status} with a body the planner cannot have "
                  "written: " + raw[:400]
              )
          if not isinstance(body, dict):
              sys.exit(
                  "::error file=frontend/server/handler.ts,title=the reply was not an object::"
                  f"POST /api/lesson answered {status} with {type(body).__name__}"
              )

          if status == "502":
              sys.exit(
                  "::error file=frontend/server/handler.ts,title=the real model's lesson was refused::"
                  "a real model answered and validateLesson refused what it wrote: "
                  + json.dumps(body.get("issues", body.get("error")))
              )
          if status != "200":
              sys.exit(
                  "::error file=frontend/server/groq.ts,title=the planner did not answer::"
                  f"POST /api/lesson answered {status}: " + json.dumps(body.get("error", body))[:400]
              )

          lesson = body.get("lesson")
          blocks = lesson.get("blocks") if isinstance(lesson, dict) else None
          if not blocks:
              sys.exit(
                  "::error file=frontend/server/validate.ts,title=an empty lesson passed validation::"
                  "the reply was 200 with no blocks in it, so nothing was taught and the "
                  "validator did not object"
              )
          print(f"a real model wrote {len(blocks)} block(s) and the validator accepted them")
          PY

      - name: Upload the planner's log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports-real-planner
          path: ${{ runner.temp }}/planner.log
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------ #
  # THE SIX LAWS. THE ONLY SUITE THAT MEASURES THE CHILD, NOT THE CODE.
  # ------------------------------------------------------------------ #
  #
  # `frontend/tests/integration/law-*.spec.ts` is six laws about what a learner
  # is owed -- A: an answer must teach her something she did not already have on
  # screen; B: asked what it does not teach, it says so and invents nothing;
  # C: no machine code ever reaches her; D: a button that promises, delivers;
  # E: work survives closing the tab; F: back never strands her.
  #
  # WHY NO WORKFLOW RAN THEM UNTIL NOW, MEASURED 2026-09-01.
  # `real-life.yml` existed only on a developer's disk. GET on
  # .github/workflows/real-life.yml returned 404 for both `main` and `codex`, so
  # the file that would have run these was on no branch. There was also no npm
  # script: the suite could only be started by typing the config path by hand.
  # Both halves are fixed -- the file is on the branch, and `test:laws` exists.
  #
  # THIS JOB IS KEYLESS, AND THAT IS THE POINT, NOT AN OVERSIGHT.
  # `playwright.reallife.config.ts` says it in its own header: most people who
  # open this app will not have a key, so that state IS real life, and a suite
  # that only runs in the everything-provided configuration cannot see this
  # class of defect at all. Law C exists precisely because an unconfigured app
  # showed a child "the planner answered 500". Give this job a credential and
  # that law can never fail again -- which is not the same as it being upheld.
  #
  # ALL THREE ENGINES. The config declared two projects and both were Chromium
  # underneath (Desktop Chrome and Pixel 7), so "it works in the browser" meant
  # one browser. Firefox and WebKit are declared now and run here.
  #
  # Measured locally 2026-09-01 before this job existed: 11 passed in 5.0m on
  # a-person-on-a-laptop. So a red result here is a regression, not a backlog.
  # ONE JOB PER ENGINE, AND THE WALL CLOCK IS WHY. One runner walking all four
  # projects serially was MEASURED at 18.6 minutes -- the single longest job in
  # the repository, and the tail every evidence aggregator then waited on. The
  # engines share nothing at runtime, so serialising them bought nothing but
  # time. Three runners, each installing ONLY its own engine (webkit's apt
  # dependencies now land on one machine instead of three), finish in roughly
  # the slowest single engine: ~6 minutes. Same tests, same projects, same
  # assertions -- the split changes where they run, never what runs.
  laws:
    name: laws (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # chrome was one leg carrying TWO projects (laptop + phone) and was
          # the tallest leg of the three at ~9 minutes; each project is its own
          # runner now, so the wall is one project, not two.
          - engine: laptop
            browsers: chromium
            project: a-person-on-a-laptop
          - engine: phone
            browsers: chromium
            project: a-person-on-a-phone
          - engine: firefox
            browsers: firefox
            project: a-person-on-firefox
          - engine: safari
            browsers: webkit
            project: a-person-on-safari
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # UNIVERSAL FINDING NET -- registered right after checkout, because the
      # matcher FILE must exist in the workspace before ::add-matcher:: can
      # read it. The matchers turn any mypy / pytest-frame / eslint / pyright /
      # gcc-shaped log line into a file-and-line annotation; ci-findings.yml
      # reconciles what was emitted against what GitHub accepted, post-run.
      - name: Teach the runner to read tool findings
        run: echo "::add-matcher::.github/matchers/tools.json"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # `--with-deps` because WebKit on ubuntu-latest needs system libraries the
      # runner image does not carry. Without it the browser downloads and then
      # fails to launch, which reads as a product defect rather than a missing
      # apt package.
      # THE BROWSER BINARIES, CACHED. `playwright install` downloads ~150MB of
      # Chromium on every run of every job that needs a browser -- eight jobs a
      # push, all fetching the same bytes. The INSTALL STEP STAYS: on a cache
      # hit it validates and no-ops in seconds, on a miss or a version bump it
      # downloads exactly as before, so a stale or poisoned cache cannot skip
      # validation -- this trades seconds, never assurance. Keyed on the
      # lockfile: any dependency change rebuilds the cache.
      - name: Cache playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ matrix.browsers }}-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      # `--with-deps` ONLY FOR WEBKIT: it is an apt-get update+install that the
      # browser cache cannot cover, it exists for WebKit's system libraries
      # alone, and e2e.yml records it once stalling 13 minutes on the Azure
      # mirror. The chromium and firefox legs skip the apt trip entirely.
      - name: Install this engine
        run: |
          if [ "${{ matrix.browsers }}" = "webkit" ]; then
            npx playwright install --with-deps webkit
          else
            npx playwright install ${{ matrix.browsers }}
          fi

      # NO MODEL CREDENTIAL IS SET HERE. See the block above this job.
      - name: The six laws
        run: npm run test:laws -- --project="${{ matrix.project }}"

      - name: Upload the traces so a failed law can be watched
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports-laws-${{ matrix.engine }}
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 30
