name: real-life

# THE JOB THAT WAS NEVER BUILT.
#
# WHAT WENT WRONG, MEASURED 2026-09-01
# ------------------------------------
# `learning-os.yml` states, in capitals, that its job "MUST PASS WITH NO
# NETWORK AND NO API KEY", and forbids any step from reading a credential. That
# rule is CORRECT for a unit suite: a suite that needs a key is a suite that is
# skipped the first time the key expires, and the tests that stop running are
# the ones asserting the engine does not fabricate confidence.
#
# The defect was never that rule. It was that nothing was ever built BESIDE it.
# "The unit tests run offline" quietly became "the only tests that exist run
# offline", and so:
#
#   * every learning-os test answered from `llm/client.py` `_SKELETONS`, a dict
#     of format strings;
#   * `features/` -- the suite whose own header says "Nothing here is pretend"
#     -- was run by NO workflow at all (grep: 0 hits for "behave" across
#     .github/workflows on 2026-09-01);
#   * `frontend/scripts/mutation-gate.mjs` (60KB) and `reachability-gate.mjs`,
#     the two tools written specifically to catch a test that cannot fail, were
#     likewise wired to nothing.
#
# So every green tick on this repository certified that `add`, `subtract`,
# `multiply` and `clamp` were correct -- `verify.yml` runs `--cov=src`, and
# `src/` contains exactly those four files -- while the tutor, the canvas and
# the engine were verified by nobody.
#
# This workflow is the missing half. It is the ONLY place a real credential is
# used, so `learning-os.yml`'s offline rule stays intact and unweakened.

on:
  pull_request:
  push:
    branches: [main]
  # THE LIVE MODEL RUNS ON A SCHEDULE AND ON MAIN, NOT ON EVERY PULL REQUEST.
  #
  # Approved by the repository owner on 2026-09-02, after the receipt printed
  # the vendor's own reason for five red runs in a row: `429 RESOURCE_EXHAUSTED
  # ... generate_content_free_tier_requests, limit: 20`. A free-tier key spent
  # by a morning's pushes was deciding the colour of pull requests that had not
  # touched the engine. On a pull request the same suite -- the same shipped
  # process over the same stdin and stdout, every scenario -- runs on the
  # deterministic provider; the live model is proven nightly and on main, where
  # a red is a finding about the model and not about a quota clock.
  schedule:
    - cron: '17 3 * * *'

concurrency:
  group: real-life-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------ #
  # A REAL MODEL ANSWERS, OR THIS GOES RED.
  # ------------------------------------------------------------------ #
  real-tutor:
    name: real-tutor
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # UNIVERSAL FINDING NET -- registered right after checkout, because the
      # matcher FILE must exist in the workspace before ::add-matcher:: can
      # read it. The matchers turn any mypy / pytest-frame / eslint / pyright /
      # gcc-shaped log line into a file-and-line annotation; ci-findings.yml
      # reconciles what was emitted against what GitHub accepted, post-run.
      - name: Teach the runner to read tool findings
        run: echo "::add-matcher::.github/matchers/tools.json"

      # PYTHON 3.12, AND THE VERSION IS LOAD-BEARING.
      #
      # Measured on the maintainer's machine 2026-09-01: under Python 3.14.7,
      # `behave --version` never returns. It hangs during import --
      #   behave/__init__.py:23 -> step_registry.py:13 -> matchers.py:19
      #     -> parse_type/cfparse.py:11 -> from .parse_util import FieldParser
      # -- and produces no output at all. Captured with faulthandler, from an
      # empty directory, with no project config in scope, so it is the toolchain
      # and not this repository.
      #
      # That is why the Stop hook's log was 0 bytes: it ran behave, behave hung,
      # the 900s timeout killed it, and the gate blocked with nothing to say.
      # The suite had never executed once.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            learning-os/requirements-learning-os.lock
            learning-os/requirements-behave.lock

      - name: Install the engine's dependencies and the runner
        run: |
          pip install --quiet --require-hashes -r learning-os/requirements-learning-os.lock
          # HASH-LOCKED LIKE EVERY OTHER INSTALL IN THIS REPOSITORY, and the
          # comment below already said why: `tests/test_supply_chain.py` forbids
          # a pip install that is not hash-locked, because an unverified
          # toolchain inside the verification system verifies nothing. This line
          # was `pip install --quiet behave` and it failed that test, which is
          # what held the `coverage` gate -- and `coverage` is one of the
          # twenty-one checks the branch ruleset requires, so one unpinned
          # package blocked the merge of everything behind it.
          pip install --quiet --require-hashes -r learning-os/requirements-behave.lock

      # GEMINI, AND THE HISTORY GOES BOTH WAYS -- WRITTEN DOWN SO IT STOPS.
      #
      # This step once selected `gemini` and failed on every run because no
      # Gemini credential existed; it was moved to `groq` because that was the
      # one key the repository held. Then Groq's DAILY TOKEN BUDGET spent
      # itself on 2026-09-01 and this job failed six consecutive reruns across
      # five hours -- a required check red about a vendor's clock while every
      # law in the suite was green. The owner then provisioned Gemini, Mistral
      # and Z.AI credentials and approved this switch, in those words: the
      # receipts must not be welded to one vendor's quota.
      #
      # `gemini_client.py` needs `google.genai`, which the base lock refuses on
      # purpose (its own header says why: the OFFLINE job must stay SDK-free).
      # THIS job is the live-model job, so it installs the live lock -- hash-
      # locked like every install in this repository, which is exactly the
      # shape `tests/test_supply_chain.py` permits.
      #
      # FAIL-CLOSED ON A MISSING CREDENTIAL, AND NOT SILENTLY SKIPPED.
      #
      # The tempting shape is `if: secrets.GROQ_API_KEY != ''`. GitHub counts
      # a skipped job as SATISFYING its required status check, so that spelling
      # turns "we could not verify this" into a green tick -- which is the exact
      # class of false positive this whole workflow exists to remove, reproduced
      # in the fix for it.
      #
      # This repository is single-maintainer and public. A fork pull request has
      # no secrets and will fail here; that is visible and explainable, which is
      # the property being bought. The receipt step below refuses the run
      # anyway, so a missing key can never quietly become a fake-answered pass.
      #
      # THE VARIABLE IS PREFIXED AND THE SECRET IS NOT, AND THAT IS ON PURPOSE.
      # The prefixed spelling is the only name the engine reads, and
      # `features/steps/tutor_steps.py` strips the UNPREFIXED vendor names from
      # the child process to prove the offline path -- a bare vendor key here
      # would be stripped by the very step that is meant to exercise it.
      - name: Install the live-model SDK, hash-locked like everything else
        run: pip install --quiet --require-hashes -r learning-os/requirements-live.lock

      # WHICH PROVIDER, DECIDED BY THE EVENT. See the `schedule` trigger above:
      # a pull request runs the whole suite on the deterministic provider (no
      # key is handed to it at all); a push to main or the nightly run hands it
      # the live key and requires a real answer below. Both are passed through
      # `env:`, never interpolated into the shell body.
      - name: The real-life suite, answered by a real model
        env:
          LEARNING_OS_GEMINI_API_KEY: ${{ github.event_name == 'pull_request' && '' || secrets.GEMINI_API_KEY }}
          LEARNING_OS_LLM_PROVIDER: ${{ github.event_name == 'pull_request' && 'fake' || 'gemini' }}
          PYTHONHASHSEED: '0'
        run: |
          if [ "${LEARNING_OS_LLM_PROVIDER}" = "gemini" ] && [ -z "${LEARNING_OS_GEMINI_API_KEY}" ]; then
            echo "::error title=no credential::secrets.GEMINI_API_KEY is not set on this repository, so the real-life suite cannot reach a model. Add it in Settings > Secrets and variables > Actions. This job fails rather than skipping, because a skipped required check reads as green."
            exit 1
          fi
          echo "real-life suite on provider: ${LEARNING_OS_LLM_PROVIDER} (event: ${GITHUB_EVENT_NAME})"
          behave features/ --no-capture

      # THE RECEIPT IS THE EVIDENCE, AND IT MUST RECORD WHO ANSWERED.
      #
      # Nothing anywhere in this repository records whether an answer came from
      # a model or from a format string, so "was it real?" is not a question the
      # evidence can currently be asked. This step prints the receipt and fails
      # if it is absent or claims no real answers.
      #
      # KNOWN BLOCKER, MEASURED 2026-09-01 AND LEFT LOUD ON PURPOSE.
      # `features/environment.py` writes `.real-infra-proof` with
      # scenarios_run, real_os_processes_started and canvas_compose_present --
      # and no `real_model_answers`. grep across the tree returns that field in
      # this file and nowhere else, so this step fails with "the receipt records
      # zero answers from a real model" EVEN WHEN a real model answered every
      # scenario. Wiring the provider does not fix it; the receipt has to start
      # recording provenance, which `GeneratedContent.note` already carries
      # (`groq:<model>` versus `fake:<strategy>:<digest>`).
      #
      # The check is deliberately NOT relaxed to get past this. A green tick
      # bought by deleting the assertion that a real model answered would
      # recreate the exact false positive this whole workflow was built to
      # remove, and the receipt would go back to being worth nothing.
      # THE RECEIPT IS JUDGED BY WHAT THE RUN WAS ALLOWED TO CLAIM. A live run
      # must record at least one answer from a real model, as before. A pull
      # request ran the deterministic provider, so it must record that ITS
      # scenarios ran and that it claims NO real answer -- a receipt saying a
      # real model answered on the fake would be the false evidence this gate
      # exists to refuse. Neither path is a skip.
      - name: Prove a real model answered
        if: always()
        env:
          EXPECT_LIVE: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ ! -f .real-infra-proof ]; then
            echo "::error title=no receipt::features/environment.py wrote no .real-infra-proof, which it does only when no scenario ran at all."
            exit 1
          fi
          cat .real-infra-proof
          python3 - <<'PY'
          import json, os, sys, pathlib
          receipt = json.loads(pathlib.Path(".real-infra-proof").read_text())
          real = receipt.get("real_model_answers", 0)
          ran = receipt.get("scenarios_run", 0)
          if ran < 1:
              sys.exit("::error title=no scenarios::the receipt records no scenario, so nothing was proven")
          if os.environ.get("EXPECT_LIVE") == "true":
              if real < 1:
                  sys.exit("::error title=no real answers::the receipt records zero answers from a real model")
              print(f"{real} answer(s) came from a real model")
          else:
              if real != 0:
                  sys.exit("::error title=fake claimed real::a pull request runs the deterministic provider, yet the receipt claims a real model answered")
              print(f"{ran} scenario(s) ran on the deterministic provider; the live model is proven on the schedule and on main")
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports-real-life
          path: |
            .real-infra-proof
          # THE RECEIPT IS A DOTFILE, AND THE ACTION SKIPS DOTFILES BY DEFAULT
          # since upload-artifact v4.4 -- so every run of this job ended with
          # "No files were found with the provided path: .real-infra-proof"
          # while the prove step above was READING that same file. The proof
          # existed and the evidence trail said it did not, which is the exact
          # absence-looks-like-health failure this workflow exists to close.
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  # ------------------------------------------------------------------ #
  # THE TWO GATES THAT EXISTED AND RAN NOWHERE.
  # ------------------------------------------------------------------ #
  #
  # Both were written, both are substantial, and grep across .github/workflows
  # found zero references to either on 2026-09-01. They ran only from a local
  # Stop hook whose behave step hung, so in practice they never ran at all.
  #
  # Mutation testing is the ONLY mechanical check that answers "can this test
  # fail?". Every other gate in this repository asks whether something ran.
  # That distinction is the whole subject of this repository's problem, so the
  # tool that measures it belongs in CI and not in a hook on one laptop.
  # `cannot-fail-gates` LIVED HERE AND IS GONE, AND NOTHING RUNS LESS.
  #
  # It re-ran `npm run gate:reachability` -- byte-identical to the step inside
  # the REQUIRED `frontend` context -- and `npm run test:mutation` UNSHARDED,
  # the union of what the four `frontend-mutation` shards behind the REQUIRED
  # `frontend-verdict` context already execute. Its own DEBT entry said it
  # blocked nothing. Measured, the unsharded catalogue is ~550-650s: this one
  # advisory duplicate was the longest single stretch of wall clock in the
  # repository. The same two gates run on every PR, once, where a red actually
  # stops the merge.
