name: Repo Debug Repair
on:
  push:
    branches: ["fix/full-repo-debug-2026-09-15"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install strict Python verification tools
        run: python -m pip install --quiet pyright==1.1.411

      - name: Apply verified Python typing repairs
        run: python3 scripts/repair_pyright.py

      - name: Python typecheck
        run: pyright scripts/harness/cli.py scripts/harness/state.py tests/test_harness_cli.py tests/test_harness_hooks.py tests/test_harness_state.py tests/test_harness_verify.py

      - name: Python harness regression tests
        run: pytest -q tests/test_harness_cli.py tests/test_harness_hooks.py tests/test_harness_state.py tests/test_harness_verify.py

      - name: Patch Law H failure-state identity
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/canvas/CanvasRoute.tsx')
          s = p.read_text()

          old = "  const [authorFailed, setAuthorFailed] = useState<Issue[] | null>(null)\n"
          new = old + "  const [lastAttemptedQuestion, setLastAttemptedQuestion] = useState<string | null>(null)\n"
          if "lastAttemptedQuestion" not in s:
              if old not in s:
                  raise SystemExit('Law H patch anchor 1 not found')
              s = s.replace(old, new, 1)

          old = "    const question = (asked ?? topic).trim()\n    if (question === '' || authoring) return\n\n    setAuthoring(true)\n"
          new = "    const question = (asked ?? topic).trim()\n    if (question === '' || authoring) return\n\n    setLastAttemptedQuestion(question)\n    setAuthoring(true)\n"
          if "setLastAttemptedQuestion(question)" not in s:
              if old not in s:
                  raise SystemExit('Law H patch anchor 2 not found')
              s = s.replace(old, new, 1)

          old = "          /* A lesson arrived, so the run of unanswered asks is over. */\n          setAskedBackTimes(0)\n"
          new = "          /* A lesson arrived, so the run of unanswered asks is over. */\n          setLastAttemptedQuestion(null)\n          setAskedBackTimes(0)\n"
          if "setLastAttemptedQuestion(null)" not in s:
              if old not in s:
                  raise SystemExit('Law H patch anchor 3 not found')
              s = s.replace(old, new, 1)

          old = "          </p>\n          <ul>\n            {authorFailed.slice(0, 8).map((issue, i) => (\n"
          new = "          </p>\n          {lastAttemptedQuestion !== null && (\n            <p className=\"lc-caption\">Attempted: {lastAttemptedQuestion}</p>\n          )}\n          <ul>\n            {authorFailed.slice(0, 8).map((issue, i) => (\n"
          if "Attempted: {lastAttemptedQuestion}" not in s:
              if old not in s:
                  raise SystemExit('Law H patch anchor 4 not found')
              s = s.replace(old, new, 1)

          p.write_text(s)
          print('Law H patch applied')
          PY

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Targeted Law H unit tests
        working-directory: frontend
        run: npx vitest run src/canvas/CanvasRoute.stuck.test.tsx

      - name: Commit verified repairs
        shell: bash
        run: |
          if git diff --quiet -- scripts/harness/cli.py scripts/harness/state.py tests/test_harness_cli.py tests/test_harness_hooks.py tests/test_harness_state.py tests/test_harness_verify.py frontend/src/canvas/CanvasRoute.tsx; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'GitHub Actions'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/harness/cli.py scripts/harness/state.py tests/test_harness_cli.py tests/test_harness_hooks.py tests/test_harness_state.py tests/test_harness_verify.py frontend/src/canvas/CanvasRoute.tsx
          git commit -m 'fix: restore cross-machine typing and learner recovery'
          git push origin HEAD:fix/full-repo-debug-2026-09-15
