name: Repo Debug Audit
on:
  push:
    branches: ["fix/full-repo-debug-2026-09-15"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit structure
        shell: bash
        run: |
          set -o pipefail
          {
            echo '=== GIT ==='
            git status --short --branch
            git rev-parse HEAD
            echo '=== TOP LEVEL ==='
            find . -maxdepth 2 -type f | sort | head -n 300
            echo '=== PACKAGE MANIFESTS ==='
            find . -name package.json -not -path '*/node_modules/*' -print
            echo '=== PYTHON MANIFESTS ==='
            find . \( -name pyproject.toml -o -name requirements*.txt \) -not -path '*/node_modules/*' -print
            echo '=== LAW H REFERENCES ==='
            grep -RIn --exclude-dir=.git --exclude-dir=node_modules -E 'askedBackTimes|stuckDoor|Law H|authorFailed' frontend 2>/dev/null | head -n 250 || true
            echo '=== GENERATION REFERENCES ==='
            grep -RIn --exclude-dir=.git --exclude-dir=node_modules -E 'generation_failed|concept.?budget|concepts.*budget|MAX_CONCEPT|one.?concept' . 2>/dev/null | head -n 300 || true
          } | tee audit-report.txt

      - name: Install frontend dependencies
        if: ${{ hashFiles('frontend/package-lock.json') != '' }}
        working-directory: frontend
        run: npm ci

      - name: Frontend typecheck
        working-directory: frontend
        run: |
          set +e
          npm run typecheck 2>&1 | tee ../frontend-typecheck.txt
          status=${PIPESTATUS[0]}
          echo "typecheck_exit=$status" >> ../audit-status.txt
          exit 0

      - name: Frontend unit tests
        working-directory: frontend
        run: |
          set +e
          npm test -- --run 2>&1 | tee ../frontend-tests.txt
          status=${PIPESTATUS[0]}
          echo "frontend_tests_exit=$status" >> ../audit-status.txt
          exit 0

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: repo-debug-audit
          path: |
            audit-report.txt
            audit-status.txt
            frontend-typecheck.txt
            frontend-tests.txt
          if-no-files-found: ignore
