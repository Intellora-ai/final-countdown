name: security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install --quiet bandit
      # scripts/ is verification infrastructure and part of the trusted computing
      # base, so it is scanned, never excluded. The gate re-derives the safe
      # subprocess pattern from the AST instead of allowlisting a finding id:
      # break the pattern and the exception evaporates.
      - name: Bandit at LOW, with verified safe-pattern exceptions
        run: python3 scripts/security_gate.py src scripts
