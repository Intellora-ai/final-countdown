name: security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write   # required to upload SARIF to code scanning
jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install --quiet "bandit[sarif]"

      # scripts/ is verification infrastructure and part of the trusted computing
      # base, so it is scanned, never excluded. The gate re-derives the safe
      # subprocess pattern from the AST rather than allowlisting a finding id:
      # break the pattern and the exception evaporates.
      - name: Bandit at LOW, with verified safe-pattern exceptions
        run: python3 scripts/run_gate.py --name bandit -- python3 scripts/security_gate.py src scripts

      # Findings land in the Security tab with file:line, instead of only
      # existing inside a log nobody reads. Runs even when the gate above
      # fails, because a failed run is exactly when you want to see them.
      #
      # This step must not fail on findings - there are always findings, and
      # the gate above already owns that verdict - but it MUST fail when bandit
      # itself did not run, because then bandit.sarif is missing or truncated
      # and code scanning silently keeps serving whatever it last saw. `|| true`
      # could not tell those two apart. Two checks are needed, because neither
      # is sufficient alone. Measured on bandit 1.9.4:
      #
      #   exit 0  ran, no findings          also: target path did not exist
      #   exit 1  ran, found something      also: crashed with a traceback
      #   exit 2  never ran (bad config / profile / format / output path)
      #   exit >2 killed (SIGKILL -> 137), no file written
      #
      # So: exit above 1 is unambiguously a failure to run and fails the step;
      # then the artifact is proved to exist, parse, and carry a runs[] entry,
      # which is what catches the two cases exit code cannot distinguish (a
      # crash exits 1 leaving a 0-byte file; an empty scan exits 0).
      - name: Bandit SARIF
        if: always()
        run: |
          set +e
          bandit -r src scripts -f sarif -o bandit.sarif \
            --severity-level low --confidence-level low
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error title=bandit failed to run::bandit exited $rc; 0 and 1 are scan results, anything higher means no report was produced and code scanning would go stale"
            exit "$rc"
          fi
          BANDIT_RC="$rc" python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          rc = os.environ["BANDIT_RC"]
          sarif = pathlib.Path("bandit.sarif")
          if not sarif.is_file():
              sys.exit(f"::error title=bandit wrote no SARIF::bandit exited {rc} but bandit.sarif does not exist")
          raw = sarif.read_text(encoding="utf-8")
          try:
              doc = json.loads(raw)
          except ValueError as exc:
              sys.exit(f"::error title=bandit SARIF truncated::bandit.sarif is {len(raw)} bytes and not valid JSON ({exc}); bandit died while writing it")
          runs = doc.get("runs") or []
          if not runs:
              sys.exit("::error title=bandit SARIF empty::bandit.sarif carries no runs[]; nothing was scanned, so uploading it would blank the Security tab")
          print(f"bandit exit={rc} (0=no findings, 1=findings), "
                f"{len(runs[0].get('results', []))} result(s) in bandit.sarif")
          PY
      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-bandit
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
