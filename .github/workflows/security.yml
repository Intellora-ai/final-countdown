name: security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install --quiet bandit
      - name: Bandit — LOW severity and above blocks
        run: bandit -r src scripts --severity-level low --confidence-level low
