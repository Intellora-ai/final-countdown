name: security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write   # required to upload SARIF to code scanning
jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install --quiet "bandit[sarif]"

      # scripts/ is verification infrastructure and part of the trusted computing
      # base, so it is scanned, never excluded. The gate re-derives the safe
      # subprocess pattern from the AST rather than allowlisting a finding id:
      # break the pattern and the exception evaporates.
      - name: Bandit at LOW, with verified safe-pattern exceptions
        run: python3 scripts/run_gate.py --name bandit -- python3 scripts/security_gate.py src scripts

      # Findings land in the Security tab with file:line, instead of only
      # existing inside a log nobody reads. Runs even when the gate above
      # fails, because a failed run is exactly when you want to see them.
      - name: Bandit SARIF
        if: always()
        run: bandit -r src scripts -f sarif -o bandit.sarif --severity-level low --confidence-level low || true
      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-bandit
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
