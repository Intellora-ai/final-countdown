name: Spec Composition
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  spec-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      # Per function, not per file: `${spec/specs/src}` maps addid_spec.lean to
      # src/addid.py, which does not exist. spec_source.py reads the subject
      # from the spec's own `def` line instead.
      - name: Check spec composition per function
        run: python3 scripts/run_gate.py --name spec-composition -- bash scripts/verify_per_function.sh scripts/check_composition.py --min-strength 0.9
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-spec-composition
          path: reports/
          retention-days: 30
          if-no-files-found: ignore
