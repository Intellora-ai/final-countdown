name: Vacuity Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  vacuity-check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check spec preconditions are reachable
        run: python3 scripts/check_vacuity.py specs/*_spec.lean
