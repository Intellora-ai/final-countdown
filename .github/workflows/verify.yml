name: verify

# ONE WORKFLOW, BECAUSE THE AGGREGATE HAS TO BE REAL.
#
# Every mandatory gate used to be its own workflow, and `full` re-ran all ten
# in an eleventh. That had two defects no amount of care inside a gate could
# fix:
#
#   1. Separate workflows are separate runs with separate filesystems. A
#      finalizer in workflow C cannot see evidence produced in workflows A and
#      B. `full`'s manifest only ever summarised `full`'s own second execution,
#      so it proved nothing about the ten checks the ruleset actually required.
#
#   2. Every gate therefore executed twice, under one gate id, in two runs.
#      Two authoritative reports for one gate is an ambiguity, not redundancy.
#
# Here the gates are parallel jobs in one run. `needs:` and `download-artifact`
# then work, so the finalizer consumes the evidence the required checks
# actually produced. The job ids are unchanged, so the ruleset contexts are
# unchanged.
#
# NO `needs:` BETWEEN GATES. They are independent, so they start together;
# `preflight` is deliberately not a dependency of the gates either. It blocks
# the merge on its own as a required check, and making ten jobs queue behind it
# would buy nothing but latency.
#
#     preflight ─┐
#     gate  ×10 ─┴─→ full (needs: all, if: always())

on:
  pull_request:
  push:
    branches: [main]

# Cancel a run only when a newer commit on the SAME pull request has
# superseded it. `github.ref` is the PR ref, so runs on different PRs never
# cancel each other.
#
# cancel-in-progress is deliberately conditional. On a push to main the run IS
# the authoritative verification of a commit that is already merged -- killing
# it would leave a merged commit with no completed verification, which is the
# one outcome this repository exists to prevent. Superseding only happens on
# pull_request, where a newer commit genuinely obsoletes the older result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The guard on the guard: asserts the verification system still matches
  # ci/gates.toml before any result from it is worth reading.
  preflight:
    runs-on: ubuntu-latest
    # 3 minutes when this installed a single wheel. It now installs the whole
    # locked set like every other job, so the budget is the install, not the
    # check: gate_integrity.py itself runs in under a second.
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # tcb_gate.py diffs against the merge base; a shallow clone
          # has no base to compare with and the gate cannot run at all.
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '3.12', cache: pip,
               cache-dependency-path: requirements-preflight.lock}
      # gate_integrity.py parses workflow YAML rather than searching it, so it
      # needs a YAML parser. It comes from the same hash-pinned lock as every
      # other job: preflight used to install a bare `PyYAML`, which meant the
      # guard on the guard ran against an unpinned dependency resolved fresh
      # each day. One install path, one set of hashes, no exceptions.
      - run: pip install --quiet --require-hashes -r requirements-preflight.lock
      # THE GATE — three verifications that owned no report, plus the one that
      # writes it, now in a single wrapper. The reasoning per verification is
      # kept below, unchanged; what follows is why they are one step.
      #
      # BEFORE: gate_integrity.py runs LAST and is what writes
      # reports/preflight.json, so a failure in any earlier step meant no
      # report existed at all. That is fail-closed and was deliberate --
      # aggregate_gates.py turns the absence into a blocking UNKNOWN, so the
      # merge stays blocked and both required checks agree. It is still true
      # here; nothing about the verdict changes.
      #
      # What was missing is every DETAIL of that verdict. The finalizer could
      # only say "no evidence was produced for this gate" -- never which
      # trusted path drifted, which required check the ruleset had dropped, or
      # which assumption went unaccepted. That detail existed only in the job
      # log, which is the thing this repository is removing.
      #
      # WHY THE WRAPPER DOES NOT COST THE 84 CHECKS. gate_integrity.py writes
      # the same reports/preflight.json the wrapper writes, so wrapping used to
      # mean overwriting: measured, that report carries 84 structured checks
      # and a bare wrapper report carries one. run_gate.py now MERGES an inner
      # report it finds -- checks, scope and warnings -- while the wrapper's
      # STATUS stays the verdict, because the chain's exit code is what saw the
      # whole chain and the inner script only ever saw its own step. A report
      # older than this run's command is refused rather than folded.
      #
      # The `echo`s name which verification failed, and run_gate.py records the
      # ones after it as never having run: "could not check" is not "checked
      # and fine". See the note on the bandit gate.
      # THE BASE REF ARRIVES AS AN ENVIRONMENT VARIABLE, NOT INLINE. Written
      # as `${{ github.base_ref || 'main' }}` inside this single-quoted
      # `bash -c`, the fallback needs the '"'"' escaping dance -- and that
      # breaks the `${{ ... }}` stripper in ci_integrity's suppression
      # detector, which then sees a bare `||` and correctly reports the gate
      # as having its failure suppressed. The expression belongs where it does
      # not have to survive two levels of quoting.
      - name: Trusted base, ruleset, registries, and gate integrity
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          python3 scripts/run_gate.py --name preflight -- bash -c '
            set -e
            echo "== preflight gate 1/4: trusted computing base" >&2
            python3 scripts/tcb_gate.py --base "origin/$BASE_REF"
            echo "== preflight gate 2/4: ruleset alignment" >&2
            python3 scripts/check_ruleset.py
            echo "== preflight gate 3/4: requirement and assumption registries" >&2
            python3 scripts/registry_gate.py
            echo "== preflight gate 4/4: gate integrity" >&2
            python3 scripts/gate_integrity.py
          '
      # The per-verification reasoning below is unchanged. Each of these ran as
      # its own step until the wrapper above absorbed them.
      #
      # TRUSTED COMPUTING BASE
      # A trusted-path change must say why, in a commit message. See the
      # module docstring: CODEOWNERS cannot enforce this without a reviewer,
      # and a one-person repository has none.
      #
      # RULESET ALIGNMENT
      # The manifest agreeing with the workflows is not the manifest agreeing
      # with GitHub. gate_integrity check 9 compares ci/gates.toml against
      # itself; this compares it against the live ruleset, which is the only
      # place the answer to "is this check actually REQUIRED?" exists. Until
      # now nothing in CI ran it, so an admin edit to ruleset 20990225 —
      # dropping a required check, unpinning a context so any actor can satisfy
      # it — went unnoticed until someone happened to run the script by hand.
      #
      # DRIFT TURNS THE WHOLE RUN RED, AND THAT IS THE POINT. preflight is
      # mandatory, so this failing fails everything. It has to: preflight is
      # itself one of the 17 required contexts, so when an admin removes a
      # DIFFERENT check from the ruleset, preflight going red is the only thing
      # left blocking the merge. A drift check that merely warned would be a
      # diagnostic, not a gate.
      #
      # BEFORE gate_integrity, deliberately, for the same reason the TCB gate
      # is: gate_integrity is what writes reports/preflight.json. Running this
      # after it would mean a drift failure left behind a preflight.json saying
      # PASS, and aggregate_gates.py reads reports, not job conclusions — so
      # `full` would certify a complete, all-green run while preflight was red.
      # Failing first means no preflight evidence exists, the aggregator turns
      # that absence into a blocking UNKNOWN, and both required checks agree.
      #
      # No `if:` and no `continue-on-error`: gate_integrity forbids both on a
      # must_contain step, and a fork pull request must not become a hole. The
      # script needs no credentials to avoid one — a public repository's
      # rulesets are public, confirmed at HTTP 200 with no auth — so GH_TOKEN
      # only buys the authenticated 1000/hr rate limit, and the script falls
      # back to an anonymous read when the token is absent or refused. Exit 1
      # is drift, exit 2 is "could not read the ruleset"; both are red, because
      # "could not compare" is not "aligned".
      #
      # REQUIREMENT AND ASSUMPTION REGISTRIES
      # What the gates prove, and what they do not. ci/requirements.yml names
      # 39 claims and which gate establishes each -- six of them nothing does,
      # and that is the point of writing them down. ci/assumptions.yml records
      # 16, quoted from README.md, TRUST.md and the gate docstrings rather than
      # paraphrased, because a paraphrase of a limitation always reads weaker
      # than the limitation.
      #
      # The gate does not fail on an unverified assumption. Eight of the nine
      # high-impact ones cannot be closed by any amount of work here -- the Lean
      # kernel is the root of trust, CPython's `ast` IS the language, and Rice's
      # theorem closes the mutation question. A gate that failed the build for
      # those would be edited into silence within a week, and the file it
      # guards exists to prevent exactly that kind of quiet.
      #
      # It fails on the thing that IS actionable: an untested high-impact
      # assumption, or a falsified one, with no written acceptance. Adding that
      # acceptance edits ci/, a trusted path, so it needs a TCB: trailer in the
      # commit message and cannot be done quietly.
      #
      # Before gate_integrity for the same reason as the ruleset check above:
      # gate_integrity writes reports/preflight.json, and aggregate_gates.py
      # reads reports rather than job conclusions.
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports-preflight
          path: reports/
          retention-days: 30
          if-no-files-found: error

  axle-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '3.12', cache: pip,
               cache-dependency-path: requirements.lock}
      - run: pip install --quiet --require-hashes -r requirements.lock
      # Named as an outage in the log instead of surfacing as ten proof
      # failures. It exits non-zero either way: unverifiable must not merge.
      - name: AXLE service health
        run: python3 scripts/axle_health.py
      # THE GATE — same defect and same fix as `bandit` and `correspondence`;
      # the reasoning in full is on the preflight job below.
      #
      # `enforce_spec.py` used to be a bare step and owned no report, so a spec
      # that broke a syntactic rule turned this job red while every detail of
      # WHICH spec broke WHICH rule existed only in the job log. axle_gate.py
      # is what writes reports/axle-verify.json, and it never ran.
      #
      #   enforce_spec.py  the syntactic rules, per spec.
      #   axle_gate.py     proves SPEC_SET == PROOF_SET and that the set is
      #     non-empty before submitting any proof, then owns the verdict:
      #     `axle verify-proof` exits 0 on "okay": false, so the exit code is
      #     not the answer.
      #
      # run_gate.py MERGES rather than overwrites, so axle_gate.py's own
      # checks and scope survive being wrapped. The chain's exit code is still
      # the verdict; an inner report saying PASS never survives a chain that
      # failed after it.
      #
      # `axle_health.py` stays its own step above, deliberately, for the same
      # reason it does on the correspondence job: a dead service is an
      # INFRASTRUCTURE_FAILURE, and run_gate maps every non-zero exit to FAIL.
      - name: Enforce specs, then verify all proofs with AXLE
        run: |
          python3 scripts/run_gate.py --name axle-verify -- bash -c '
            set -e
            echo "== axle-verify gate 1/2: syntactic spec rules" >&2
            python3 scripts/enforce_spec.py specs/*_spec.lean
            echo "== axle-verify gate 2/2: AXLE proof verification" >&2
            python3 scripts/axle_gate.py
          '
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports-axle-verify
          path: reports/
          retention-days: 30
          if-no-files-found: error

  spec-strength:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '3.12', cache: pip,
               cache-dependency-path: requirements.lock}
      - run: pip install --quiet --require-hashes -r requirements.lock
      - name: Spec strength as a set
        run: python3 scripts/run_gate.py --name spec-strength -- python3 scripts/check_composition.py specs/add_spec.lean specs/addid_spec.lean specs/addsucc_spec.lean specs/clamp_spec.lean specs/clampid_spec.lean specs/mulid_spec.lean specs/multiply_spec.lean specs/subpred_spec.lean specs/subself_spec.lean specs/subtract_spec.lean --min-strength 0.9
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports-spec-strength
          path: reports/
          retention-days: 30
          if-no-files-found: error

  spec-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '3.12', cache: pip,
               cache-dependency-path: requirements.lock}
      - run: pip install --quiet --require-hashes -r requirements.lock
      - name: Check spec composition per function
        run: python3 scripts/run_gate.py --name spec-composition -- bash scripts/verify_per_function.sh scripts/check_composition.py --min-strength 0.9
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports-spec-composition
          path: reports/
          retention-days: 30
          if-no-files-found: error

  vacuity-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '3.12', cache: pip,
               cache-dependency-path: requirements.lock}
      - run: pip install --quiet --require-hashes -r requirements.lock
      - name: Vacuity
        run: python3 scripts/run_gate.py --name vacuity-check -- python3 scripts/check_vacuity.py specs/add_spec.lean specs/addid_spec.lean specs/addsucc_spec.lean specs/clamp_spec.lean specs/clampid_spec.lean specs/mulid_spec.lean specs/multiply_spec.lean specs/subpred_spec.lean specs/subself_spec.lean specs/subtract_spec.lean
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports-vacuity-check
          path: reports/
          retention-days: 30
          if-no-files-found: error

  counterexample-search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '3.12', cache: pip,
               cache-dependency-path: requirements.lock}
      - run: pip install --quiet --require-hashes -r requirements.lock
      - name: Counterexample search
        run: python3 scripts/run_gate.py --name counterexample-search -- python3 scripts/find_counterexample.py specs/add_spec.lean specs/addid_spec.lean specs/addsucc_spec.lean specs/clamp_spec.lean specs/clampid_spec.lean specs/mulid_spec.lean specs/multiply_spec.lean specs/subpred_spec.lean specs/subself_spec.lean specs/subtract_spec.lean
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports-counterexample-search
          path: reports/
          retention-days: 30
          if-no-files-found: error

  honest-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '3.12', cache: pip,
               cache-dependency-path: requirements.lock}
      - run: pip install --quiet --require-hashes -r requirements.lock
      # Ten dimensions, reported separately. Blocks on FAIL only: an
      # unestablished contract is information, not a broken build.
      - name: All ten layers, per function
        run: python3 scripts/run_gate.py --name honest-report -- bash scripts/verify_per_function.sh scripts/honest_report.py --min-strength 0.9
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports-honest-report
          path: reports/
          retention-days: 30
          if-no-files-found: error

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '3.12', cache: pip,
               cache-dependency-path: requirements.lock}
      - run: pip install --quiet --require-hashes -r requirements.lock
      - name: Tests + branch coverage
      # `--junitxml` writes the standard per-test report. The gate does NOT
      # parse it -- it reads pytest's short summary out of captured stdout,
      # because parsing XML in-process would mean `xml.etree`, which bandit
      # flags (B405/B314), and clearing that would add a verified exemption to
      # security_gate.py for a file this workflow generated seconds earlier.
      # The XML is emitted and uploaded anyway: it costs one flag, it is the
      # format every other tool understands, and keeping it means the gate's
      # decision path and the interchange format are not the same dependency.
        run: python3 scripts/run_gate.py --name coverage -- pytest -n auto --dist loadfile --cov=src --cov-branch --cov-fail-under=95 -m "not axle" --junitxml=test-results/pytest.xml
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports-coverage
          # test-results/ is listed second and the upload does not require it:
          # a crash before pytest writes the XML must still deliver
          # reports/coverage.json, which is the evidence the finalizer needs.
          # `if-no-files-found: error` still fires when BOTH are missing.
          path: |
            reports/
            test-results/
          retention-days: 30
          if-no-files-found: error

  pyright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # PROBLEM MATCHERS — turn "Process completed with exit code 1" into a red box
      # on the exact file and line.
      #
      # Registered per job rather than once globally because a matcher belongs to the
      # tool that produces the lines it parses; a matcher registered where its tool does
      # not run is a regex nobody exercises.
      #
      # The regexes were built from REAL output captured from these tools, not from a
      # template. That mattered: the obvious generic pattern `(file):(line):(col): error:`
      # does NOT match pyright, which prints `file:line:col - error:` with a dash. Shipping
      # the generic one would have produced a matcher that silently matched nothing --
      # the failure mode a problem matcher exists to remove.
      # tests/test_problem_matchers.py pins both regexes against sample lines.
      - name: register problem matchers
        run: echo "::add-matcher::.github/matchers/tools.json"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '3.12', cache: pip,
               cache-dependency-path: requirements.lock}
      - run: pip install --quiet --require-hashes -r requirements.lock
      - name: Types
        run: python3 scripts/run_gate.py --name pyright -- pyright
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports-pyright
          path: reports/
          retention-days: 30
          if-no-files-found: error

  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write   # required to upload SARIF to code scanning
    steps:
      # PROBLEM MATCHERS — turn "Process completed with exit code 1" into a red box
      # on the exact file and line.
      #
      # Registered per job rather than once globally because a matcher belongs to the
      # tool that produces the lines it parses; a matcher registered where its tool does
      # not run is a regex nobody exercises.
      #
      # The regexes were built from REAL output captured from these tools, not from a
      # template. That mattered: the obvious generic pattern `(file):(line):(col): error:`
      # does NOT match pyright, which prints `file:line:col - error:` with a dash. Shipping
      # the generic one would have produced a matcher that silently matched nothing --
      # the failure mode a problem matcher exists to remove.
      # tests/test_problem_matchers.py pins both regexes against sample lines.
      - name: register problem matchers
        run: echo "::add-matcher::.github/matchers/tools.json"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '3.12', cache: pip,
               cache-dependency-path: requirements.lock}
      - run: pip install --quiet --require-hashes -r requirements.lock
      # ONE GATE STEP, BECAUSE ONE GATE OWNS ONE REPORT.
      #
      # This job used to run four verification commands and wrap only the
      # first in run_gate.py. Measured after that step alone: bandit.json
      # carried status=PASS, scope.command="…security_gate.py src scripts" and
      # one check, "bandit exit code". sarif_suppress, shellcheck and
      # credential_scan appeared nowhere in it. A failure in any of those
      # three turned the job red while the evidence — uploaded by
      # `if: always()` — still said PASS, and reports/gate-manifest.json, the
      # artifact this repository presents as its completeness proof, asserted
      # PASS for a gate that had failed. Merge stayed blocked by this job's
      # own required context, so nothing shipped that should not have. The
      # evidence lied, and here the evidence IS the product.
      #
      # THE SHAPE NOT TAKEN: one `run_gate.py --name <id>` per step, each
      # owning its own report. Every new id must be declared in ci/gates.toml,
      # and aggregate_gates.py derives its expected set from that file — the
      # mandatory gates whose role is not finalizer/scanner/code-scanning.
      # Anything it finds that is NOT in that set lands in `gates_unexpected`
      # and blocks. So a new id has to be mandatory to be admissible; and
      # gate_integrity check 9 then requires it in required_checks, hence in
      # ruleset 20990225. No `role` escapes that: the roles excluded from
      # `expected` are exactly the ones whose reports become unexpected. Three
      # more required GitHub contexts to fix a reporting bug is the wrong
      # trade, and required_checks is not this file's to grow.
      #
      # Reusing `--name bandit` on every step is worse than the bug. Each step
      # would overwrite bandit.json, so the last writer wins: a green run
      # would attest only credential_scan, and a failure suppressed with
      # `|| exit 0` — which gate_integrity's `|| true|echo|:` regex does not
      # match — would be erased by the next step's PASS. That is the hole an
      # adversarial audit named, reopened one position further along.
      #
      # So: ONE writer, and it runs everything it reports on. run_gate.py
      # already wraps any command, and three other gates already use that to
      # wrap a multi-check shell program (`bash scripts/verify_per_function.sh`).
      # `bash -c` is that idiom without a new file. `set -e` stops at the first
      # failure exactly as separate steps did, so at most one check can fail
      # and the report is written once, by the process that ran all four. A
      # `|| exit 0` bolted onto this step now fails loudly instead of hiding:
      # the FAIL report is already on disk when the suppression runs, and the
      # finalizer reads reports, not exit codes.
      #
      # WHAT IS DELIBERATELY OUTSIDE, and why it is not a hole. `Bandit SARIF`
      # produces the file for code scanning and must NOT fail on findings; the
      # two uploads run `if: always()`. A gate step may carry neither
      # condition — gate_integrity rejects both — so they stay their own
      # steps. All three sit before the gate or after it, and if one fails
      # first no bandit.json is written at all: `if-no-files-found: error`
      # fails the upload and aggregate_gates.py records the gate as missing,
      # which is UNKNOWN and not mergeable. "Could not verify" is not
      # "verified", and it blocks just the same.
      #
      # Runs first so bandit.sarif exists before the gate's suppression pass
      # reads it, and so code scanning gets a SARIF whatever verdict the gate
      # reaches. Must not fail on findings — there are always findings and the
      # gate below owns that verdict — but MUST fail when bandit itself did
      # not run, because then the SARIF is missing or truncated and code
      # scanning silently keeps serving whatever it last saw. Measured on
      # bandit 1.9.4:
      # exit 2 = never ran; exit 1 = findings OR a crash leaving a 0-byte file;
      # exit 0 = clean OR a mis-targeted scan producing an empty runs[]. So
      # neither the exit code nor the artifact check suffices alone.
      - name: Bandit SARIF
        if: always()
        run: |
          set +e
          bandit -r src scripts -f sarif -o bandit.sarif \
            --severity-level low --confidence-level low
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            echo "::error title=bandit failed to run::bandit exited $rc; 0 and 1 are scan results, anything higher means no report was produced and code scanning would go stale"
            exit "$rc"
          fi
          BANDIT_RC="$rc" python3 - <<'PY'
          import json
          import os
          import pathlib
          import sys

          rc = os.environ["BANDIT_RC"]
          sarif = pathlib.Path("bandit.sarif")
          if not sarif.is_file():
              sys.exit(f"::error title=bandit wrote no SARIF::bandit exited {rc} but bandit.sarif does not exist")
          raw = sarif.read_text(encoding="utf-8")
          try:
              doc = json.loads(raw)
          except ValueError as exc:
              sys.exit(f"::error title=bandit SARIF truncated::bandit.sarif is {len(raw)} bytes and not valid JSON ({exc}); bandit died while writing it")
          runs = doc.get("runs") or []
          if not runs:
              sys.exit("::error title=bandit SARIF empty::bandit.sarif carries no runs[]; nothing was scanned, so uploading it would blank the Security tab")
          print(f"bandit exit={rc} (0=no findings, 1=findings), "
                f"{len(runs[0].get('results', []))} result(s) in bandit.sarif")
          PY
      # THE GATE. Four verifications, in one report, in this order:
      #
      #   security_gate.py    scripts/ is verification infrastructure and part
      #     of the trusted computing base, so it is scanned, never excluded.
      #     The gate re-derives the safe subprocess pattern from the AST rather
      #     than allowlisting a finding id: break the pattern and the exception
      #     evaporates.
      #
      #   sarif_suppress.py   Code scanning must not contradict the gate that
      #     already judged these findings. security_gate.py proves them safe by
      #     re-deriving the pattern from the AST; the raw SARIF opened an alert
      #     for every one, and each alert became an unresolved review thread
      #     that blocked the PR. This marks only what the gate PROVED, using
      #     the gate's own adjudication. It runs after security_gate.py, so
      #     `set -e` skips it when the security gate fails — the unfiltered
      #     SARIF is then what `Upload to code scanning` publishes, and a red
      #     gate shows every finding, which is when a human most needs them.
      #
      #   shellcheck          CodeQL has no Shell analyzer, and
      #     scripts/verify_per_function.sh is the loop three mandatory gates
      #     run. shellcheck is the tool that covers it.
      #
      #   credential_scan.py  Tracked content is what a push publishes, so
      #     tracked content is what this scans. `evidence.md` carried a
      #     fine-grained PAT prefix on the public default branch; rewriting
      #     history would not have un-published it, and only rotation closes
      #     that. This is the half that CAN be closed: the same shape cannot
      #     reach a tracked file again. Findings carry a label, a location and
      #     a length -- never the matched value, because this log is public.
      #
      # The `echo`s are how the report names WHICH check failed. run_gate.py
      # records the last six lines of stdout+stderr in failures[].why, and it
      # concatenates stderr after stdout, so markers written to stderr land at
      # the end of the capture and the last one is the check that was running
      # when `set -e` stopped the chain. `echo` is a shell builtin, so this
      # holds whatever bash does with traps: an ERR trap was tried first and
      # measured NOT to fire on bash 3.2 when the failing command is an
      # external program in a newline-separated script. A naming mechanism
      # that silently depends on the bash version is worse than none.
      - name: Security gate, SARIF suppression, shell analysis, credential scan
        run: |
          python3 scripts/run_gate.py --name bandit -- bash -c '
            set -e
            echo "== bandit gate 1/4: security gate" >&2
            python3 scripts/security_gate.py src scripts
            echo "== bandit gate 2/4: SARIF suppression" >&2
            python3 scripts/sarif_suppress.py --sarif bandit.sarif src scripts
            echo "== bandit gate 3/4: shell analysis" >&2
            shellcheck -f gcc scripts/*.sh
            echo "== bandit gate 4/4: credential scan" >&2
            python3 scripts/credential_scan.py
          '
      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: bandit.sarif
          category: bandit
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports-bandit
          path: reports/
          retention-days: 30
          if-no-files-found: error

  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '3.12', cache: pip,
               cache-dependency-path: requirements.lock}
      - run: pip install --quiet --require-hashes -r requirements.lock
      # Scores the SPEC against AST mutants, not the test suite against mutmut.
      # Equivalent mutants are excluded from the denominator.
      - name: Mutation discrimination (per function)
        run: python3 scripts/run_gate.py --name mutmut -- bash scripts/verify_per_function.sh scripts/mutation_gate.py --min-score 0.95
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports-mutmut
          path: reports/
          retention-days: 30
          if-no-files-found: error

  # Ties the Lean theorems to the Python actually in the tree. Without this the
  # proofs are about hand-written Lean models that nothing relates to src/.
  correspondence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '3.12', cache: pip,
               cache-dependency-path: requirements.lock}
      - run: pip install --quiet --require-hashes -r requirements.lock
      - name: AXLE service health
        run: python3 scripts/axle_health.py
      # THE GATE — same defect, same fix as `bandit` above; the reasoning in
      # full is on that job. `pytest -m axle` used to run AFTER the reporting
      # step, so an attack the kernel failed to reject turned this job red
      # while reports/correspondence.json still said PASS. Both verifications
      # now run inside the one wrapper, so the report covers both.
      #
      #   correspondence_gate.py  Completeness, freshness against src/, kernel
      #     check, and the axiom audit.
      #
      #   pytest -m axle          The gate proves the current tree is
      #     consistent. These prove the gate can still say no: each mutant
      #     edits src/add.py, regenerates, and must be rejected by the kernel.
      #     They live here because they need AXLE.
      #
      # `axle_health.py` stays its own step above, deliberately. A dead
      # service is an INFRASTRUCTURE_FAILURE, not a FAIL, and run_gate.py maps
      # every non-zero exit to FAIL — folding the health check in would
      # publish "the correspondence does not hold" when the truth is "AXLE was
      # unreachable", which is the same class of lie this change removes. It
      # runs before the gate, so when it fails no report is written at all and
      # aggregate_gates.py records the gate as missing: UNKNOWN, not
      # mergeable. Unverifiable still does not merge.
      #
      # The `echo`s name which check failed; see the note on the bandit gate.
      - name: Correspondence between src/ and the proofs, and the mutation attacks
        run: |
          python3 scripts/run_gate.py --name correspondence -- bash -c '
            set -e
            echo "== correspondence gate 1/2: correspondence" >&2
            python3 scripts/correspondence_gate.py
            echo "== correspondence gate 2/2: mutation attacks" >&2
            pytest -m axle
          '
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports-correspondence
          path: reports/
          retention-days: 30
          if-no-files-found: error

  # THE FINALIZER. The only check that can see a job which went green without
  # producing evidence, because it is the only one that knows the whole set.
  #
  # `if: always()` is load-bearing twice over. Without it a single failing gate
  # skips this job, the required `full` context never reports, and the PR sits
  # pending forever instead of failing. And a skipped finalizer would mean the
  # completeness proof disappears in exactly the situation it is for.
  full:
    needs:
      - preflight
      - axle-verify
      - spec-strength
      - spec-composition
      - vacuity-check
      - counterexample-search
      - honest-report
      - coverage
      - pyright
      - mutmut
      - bandit
      - correspondence
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: {python-version: '3.12'}
      # No `name:` filter: every artifact this run produced, each into its own
      # directory. A gate whose upload failed simply is not here, which is the
      # signal the aggregator turns into a blocking UNKNOWN.
      - name: Collect every gate's evidence from this run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: evidence
      - name: Gate manifest
        run: python3 scripts/aggregate_gates.py --evidence-root evidence
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports-full
          path: reports/
          retention-days: 30
          if-no-files-found: error

  # MERGE EVIDENCE — the numbers in the pull request body, checked against the
  # logs that produced them.
  #
  # WHY THIS RUNS AFTER `full`. Every other gate here proves something about the
  # tree. This one proves something about the *description* of the tree: that a
  # measured figure written in the pull request is the figure GitHub recorded.
  # Pull request #28 merged with "42 AXLE calls before, 13 after" when the real
  # figures were 9 and 3, and the measurement refuting it -- 22.27s against
  # 14.17s -- was already sitting in a `correspondence` job log of that same run.
  # Seventeen checks were green. Nothing was reading the arithmetic.
  #
  # ADVISORY, DELIBERATELY, FOR NOW. `mandatory = false` in ci/gates.toml, and it
  # is not one of the 17 required contexts, so a red result here blocks nothing
  # yet. That is the point of this first pull request: measure the real overhead,
  # confirm the token can read what it needs, and see the false-block rate on
  # live bodies BEFORE anything depends on it. Promoting it is a separate,
  # deliberate ruleset change. See docs/merge-evidence.md.
  #
  # `if: always()` because the failure dossier is worth most in exactly the case
  # `needs: [full]` would otherwise skip: when something already went red.
  #
  # It cannot join `full`'s `needs:` -- `full` is its dependency, and a cycle is
  # not a verification order. It waits on `e2e` and the three CodeQL contexts by
  # polling the check-runs API, because cross-workflow `needs:` does not exist.
  # It excludes its own context from that wait: a gate that waits for itself to
  # become terminal never becomes terminal.
  merge-evidence:
    needs: [full]
    # PULL REQUESTS ONLY, and the reason is structural rather than a preference.
    #
    # `CodeQL` is one of the 17 required contexts, and on a push SHA it does not
    # exist. Measured on 7cc6b0bb, the merged main commit: sixteen of the
    # seventeen appear as check-runs and `CodeQL` is absent entirely, because it
    # is a code-scanning analysis status GitHub raises for pull requests. So the
    # gate waited its full 420-second budget for a check that could never
    # arrive, and then correctly reported NOT_FETCHED.
    #
    # The bug was not the waiting. It was running a MERGE policy on a POST-MERGE
    # event: required contexts decide whether a pull request may merge, and by
    # the time a commit is on main that decision is already made and there is no
    # pull request body left to check. Teaching the evidence logic to tolerate a
    # missing context would have bought this at the price of the fail-closed
    # rule that makes it worth having. Not running where it has no meaning costs
    # nothing.
    #
    # `always()` is still here: within a pull request, the failure dossier is
    # worth most exactly when `needs: [full]` would otherwise skip this job.
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Narrower than it looks: the workflow grants `contents: read` and these two
    # additions are scoped to this job alone, so the other thirteen keep exactly
    # the privileges they had. `actions: read` reads runs, jobs and logs;
    # `checks: read` reads the conclusions of the contexts this job waits on.
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      # No pip install. This gate reads ci/gates.toml with the standard-library
      # tomllib and talks to GitHub through the `gh` already on the runner, so
      # the 36-package locked set it does not use is 36 packages of latency.
      - name: Check the PR's measured claims against this run's evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/merge_evidence_gate.py --pr "$PR_NUMBER" --sha "$HEAD_SHA"

      - name: Upload the evidence dossier
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: reports-merge-evidence
          path: reports/
          retention-days: 14
          if-no-files-found: warn
