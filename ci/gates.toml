# CANONICAL VERIFICATION TOPOLOGY — one declaration, no competing truths.
#
# This file is the single source of truth for what the verification system is.
# Four consumers read it and nothing else declares the same facts:
#
#   scripts/gate_integrity.py   asserts the workflows still match this
#   scripts/aggregate_gates.py  asserts the evidence set equals this
#   scripts/check_ruleset.py    asserts GitHub enforces exactly this
#   tests/test_ci_integrity.py  attacks all three
#
# The invariant the whole system rests on:
#
#     CANONICAL_GATE_SET == GITHUB_REQUIRED_SET == EXECUTED_GATE_SET
#
# not "⊆" in any direction. A gate missing from GitHub runs and blocks nothing.
# A check GitHub requires with no gate hangs every merge. Evidence for a gate
# nobody declared is evidence for nothing.
#
# EVERY MANDATORY *REPORT-PRODUCING* GATE IS A JOB IN verify.yml. The
# qualifier is not pedantry -- the sentence used to read "every mandatory gate"
# and that was false in this same file. Four of the seventeen required contexts
# are declared below and live somewhere else:
#
#   codeql-python, codeql-actions   codeql.yml   need `security-events: write`
#   CodeQL                          (no job)     posted by GHAS app 57789
#   e2e                             e2e.yml      needs a browser binary
#
# THE SPLIT IS THE EVIDENCE MODEL, NOT A FILING PREFERENCE. Separate workflows
# are separate runs with separate filesystems, so a finalizer in workflow C
# cannot see evidence produced in workflows A and B. One workflow gives the
# finalizer `needs:` and `download-artifact` over the same run, which is the
# only construction where the aggregate is real. So anything that must land in
# reports/<gate>.json and be counted by aggregate_gates.py has to be a job in
# verify.yml. The four above produce no such report -- their evidence is the
# code-scanning database or an exit code -- which is exactly why `role` is
# `scanner` or `code-scanning` for them, and why the finalizer is told not to
# expect an artifact from them.
#
# A comment in a trusted path that describes a stronger invariant than the one
# in force is the failure this repository exists to catch. It was doing it to
# itself.

[ruleset]
id = 20990225
name = "final countdown protection"
repository = "Intellora-ai/final-countdown"
# Must equal, exactly, the set of gates below with mandatory = true.
# scripts/check_ruleset.py proves this against the live GitHub ruleset.
# The tools the code_scanning rule must enforce. CodeQL alone left Bandit's
# findings advisory; both now block. Thresholds are deliberately identical, so
# one rule does not quietly enforce two standards.
code_scanning_tools = ["CodeQL", "Bandit"]

required_checks = [
  "preflight",
  "axle-verify", "spec-strength", "spec-composition", "vacuity-check",
  "counterexample-search", "honest-report", "coverage", "pyright",
  "bandit", "mutmut", "correspondence",
  "codeql-python", "codeql-actions", "CodeQL",
  "e2e",
  "full",
  "chaos",
  "skills",
  "frontend",
  "frontend-verdict",
]

[schema]
# The report shape scripts/gate.py writes. Consumers reject an unknown major.
#
# 1.3 is a MINOR bump for the same reason 1.2 was. It adds fields to each entry
# in `failures[]` -- finding_id, severity, code, file, line, column, root_cause,
# reproduction_command, is_root_cause, dependent_on, merge_blocking -- and
# removes none, so every 1.2 consumer still reads a 1.3 report. The top-level
# `required_fields` below are unchanged, because none of the new fields is
# top-level: they live inside a finding.
#
# 1.2 was a MINOR bump, deliberately. It adds five fields and removes nothing, so
# every 1.1 consumer still reads a 1.2 report. aggregate_gates.py compares only
# SCHEMA_MAJOR, so moving to 2.0 would make every gate's evidence unreadable in
# the same push that added a field to it — the change would destroy the thing it
# was documenting. Not bumping at all was also wrong: this block claims to
# describe "the report shape scripts/gate.py writes", and the shape changed.
version = "1.3"
required_fields = [
  "schema_version", "gate", "gate_version", "status", "mergeable_contribution",
  "commit", "workflow", "job", "run_id", "run_attempt", "ref",
  "started_at", "ended_at", "duration_ms", "tool_versions", "scope",
  "checks_executed", "checks_passed", "checks_failed", "checks",
  "failures", "warnings", "artifacts",
  # Added in 1.2. `environment` is what a rerun is compared against; the other
  # four answer "which workflow, which event, which pull request, and was the
  # tree actually the commit GitHub named".
  "environment", "workflow_ref", "event", "pull_request", "commit_identity",
]
# Report fields that must equal the corresponding environment variable for the
# evidence to belong to this run. run_attempt is here because a re-run keeps
# the same run id: without it, attempt 1's PASS satisfies attempt 2.
run_identity = { commit = "GITHUB_SHA", run_id = "GITHUB_RUN_ID", run_attempt = "GITHUB_RUN_ATTEMPT", workflow = "GITHUB_WORKFLOW" }

# ---------------------------------------------------------------------------
# COVERAGE SCOPE — what the coverage number is a number ABOUT.
#
# The `coverage` gate below pins `--cov-fail-under=95` and nothing pins its
# SCOPE. Measured 2026-08-25: `pyproject.toml` sets `source = ["src"]`, and
# `src/` is five files totalling 38 lines, while `scripts/` holds 19,499 and
# `learning-os/src/` holds 7,992. So a required check reporting 95% was
# reporting it about 0.05% of the production code, and every check stayed green
# while the repository grew.
#
# That is scope drift, the same shape `check_ruleset.py` catches between this
# file and the live ruleset. `scripts/coverage_scope_gate.py` reads the three
# lists below and refuses any directory holding Python that appears in none of
# them, so a new package is a visible diff here or a red check.
#
#   measured    a coverage scope measures it            -> `scope` required
#   unmeasured  production code with no floor YET       -> `why` required
#   excluded    not production code at all              -> `why` required
#
# `unmeasured` is deliberate. `scripts/` genuinely has no floor today; calling
# it `excluded` would be false and omitting it is the drift being fixed. A gap
# with a written reason is one a reader can act on. The `why` is the whole
# difference, which is why a row without one is refused.
# ---------------------------------------------------------------------------
[coverage]
measured = [
  # The four arithmetic functions carrying Lean specifications. 95% is enforced
  # by the `coverage` gate's own `--cov-fail-under=95`; this row records WHICH
  # directory that number is about.
  { path = "src", scope = "src", floor = 95 },
]

unmeasured = [
  # 19,499 lines of gate machinery. Measured by hand at 57% on 2026-08-25 with
  # subprocess coverage armed (see tests/coverage-subprocess.cfg); before that
  # hook existed the same command reported 45.80%, because 34 test files drive
  # these scripts through `subprocess.run` and coverage could not see inside a
  # child process. No floor is declared yet: a floor set before the measurement
  # was trustworthy would have pinned an artefact.
  { path = "scripts", why = "no floor yet; 57% measured 2026-08-25, pending a per-area floor" },

  # 7,992 lines. `learning-os/pyproject.toml` has no [tool.coverage] section at
  # all, so its 482 tests run unmeasured. Adding a floor here needs its own
  # measurement first, for the same reason as `scripts`.
  { path = "learning-os/src", why = "no coverage configuration exists in learning-os/pyproject.toml yet" },

  # Alembic's environment and its migration scripts. This IS production code --
  # it is what changes a real database -- so it is `unmeasured` rather than
  # `excluded`, which would claim it is not production at all.
  #
  # No floor, and line coverage is the wrong instrument here. A migration runs
  # once, forward, against a specific starting schema; "which lines executed"
  # says nothing about whether the resulting schema is correct. What does say
  # so is `.github/workflows/integration.yml`, which applies every migration to
  # an empty database on each run, and the database suite, which then asserts
  # the constraints those migrations created actually refuse bad rows.
  { path = "learning-os/alembic", why = "migration runner; exercised by integration.yml applying it to an empty database, not by line coverage" },
  { path = "learning-os/alembic/versions", why = "migration scripts; correctness is the resulting schema, which tests/db asserts, not which lines ran" },
]

excluded = [
  # Test code is not production code. `tests/generated` is covered by this row
  # through longest-prefix ownership rather than needing one of its own.
  { path = "tests", why = "test code, not production code" },
  { path = "learning-os/tests", why = "test code, not production code" },

  # A catalogue of pinned third-party versions used to measure the ecosystem,
  # not code this product runs. `codeql.yml:122-131` already excludes it from
  # scanning for the same reason.
  { path = "technology-universe/registry", why = "version-measurement catalogue, not shipped code" },
  { path = "technology-universe/runtimes", why = "version-measurement catalogue, not shipped code" },
]

# ---------------------------------------------------------------------------
# PREFLIGHT — the guard on the guard. Mandatory, because an integrity failure
# that does not block a merge is a diagnostic, not a gate.
# ---------------------------------------------------------------------------
[gates.preflight]
workflow = "verify.yml"
job = "preflight"
mandatory = true
role = "integrity"
# check_ruleset.py is listed here, not just called in the workflow, because
# listing it is what makes the wiring survive. gate_integrity.py then requires
# a preflight step that actually EXECUTES it, with no `if:`, no
# continue-on-error and no `|| true` — so deleting the step, commenting it out
# or conditioning it away fails preflight instead of silently restoring the
# state this file spent its existence describing: a verification topology
# nothing compares against the live ruleset.
#
# The wrapper is pinned as its own token, the way bandit's and
# correspondence's are. Without it a future edit could unwrap the chain
# entirely: all four scripts would still be "contained" and would still run,
# but a failure in any of the first three would again leave no report at all
# and no detail of what drifted.
# `lock_consistency.py` is pinned here for the same reason every other name in
# this list is: a step nobody declares is a step that can be deleted without
# anything going red. requirements.txt is INTENT and requirements.lock is what
# CI installs, and until this ran nothing compared them -- a dependency added to
# the manifest without regenerating the lock was simply absent at install time,
# and every gate that did not import it stayed green. Dependabot's pip ecosystem
# edits the manifest and cannot write the lock, so the tool most likely to open
# that gap is the one that cannot close it.
#
# It runs BEFORE gate_integrity.py and after the other three, for the reason
# stated on the workflow step: gate_integrity is what writes
# reports/preflight.json, so anything that must be able to fail without leaving
# a PASS report behind has to precede it.
# `coverage_scope_gate.py` is pinned for the reason every other name here is:
# a step nobody declares is a step that can be deleted with nothing going red.
# It is the guard on the defect described in the [coverage] section above --
# a required check reporting 95% of 38 lines while 70,400 lines of production
# code sat outside its scope, green the whole time.
must_contain = ["run_gate.py --name preflight -- bash -c",
                "scripts/gate_integrity.py", "scripts/tcb_gate.py",
                "scripts/check_ruleset.py", "scripts/registry_gate.py",
                "scripts/lock_consistency.py",
                "scripts/coverage_scope_gate.py"]
evidence = "reports/preflight.json"
artifact = "reports-preflight"

# ---------------------------------------------------------------------------
# GATES — one job each, all parallel, no `needs:` between them.
# ---------------------------------------------------------------------------
[gates.axle-verify]
workflow = "verify.yml"
job = "axle-verify"
mandatory = true
role = "gate"
# The wrapper is pinned as its own token; see the preflight entry above.
# enforce_spec.py owned no report until it moved inside this chain, so a spec
# that broke a syntactic rule turned the job red with every detail of which
# spec and which rule living only in the job log.
must_contain = ["run_gate.py --name axle-verify -- bash -c",
                "scripts/axle_gate.py", "scripts/enforce_spec.py"]
evidence = "reports/axle-verify.json"
artifact = "reports-axle-verify"

[gates.spec-strength]
workflow = "verify.yml"
job = "spec-strength"
mandatory = true
role = "gate"
must_contain = ["scripts/check_composition.py", "--min-strength 0.9"]
evidence = "reports/spec-strength.json"
artifact = "reports-spec-strength"

[gates.spec-composition]
workflow = "verify.yml"
job = "spec-composition"
mandatory = true
role = "gate"
must_contain = ["scripts/check_composition.py", "--min-strength 0.9"]
evidence = "reports/spec-composition.json"
artifact = "reports-spec-composition"

[gates.vacuity-check]
workflow = "verify.yml"
job = "vacuity-check"
mandatory = true
role = "gate"
must_contain = ["scripts/check_vacuity.py"]
evidence = "reports/vacuity-check.json"
artifact = "reports-vacuity-check"

[gates.counterexample-search]
workflow = "verify.yml"
job = "counterexample-search"
mandatory = true
role = "gate"
must_contain = ["scripts/find_counterexample.py"]
evidence = "reports/counterexample-search.json"
artifact = "reports-counterexample-search"

[gates.honest-report]
workflow = "verify.yml"
job = "honest-report"
mandatory = true
role = "gate"
must_contain = ["scripts/honest_report.py", "--min-strength 0.9"]
evidence = "reports/honest-report.json"
artifact = "reports-honest-report"

[gates.coverage]
workflow = "verify.yml"
job = "coverage"
mandatory = true
role = "gate"
# THE SCOPE IS PINNED HERE, NOT ONLY THE THRESHOLD, AND THAT IS THE FIX FOR
# THE DEFECT THIS GATE ITSELF HAD.
#
# This line used to read `must_contain = ["--cov-fail-under=95"]`. It pinned
# the NUMBER and said nothing about what the number was about, so
# gate_integrity.py verified that "95" appeared in the command and never asked
# "95% of what?". `--cov=src` is now pinned too, so silently re-pointing the
# measurement at something else fails preflight.
#
# Pinning cannot catch the other half -- code growing OUTSIDE the scope while
# the scope stays still, which is what actually happened. That is what
# scripts/coverage_scope_gate.py and the [coverage] section exist for. Both are
# needed: this pin stops the scope moving, the gate stops the code escaping it.
must_contain = ["--cov=src", "--cov-fail-under=95"]
evidence = "reports/coverage.json"
artifact = "reports-coverage"

[gates.pyright]
workflow = "verify.yml"
job = "pyright"
mandatory = true
role = "gate"
# The full command, not the bare word: "pyright" alone also matches an
# artifact name and any comment that mentions the tool.
# TWO TOOLS, PINNED SEPARATELY. The context name stays `pyright` because it is
# a required status check in live ruleset 20990225 and renaming one makes it
# permanently pending -- the same reason the `mutmut` gate keeps its name while
# running scripts/mutation_gate.py.
#
# ruff joined this gate rather than getting its own job because `full` must wait
# for every job in verify.yml while aggregate_gates.py expects reports only from
# MANDATORY gates, so a non-mandatory job's evidence is `unexpected` and blocks
# the finalizer. Here it blocks on its own merits from the first run.
#
# The scope is pinned, not just the tool: `ruff check` alone would still pass
# while measuring one directory, which is precisely the defect the coverage gate
# carried for its whole existence.
must_contain = ["run_gate.py --name pyright -- bash -c",
                "pyright",
                "scripts/ruff_gate.py src scripts tests",
                "ruff check src scripts tests"]
evidence = "reports/pyright.json"
artifact = "reports-pyright"

[gates.bandit]
workflow = "verify.yml"
job = "bandit"
mandatory = true
role = "gate"
# The wrapper is pinned as its own token, the way `pyright` pins its full
# command. Four verifications run in this job and only one report may exist
# for the gate id, so they run inside ONE run_gate.py invocation over a bash
# program; a step outside it owns no report, and a step that owns no report
# cannot fail in the evidence. Without this token a future edit could unwrap
# the gate entirely — the four commands would still be "contained", no
# reports/bandit.json would be written, and preflight would still pass. Only
# the finalizer would notice, one job too late.
must_contain = ["run_gate.py --name bandit -- bash -c",
                "scripts/security_gate.py", "scripts/sarif_suppress.py",
                "shellcheck", "scripts/credential_scan.py",
                # ONE TOKEN CARRYING THE WHOLE COMMAND, not the tool name and
                # its flags separately. gate_integrity's `executes()` asks
                # whether a token is RUN, not whether it appears -- so a bare
                # `-r requirements.lock` can never match, because a flag
                # fragment is not a command. Measured: three separate tokens
                # produced "invokes -r requirements.lock: FAIL 0 step(s)" while
                # the workflow plainly contained the text.
                #
                # Pinning the whole line also pins the SCOPE. `pip-audit` alone
                # would still pass while auditing one lock and ignoring three,
                # and this repository has already had one gate whose threshold
                # was pinned and whose scope was not.
                "pip-audit --no-deps -r requirements.lock -r requirements-preflight.lock -r requirements-audit.lock -r learning-os/requirements-learning-os.lock"]
evidence = "reports/bandit.json"
artifact = "reports-bandit"

[gates.mutmut]
workflow = "verify.yml"
job = "mutmut"
mandatory = true
role = "gate"
must_contain = ["scripts/mutation_gate.py", "--min-score 0.95"]
evidence = "reports/mutmut.json"
artifact = "reports-mutmut"

[gates.correspondence]
workflow = "verify.yml"
job = "correspondence"
mandatory = true
role = "gate"
# The theorem must be about the Python in this tree. Freshness compares the
# committed pair against a regeneration from source; the kernel then checks the
# correspondence and the property. See TRUST.md for what this does NOT prove.
# The wrapper token is here for the same reason as `bandit`'s: both
# verifications must run inside the one gate invocation, because a step
# outside it produces no evidence and so cannot fail in the report.
must_contain = ["run_gate.py --name correspondence -- bash -c",
                "scripts/correspondence_gate.py", "pytest -m axle"]
evidence = "reports/correspondence.json"
artifact = "reports-correspondence"

# ---------------------------------------------------------------------------
# SCANNERS — CodeQL. Mandatory, and deliberately NOT in verify.yml: they need
# `security-events: write`, and their evidence is the code-scanning database,
# not a reports/*.json. role = "scanner" is what tells the integrity checker
# not to demand an artifact and the finalizer not to expect a report; every
# other structural check still applies.
#
# The ruleset's `code_scanning` rule already required the CodeQL TOOL. These
# make the WORKFLOW required too, which is the difference between "GitHub will
# read CodeQL results if they exist" and "results must exist".
# ---------------------------------------------------------------------------
[gates.codeql-python]
workflow = "codeql.yml"
job = "codeql-python"
mandatory = true
role = "scanner"
must_contain = ["github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28",
                "github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28"]
evidence = "github code scanning, category /language:python"
artifact = ""

[gates.codeql-actions]
workflow = "codeql.yml"
job = "codeql-actions"
mandatory = true
role = "scanner"
must_contain = ["github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28",
                "github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28"]
evidence = "github code scanning, category /language:actions"
artifact = ""

# TypeScript analysis. `mandatory = false` ONLY because check_ruleset.py
# asserts this manifest's required_checks equals GitHub's live required set:
# declaring it required before an admin adds the context would fail preflight
# on the same push. Promote it the moment that context exists.
#
# Its findings are NOT advisory. The `CodeQL` results check below is required
# with an alert threshold of `all`, so anything this job publishes blocks.
[gates.codeql-javascript-typescript]
workflow = "codeql.yml"
job = "codeql-javascript-typescript"
mandatory = false
role = "scanner"
must_contain = ["github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28",
                "github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28"]
evidence = "github code scanning, category /language:javascript-typescript"
artifact = ""

# The code-scanning RESULTS check. Not a workflow job — GitHub's
# github-advanced-security app (57789) posts it once CodeQL results land, and
# it is what turns a finding into a blocked merge. Required alongside the two
# analysis jobs because they answer different questions: the jobs prove the
# analysis RAN on this commit, this proves the results were CLEAN. Requiring
# only the results check would let deleting codeql.yml pass on stale data;
# requiring only the jobs would let a green analysis full of alerts through.
[gates.CodeQL]
workflow = "codeql.yml"
job = ""
mandatory = true
role = "code-scanning"
integration_id = 57789
must_contain = []
evidence = "github code scanning results check"
artifact = ""

# BROWSER SMOKE TEST. `scanner` rather than `gate` for the same reason the
# CodeQL jobs are: it runs in its own workflow and writes no reports/<name>.json,
# so the finalizer must not expect evidence from it. Its verdict is its exit
# code, and GitHub's required-check state is what carries that verdict.
#
# `must_contain` pins the two commands that make the run mean anything: `npm ci`
# installs exactly what package-lock.json pins rather than re-resolving, and
# `npm run test:e2e` is the invocation whose exit code decides the job. Swapping
# either one out is the change worth catching.
[gates.e2e]
workflow = "e2e.yml"
job = "e2e"
mandatory = true
role = "scanner"
must_contain = ["npm ci", "npm run test:e2e"]
evidence = "playwright report, uploaded as an artifact on failure"
artifact = ""

# ---------------------------------------------------------------------------
# SKILLS — the fixer's instructions exist, and are not empty.
#
# `claude-fix` has write access to the branch. `.claude/skills/` is what points
# it at a root cause instead of at the cheapest green, and a deleted skill file
# fails silently: the job runs, unguided, and nothing reports it. Required
# rather than advisory for that reason -- an advisory check on the thing that
# constrains an autofixer constrains nothing.
# ---------------------------------------------------------------------------
[gates.skills]
workflow = "gate.yml"
job = "skills"
mandatory = true
role = "scanner"
must_contain = ["python3 -m pytest tests/test_skills_present.py"]
evidence = "pytest result per required skill"
artifact = ""

# ---------------------------------------------------------------------------
# FRONTEND — the unit suite, the reachability gate, and the build.
#
# `must_contain` pins all three because each answers a different question and
# any one of them passing alone would be a green job proving less than it looks.
# `npm test` says the behaviour holds, `gate:reachability` says no module the
# product cannot load is being counted as tested, and `npm run build` says the
# thing actually compiles for shipping.
# ---------------------------------------------------------------------------
[gates.frontend]
workflow = "learning-canvas-frontend.yml"
job = "frontend"
mandatory = true
# `scanner`, not `gate`. A `gate` must hand `full` a downloadable report, and
# `full` can only download from its own run -- this job is in another workflow,
# so the role it can honestly claim is the one `e2e` and `CodeQL` claim.
role = "scanner"
# EMPTY, AND THE REASON IS THE JOB'S DESIGN RATHER THAN AN OMISSION.
#
# Every step here carries `continue-on-error` on purpose: the battery runs to
# completion so a typecheck failure does not hide a lint failure, and each
# outcome is annotated. `gate_integrity` forbids `continue-on-error` on a step
# that CARRIES a pinned token, and it is right to -- for a gate that decides,
# that shape is indistinguishable from a swallowed error.
#
# This job does not decide. `frontend-verdict` does, and it `needs:` this job,
# so a red step here still blocks the merge through that context. Pinning
# tokens here would force the battery to stop at its first failure and trade
# one whole class of reporting for a rule that the finalizer already enforces.
must_contain = []
# ARTIFACT DECLARED EMPTY, AND THE JOB STILL UPLOADS ONE.
#
# `full` downloads every declared artifact from ITS OWN run and proves the set
# it got equals the set declared here. This gate lives in
# learning-canvas-frontend.yml, a different workflow, so `full` cannot reach
# its upload at all -- and naming it made `full` report `frontend STATUS
# UNKNOWN` and refuse the merge for evidence that was produced and simply not
# fetchable. `e2e` and `CodeQL` are in the same position and carry the same
# empty value.
#
# The upload still happens, `if-no-files-found: error`, and is still how a
# human reads what this job built.
evidence = "the built dist/, uploaded in its own workflow"
artifact = ""

# ---------------------------------------------------------------------------
# FRONTEND-VERDICT — one name for every frontend job.
#
# It `needs:` frontend, frontend-mutation and frontend-scenes, so a failure in
# any of them turns this red. That is why the ruleset can require this single
# context instead of eight: the shard count can change without the ruleset
# needing an edit, which is exactly the trap that a renamed `mutation 1/4` set
# would otherwise spring -- a required check no job produces waits forever.
# ---------------------------------------------------------------------------
[gates.frontend-verdict]
workflow = "learning-canvas-frontend.yml"
job = "frontend-verdict"
mandatory = true
# `scanner` for the same cross-workflow reason as `frontend` above. `full` is
# this run's finalizer; this job finalises a different workflow and cannot hand
# `full` anything.
role = "scanner"
must_contain = []
# `if: always()` is REQUIRED here rather than suspicious. A finalizer that
# skipped when a dependency failed would report nothing at exactly the moment
# it matters, and GitHub renders a skipped required check as neutral -- the
# "absence looks like health" failure this whole workflow was built to avoid.
job_if = "always()"
# Empty for the same reason as `frontend` above: a different workflow, so
# `full` cannot download it.
evidence = "the three dependency results, written to a file"
artifact = ""

# ---------------------------------------------------------------------------
# CHAOS — the software is broken on purpose and has to survive it.
#
# `must_contain` pins the invocation, not the tool. `npx vitest run` alone would
# still pass while pointed at a directory that no longer exists, and this
# repository has already had one gate whose threshold was pinned and whose scope
# was not. The path is the scope.
#
# Every fault is injected into an in-process fake dependency -- a rejected
# promise, a truncated string, an HTML error page -- so nothing reaches a
# network, a database or a deployment. Bounded and safe is what makes this a PR
# gate rather than a nightly campaign.
# ---------------------------------------------------------------------------
[gates.chaos]
workflow = "gate.yml"
job = "chaos"
mandatory = true
role = "scanner"
must_contain = ["npx vitest run src/canvas/chaos"]
evidence = "per-experiment PASS/FAIL from the vitest verbose reporter"
artifact = ""

# ---------------------------------------------------------------------------
# CATCH-ERRORS — the repository's own linters, every one run before any verdict.
#
# `must_contain` pins the three commands whose exit codes ARE the verdict. The
# job runs each with `continue-on-error` so one failure does not hide the other
# two, then a final step reads all three outcomes and exits non-zero. That last
# step is the difference between reporting a failure and swallowing one, and
# removing any of these three commands is the change worth catching -- a job
# that installs, lints nothing, and exits 0 looks identical to a clean run.
#
# The linters are this repository's own, with configs somebody tuned. A
# general-purpose linter action brings its own defaults, and thousands of
# complaints about rules nobody chose is noise that teaches people to scroll
# past a red check.
# ---------------------------------------------------------------------------
[gates.catch-errors]
workflow = "gate.yml"
job = "catch-errors"
mandatory = false
role = "scanner"
must_contain = ["npx tsc --noEmit", "npm run lint", "ruff check ."]
evidence = "per-linter PASS/FAIL lines in the job summary"
artifact = ""

# ---------------------------------------------------------------------------
# FINALIZER — downloads every gate's artifact from THIS run and proves the
# evidence set equals the set declared above. Mandatory: it is the only check
# that can see a job that went green without producing evidence.
# ---------------------------------------------------------------------------
[gates.full]
workflow = "verify.yml"
job = "full"
mandatory = true
role = "finalizer"
# The ONLY job-level condition allowed anywhere, declared here so it appears in
# a diff. Without it a failing gate skips this job, the required `full` context
# never reports, and the PR hangs pending instead of failing.
job_if = "always()"
must_contain = ["scripts/aggregate_gates.py", "download-artifact"]
evidence = "reports/gate-manifest.json"
artifact = "reports-full"

# ---------------------------------------------------------------------------
# SUPPLEMENTARY — runs, reports, blocks nothing. Declared so its role is a
# decision on the record rather than an omission.
#
# `fast` (pr-fast.yml) was removed. It ran enforce_spec.py, axle_gate.py and
# `pytest -q`, which this file already described as "a strict subset of
# axle-verify + spec-strength + coverage", and its only stated purpose was
# "latency feedback on a PR". Measured against that purpose, job-level medians:
#
#     fast           126s  (N=12)
#     axle-verify     23s  (N=9)   -> fast was 5.5x SLOWER for the same answer
#     spec-strength   26s  (N=9)
#     coverage        98s  (N=9)   -> fast was 28s SLOWER for the same answer
#
# It was slower than every job it duplicated, so it delivered no feedback
# earlier than the required checks already did, blocked nothing, and cost 126s
# of runner time on every push. A supplementary check that is slower than the
# blocking one it shadows is not early feedback; it is a second opinion that
# arrives last.
# ---------------------------------------------------------------------------

[gates.ai-review]
workflow = "ai-review.yml"
job = "ai-review"
mandatory = false
role = "supplementary"
must_contain = ["anthropics/claude-code-action@d40ddef4c030e508327d6e35a9c45f3368482c50"]
evidence = "pull request review comments, posted via the claude GitHub App (1236702)"
artifact = ""

# ---------------------------------------------------------------------------
# MERGE EVIDENCE — advisory, deliberately, and only for now.
#
# It checks a different kind of thing from every gate above. Those prove
# properties of the tree; this one proves that a measured number written in the
# pull request body is the number GitHub's own logs and API recorded. #28 merged
# claiming "42 AXLE calls before, 13 after" when the truth was 9 and 3, and the
# refuting measurement was already in a `correspondence` log of the same run.
#
# `mandatory = false` is not timidity, it is sequencing. Promoting this to an
# 18th required context is a live ruleset edit, and doing that before measuring
# the real overhead, the token's actual permissions, and the false-block rate on
# real pull request bodies would be requiring a check nobody has evidence about
# -- which is the exact failure mode this gate exists to prevent. It reports
# first. It blocks after the numbers say it should.
#
# While false, `scripts/gate_integrity.py` applies none of its per-gate
# structural checks (it filters on mandatory), and required_checks stays at 17,
# so `scripts/check_ruleset.py` keeps proving the same equality it proved before.
# ---------------------------------------------------------------------------

[gates.merge-evidence]
workflow = "verify.yml"
job = "merge-evidence"
mandatory = false
role = "supplementary"
must_contain = ["scripts/merge_evidence_gate.py"]
evidence = "reports/merge-evidence.json"
artifact = "reports-merge-evidence"


# ---------------------------------------------------------------------------
# DEEP VERIFICATION — supplementary, label-gated, and deliberately not required.
#
# Milestone 5 needed remote evidence for the deep lane, so the lane has a
# workflow. It is declared here for the same reason ai-review and merge-evidence
# are: a job that exists in a workflow but in no manifest is a job nobody
# decided on. Declaring it is the decision, on the record.
#
# `mandatory = false` is load-bearing three times over. It keeps
# required_checks at seventeen, so scripts/check_ruleset.py keeps proving the
# same equality against the live ruleset. It keeps gate_integrity.py's per-gate
# structural checks off a workflow that legitimately carries a job-level `if:`.
# And it keeps a lane that contacts a third party out of the merge decision --
# an outage at axle.axiommath.ai must not be able to block a merge.
#
# NO ARTIFACT FIELD FOR THE AGGREGATE. scripts/aggregate_gates.py computes
# `unexpected` as (found | rejected) - EXPECTED and EXPECTED filters on
# mandatory, so a reports/*.json from this lane arriving in the finalizer's
# evidence tree would be read as evidence for a gate nobody expects and would
# turn the required `full` context red. This lane writes to .evidence/ and
# uploads a GitHub Actions artifact instead; neither is in that tree.
# ---------------------------------------------------------------------------

[gates.deep-verify-gate]
workflow = "deep-verify.yml"
job = "gate"
mandatory = false
role = "supplementary"
# The two refusals worth catching if someone deletes them: the label check that
# keeps AXLE off every ordinary push, and the fork check that keeps signing
# authority out of a branch this repository does not control.
must_contain = ["deep-verify", "fork PRs are not authorized"]
evidence = "job log"
artifact = ""

[gates.deep-verify]
workflow = "deep-verify.yml"
job = "deep-verify"
mandatory = false
role = "supplementary"
# The four commands that make the run mean anything: the lane itself, the single
# authoritative bundle, the blob signature over its exact bytes, and the
# verification of that signature. Swapping any one out is the change worth
# catching.
must_contain = [
  "scripts/local_gates.py --deep",
  "scripts/build_bundle.py",
  "cosign sign-blob",
  "cosign verify-blob",
]
evidence = "GitHub Actions artifact sandbox-verification-bundle-<source-sha>"
artifact = ""

# ==========================================================================
# [advisory] --- jobs that run, report a verdict, and cannot block a merge.
#
# Check 9b in scripts/gate_integrity.py walks disk -> manifest and refuses any
# job that is neither a required check nor listed here with a reason. Check 9
# walks manifest -> manifest ("the manifest agrees with itself"), so before 9b
# existed a job in neither side was invisible rather than failing: fourteen of
# them ran for months while the gate printed `17 required, 17 mandatory: PASS`.
#
# This is an ALLOWLIST. A job nobody has classified is refused, so the next
# workflow anyone adds must be either required or written off on purpose.
#
# THE REASON IS THE POINT. An exemption nobody has to justify is an exemption
# everybody takes. Two kinds of entry live here and they are not the same
# thing, so each says which it is:
#   DELIBERATE --- it should not block, and here is why.
#   DEBT       --- it SHOULD block and does not yet. That is a defect with a
#                  reason recorded, not a decision that has been made.
# ==========================================================================
[advisory]

"gate.yml::catch-errors" = "DEBT, not a decision. It runs this repository's own tuned linters on every push and SHOULD be required; the live ruleset does not list it, and `ci/gates.toml` must equal the ruleset exactly or preflight fails. Listed here so the two agree while the gap is visible rather than silent. Adding `catch-errors` to ruleset 20990225 and moving this row back to required_checks is the fix."

"gate.yml::claude-fix" = "DELIBERATE. Not a verdict -- a repair. It runs only when catch-errors is already red, so requiring it would demand a job that does not start on a healthy pull request, and a required check that never runs reports PENDING forever. Its OWN verdict is not advisory: scripts/no_weakening_gate.py reads the diff it pushed and fails this job on any suppression, skip, dropped assertion, deleted test file, or continue-on-error, so a weakening fix dies in the runner instead of landing on the branch."

"ai-review.yml::ai-review" = "DELIBERATE. Review commentary, not a verdict. It also cannot pass today -- the credential is dead and 0 of 36 reviews have run (issue #93) -- so requiring it would block every merge in the repository."

"annotation-canary.yml::emit" = "DELIBERATE. A canary. It runs on schedule and push as well as pull_request, and exists to notice annotation rendering breaking, not to judge a change."
"annotation-canary.yml::verify" = "DELIBERATE. The other half of the canary above."

"ci-findings.yml::reconcile" = "DELIBERATE. Triggered by workflow_run, so it starts only after another workflow has finished. A required check cannot be satisfied by a job that runs after the run it reports on."

"deep-verify.yml::gate" = "DELIBERATE. Deep verification is also workflow_dispatch and is heavier than a per-PR gate. verify.yml carries the blocking checks."
"deep-verify.yml::deep-verify" = "DELIBERATE. The lane behind the gate above."

"codeql.yml::codeql-javascript-typescript" = "DEBT. codeql-python and codeql-actions ARE required and this one is not, which is an inconsistency rather than a decision. The aggregate `CodeQL` context is required, so JavaScript findings are not wholly unguarded, but the per-language job should match its two siblings."

"learning-canvas-frontend.yml::frontend" = "DEBT. This is the P0 that check 9b was written to expose. The mutation gate, the reachability gate, the bundle budget and the lint over four directories all run in this job and none of them can fail a merge."
"learning-canvas-frontend.yml::frontend-mutation" = "DEBT. The mutation gate. It runs, it reports, it blocks nothing."
"learning-canvas-frontend.yml::frontend-scenes" = "DEBT. Roughly 290 browser tests across sharded matrix jobs. They run, they report, they block nothing."
"learning-canvas-frontend.yml::frontend-verdict" = "DEBT. The job that aggregates the three above into one verdict, which is the context that would be required once the ruleset is updated."

"learning-os.yml::learning-os" = "DELIBERATE for now. learning-os v1 is an unmerged draft (PR #48, marked DRAFT -- do not merge). Requiring a draft subsystem would block unrelated work."
"learning-os.yml::deployed-layout" = "DELIBERATE for now. Same draft subsystem as above."
"learning-os.yml::real-life" = "DELIBERATE for now. Same draft subsystem as the two above -- it runs the Given/When/Then human scenarios in learning-os/tests/human/ and cannot be required while learning-os v1 is an unmerged draft. Worth saying what is therefore NOT blocking: this is the only job that asks whether a person can sign up, answer, be told what to do next, and have a dropped-connection retry not counted twice. Its own scenario-count gate is not advisory -- scripts/property_gate.py --suite human fails this job if the suite shrinks, so a silently deleted scenario dies in the runner rather than landing green."

"verify.yml::merge-evidence" = "DEBT. It checks the PR's measured claims against the run's evidence, which is exactly the kind of thing that should be able to fail a merge. It runs `if: always()` after `full` on pull_request only and is not a required check."

"integration.yml::integration" = "DEBT. It is the only job that proves the migrations apply to an empty database, that the CHECK and UNIQUE constraints actually refuse bad rows, and that the seeded dataset is byte-identical across runs. Nothing else can prove any of that, because no other job has a PostgreSQL. It runs, it reports, it blocks nothing. Making it block is an edit to live ruleset 20990225, which only the repository owner can make -- until then a red database suite stops no merge, and a green pull request should not be read as one this job approved."

"integration.yml::contract" = "DEBT. It regenerates the Pact consumer contract and fails if the committed pacts/ file differs. Without it a developer can change what the canvas needs, forget to commit the regenerated contract, and the provider goes on verifying needs the consumer no longer has -- both suites green while the two sides drift apart, which is the exact failure Pact was added to prevent. It runs, it reports, it blocks nothing, for the same ruleset reason as its sibling job above."

# NOTE: the accessibility spec is NOT a job. It runs inside frontend-scenes,
# so it is covered by that job's classification and must not be declared
# here -- an advisory key naming a job that does not exist is a claim
# gate_integrity cannot check, which is the shape this file exists to
# refuse. Kept as a comment because the reasoning is worth reading.
#   axe-core over three routes at three states each (loaded, after keyboard
#   traversal, at phone width), failing on any violation outside
#   ci/baselines/a11y.json. axe detects roughly a third of real
#   accessibility problems, so green means no automatically-detectable
#   violation outside the baseline, never that a route is accessible.

"learning-canvas-frontend.yml::frontend-visual" = "DEBT, and PARTIAL. toHaveScreenshot baselines for three acceptance lessons. The spec and its pairing test are complete and the discipline is written down in docs/visual-review.md, but the baselines themselves are platform-specific and must come from a Linux CI run: a macOS capture can never match, and .gitignore refuses one so it cannot be committed by accident. Until those baselines land, this job fails on missing snapshots -- which is the correct behaviour and is why Playwright is not allowed to create them in CI."

"nightly.yml::fuzzing" = "DELIBERATE. It runs on a schedule, not on a pull request, so it cannot be a required check by construction -- there is no commit for it to gate. The same suite runs on every pull request at 30 generated examples per operation; this runs it at 500. That difference is not cosmetic: 30 examples pass while 1500 found a real schema defect, so the nightly profile finds things the blocking profile cannot afford to look for. A failure here is a finding to act on, not a merge to stop."
