# MIGRATION — no command, because there is nothing to run.
#
# Five probes, each of which must return NOTHING. A single grep would not be
# proof: a repository can lack the word "alembic" and still have a schema
# evolution mechanism under another name, so the probes look for directories,
# commands, dependencies, database configuration and database services
# separately. Their raw output is recorded in the evidence, so the claim is
# re-derived on every run rather than asserted once in a document.
#
# If ANY probe returns output, this check FAILS. It does not degrade to a
# quieter NOT_APPLICABLE: a migration mechanism that appeared after this entry
# was written is exactly the thing the probes exist to catch.
[deep_checks."migration"]
category = "migration"
requirement = "This repository has no migration framework, migration directory, migration command, schema-evolution system, database service, or deployment database contract, so migration verification has nothing to verify."
expect = "NOT_APPLICABLE"
timeout_seconds = 300
evidence = "migration.json"
requires_network = false

[[deep_checks."migration".probes]]
name = "no migration directories"
argv = ["bash", "-c", "find . -type d \\( -name migrations -o -name migrate -o -name alembic \\) -not -path './technology-universe/*' -not -path './.claude/*' -not -path './node_modules/*' -not -path './.venv/*' -print"]

[[deep_checks."migration".probes]]
name = "no migration command in Makefile, package scripts, or workflows"
argv = ["bash", "-c", "grep -rInE '(alembic|flyway|liquibase|knex|prisma migrate|sequelize db:migrate|manage\\.py migrate|db upgrade)' Makefile package.json .github/workflows/ || true"]

[[deep_checks."migration".probes]]
name = "no migration dependency in Python or Node manifests"
argv = ["bash", "-c", "grep -rInE '(alembic|flyway|liquibase|knex|prisma|sequelize|django|sqlalchemy-migrate|yoyo-migrations)' requirements.txt requirements.lock package.json package-lock.json || true"]

[[deep_checks."migration".probes]]
name = "no database connection config or schema-evolution artifact"
# The two files EXCLUDED here are the two that talk ABOUT this probe: this
# manifest, which defines the patterns, and the document that describes them.
# Neither is evidence of a migration system, and a probe that matches its own
# definition is measuring itself. Found on run 32414089692, where the probe
# matched docs/engineering/deep-verification.md:70 -- the line listing
# "`CREATE TABLE`" as one of the things it searches for.
argv = ["bash", "-c", "git grep -InE '(postgres://|mysql://|mongodb://|sqlite:///|DATABASE_URL|CREATE TABLE|ALTER TABLE)' -- . ':!technology-universe' ':!.claude' ':!ci/local-execution.toml' ':!docs/engineering/deep-verification.md' || true"]

[[deep_checks."migration".probes]]
name = "no database service in any workflow"
argv = ["bash", "-c", "grep -rInE '^\\s*services:|image:\\s*(postgres|mysql|mariadb|mongo|redis)' .github/workflows/ || true"]
