# ===========================================================================
# LOCAL CHECKS — regression and quality checks that are NOT GitHub contexts.
#
# WHY A SEPARATE TABLE. `[contexts.*]` is authoritative for the seventeen live
# required GitHub contexts and nothing else;
# tests/test_local_execution_manifest.py::test_no_context_is_invented fails on
# any entry there that GitHub does not require. That guard is correct and is not
# weakened. A regression fixture is not a GitHub context and must never be able
# to look like one, so it lives here instead.
#
# A local check may not borrow a required context's name. If it could, a green
# local run would print a line indistinguishable from the required check that
# GitHub actually enforces, which is the false-reassurance this whole manifest
# exists to remove. tests/test_regression_registry.py proves the namespaces stay
# disjoint.
#
# EVERY ENTRY DECLARES: requirement (what escape or rule it proves), exact argv,
# timeout, evidence file, tier, requires_network, and why it sits in that tier.
# ===========================================================================

[local_checks."regression-registry"]
requirement = "R1/R6/R7 plus the registry's own integrity: every row in ci/regression-fixtures.yml resolves to a test that exists, local checks cannot borrow a required context name, and a network-requiring check is excluded from the default tiers rather than merely labelled."
command = ["python3", "-m", "pytest", "-q", "tests/test_regression_registry.py"]
timeout_seconds = 300
evidence = "regression-registry.json"
tier = "fast"
requires_network = false
tier_reason = "Measured at 3.2s for the comparable tests/test_local_execution_manifest.py file on the declared machine, against a 60s fast-tier budget. It reads files and calls no network and no subprocess-heavy fixture, so it is cheap enough to run before every push -- which is the only place it can catch a registry row that stopped resolving."

[local_checks."regression-push-chain"]
requirement = "G1. The production chain from a real type error to a rejected push: real type error -> real manifest parser -> the exact pyright argv the manifest selects -> real make sandbox-fast -> real copied .githooks/pre-push -> real `git push` rejected against a real bare remote. tests/test_local_execution_manifest.py:294 proves only the hook half, using a fake Makefile that returns a synthetic exit code; nothing proved that a real pyright error reaches that exit code."
command = ["python3", "-m", "pytest", "-q", "tests/test_pre_push_chain.py"]
timeout_seconds = 600
evidence = "regression-push-chain.json"
tier = "full"
requires_network = false
tier_reason = "It invokes `make sandbox-fast` inside a temporary repository. Placing it in the fast tier would make the fast tier invoke itself -- unbounded recursion, not a slow test. The tier assignment is a correctness constraint here, not a budget one."
