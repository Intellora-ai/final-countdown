[contexts."e2e"]
required_context = "e2e"
locally_runnable = "no"
reason = "Requires a Chromium binary fetched by `npx playwright install`, which is not pinned by any repository lockfile, plus a generated htmlcov/ fixture. Not reproducible from lockfiles alone."

[contexts."full"]
required_context = "full"
