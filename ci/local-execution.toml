# LOCAL EXECUTION MANIFEST — what of GitHub's required verification can honestly run here.
#
# SCOPE, STATED NARROWLY. This file is authoritative for LOCAL EXECUTION ELIGIBILITY and LOCAL
# COMMANDS only. `ci/gates.toml` remains authoritative for which contexts GitHub requires, and the
# live ruleset remains the final merge proof. This file makes no claim that a local command is
# equivalent to the workflow command; that cannot be proven and is not asserted.
#
# WHY IT EXISTS. On 2026-08-20 four consecutive CI runs went red. The first was pyright: it is one
# of the 17 required contexts and it was simply not in the set of checks run before pushing. There
# was no artifact in this repository that answered "run what CI runs", so the local set was
# assembled from memory, and memory dropped one.
#
# `ci/gates.toml` cannot answer that question. It stores identity and FINGERPRINTS -- `must_contain`
# substrings -- never commands. `spec-strength` and `spec-composition` carry byte-identical
# fingerprints while running different commands, which proves a fingerprint cannot reconstruct a
# command. The real argv lives only in .github/workflows/verify.yml `run:` strings.
#
# HOW THE COMMANDS BELOW WERE OBTAINED. Extracted from verify.yml, not retyped. Retyping is the
# failure this file exists to prevent.
#
# EVERY required context appears here exactly once, with locally_runnable = "yes" or "no". A "no"
# carries an exact reason. Nothing is silently omitted, and no GitHub-only context is ever reported
# as having passed locally. tests/test_local_execution_manifest.py enforces all of that.

# RECLASSIFIED ON EVIDENCE, 2026-08-20. The previous entry said this context could not
# run here. That was measured to be false:
#
#     python3 scripts/check_ruleset.py            -> exit 0, [RESULT] PASS
#     python3 scripts/tcb_gate.py --base origin/main -> exit 0
#
# `gh` is on PATH, `origin/main` exists, and ruleset 20990225 is readable anonymously
# because the repository is public. So the honest statement is not "cannot run" but
# "runs, and needs the network to do it". Those are different claims and only one of
# them is true.
#
# `requires_network = true` is ENFORCED, not annotated: local_gates.select() excludes
# network-requiring checks from both default tiers, so `make sandbox-fast` and
# `make sandbox-test` never make a network call by accident. Running it is an explicit
# opt-in, printed beside the NOT_RUN_LOCALLY line.
#
# The argv mirrors the workflow's chain. BASE_REF is `main` here rather than
# `${{ github.base_ref || 'main' }}`, because ci/gates.toml declares main as the base
# this repository merges into.
[contexts."preflight"]
required_context = "preflight"
locally_runnable = "yes"
requires_network = true
network_reason = "scripts/check_ruleset.py reads ruleset 20990225 from api.github.com. There is no offline source for the live required-check set, and a cached copy would be exactly the stale claim this gate exists to catch."
opt_in_command = "make sandbox-network"
command = [
  "python3",
  "scripts/run_gate.py",
  "--name",
  "preflight",
  "--",
  "bash",
  "-c",
  "set -e\necho '== preflight gate 1/6: trusted computing base' >&2\npython3 scripts/tcb_gate.py --base origin/main\necho '== preflight gate 2/6: ruleset alignment' >&2\npython3 scripts/check_ruleset.py\necho '== preflight gate 3/6: requirement and assumption registries' >&2\npython3 scripts/registry_gate.py\necho '== preflight gate 4/6: dependency lock consistency' >&2\npython3 scripts/lock_consistency.py\necho '== preflight gate 5/6: coverage scope' >&2\npython3 scripts/coverage_scope_gate.py\necho '== preflight gate 6/6: gate integrity' >&2\npython3 scripts/gate_integrity.py",
]
timeout_seconds = 300
evidence = "preflight.json"
in_fast = false

