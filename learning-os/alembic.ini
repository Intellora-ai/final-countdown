# Alembic configuration.
#
# `script_location` is relative to this file, and this file is at the package
# root, so every invocation must run from `learning-os/` or pass `-c`. That is
# the same working directory the CI job already uses.
#
# THERE IS NO `sqlalchemy.url` HERE, DELIBERATELY.
# A URL in a committed config file is a URL somebody eventually points at a real
# database by accident, and it is the obvious place for a password to be pasted.
# `env.py` reads LEARNING_OS_DATABASE_URL instead and fails loudly when it is
# unset.
[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
