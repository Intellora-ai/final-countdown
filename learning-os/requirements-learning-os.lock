# REPRODUCIBLE DEPENDENCIES FOR THE learning-os JOB.
#
# Same rule as requirements.lock at the repo root, for the same reason: `==`
# says which version, `--hash` says which BYTES. A verification system whose own
# inputs float does not produce a repeatable verdict.
#
# WHY A SECOND LOCK RATHER THAN THE ROOT ONE.
# The root lock has pytest and typing-extensions but not pydantic, ruff, or
# mypy, and the engine cannot import without pydantic. Adding four packages to
# the root lock would make every gate job install a heavier toolchain to serve
# one job, and would couple this package's version floors to the verification
# system's. Two locks, each naming exactly what its job installs.
#
# WHY THERE IS NO `pip install -e .` ANYWHERE.
# tests/test_supply_chain.py forbids any pip install that is not
# `--require-hashes -r <lock>`, with no exemption for editable installs of the
# local package -- correctly, since `-e` runs arbitrary build code. So the job
# puts `src` on PYTHONPATH instead of installing the package.
#
# That has one consequence worth stating rather than discovering:
# `test_learner_code_cannot_import_the_engine` is WEAK under PYTHONPATH,
# because `-I` genuinely strips PYTHONPATH, so it passes for an environmental
# reason. It is not the test carrying that property here.
# `test_the_child_cannot_import_an_installed_dependency` is, because pydantic
# arrives through this lock into real site-packages -- which is precisely the
# situation the engine is in once deployed.
#
# THE HTTP SURFACE, AND WHY IT LIVES IN THIS LOCK RATHER THAN A SEPARATE ONE.
# requirements-audit.lock and requirements-preflight.lock each exist because a
# TOOL that runs in one job should not enlarge the trusted computing base of
# every other job. That reasoning does not transfer here, and the distinction is
# the whole point: pip-audit inspects the product, fastapi IS the product. The
# HTTP surface is imported by `learning_os.http`, shipped, and exercised by the
# same test job that already installs this lock. A separate lock would mean the
# engine's own runtime dependency was invisible to the engine's own lock.
#
# Eleven packages arrive. Each is here because something cannot work without it,
# not because it was convenient:
#
#   fastapi          the framework itself. Chosen over a hand-rolled ASGI app
#                    because it generates the OpenAPI document from the same
#                    type annotations the routes validate against, which is what
#                    makes the drift gate in scripts/openapi_drift.py possible
#                    at all. Two hand-maintained descriptions of one API drift;
#                    one generated description cannot.
#   starlette        fastapi's ASGI foundation, and the home of TestClient.
#                    Not directly imported by product code.
#   uvicorn          the ASGI server. Needed to actually serve the app; the
#                    TestClient path does not use it, so it is runtime-only.
#   click            uvicorn's command-line parser. Transitive, not imported.
#   h11              uvicorn's HTTP/1.1 protocol implementation. Transitive.
#   httpx            the HTTP client TestClient is built on, and the client
#                    Phase 7's functional tests use. Test-path only.
#   httpcore         httpx's transport layer. Transitive, not imported.
#   certifi          the CA bundle httpx verifies TLS against. Transitive.
#   idna             hostname encoding for httpx/httpcore. Transitive.
#   anyio            the async primitives starlette and httpx share. Transitive.
#   annotated-doc    fastapi's docstring-in-Annotated helper. Transitive.
#
# Nothing was added "in case it is needed later". If a package below stops being
# reachable from `learning_os.http` or from the tests, it should be removed --
# an unused package inside a hash-pinned trusted computing base is attack
# surface with no function.
#
# THE DATABASE, AND THE SAME QUESTION ASKED AGAIN.
#
# Six more packages. The test applied to the HTTP ones applies here unchanged:
# is this the product, or a tool that inspects the product? A database the
# engine reads and writes is the product, and Phase 6's invariants are enforced
# BY that database rather than by Python -- a rule enforced only in Python is a
# rule a second code path can break.
#
#   sqlalchemy       the mapper. Chosen over hand-written SQL because the same
#                    typed model definition produces both the runtime queries
#                    and Alembic's migration diff. Two hand-maintained
#                    descriptions of one schema drift; one generated from the
#                    other cannot.
#   alembic          migrations. Needed for "applies forward and rolls back on a
#                    real database", which is a Phase 6 test and not a claim.
#   mako             alembic's template engine, used to render new migration
#                    scripts. Transitive, not imported by product code.
#   markupsafe       mako's escaping primitive. Transitive.
#   psycopg[binary]  the PostgreSQL driver, version 3. The `binary` extra ships
#                    a prebuilt libpq so no compiler and no system postgres
#                    development headers are needed on a CI runner -- a source
#                    build would make this lock's success depend on the runner
#                    image rather than on the hashes.
#   psycopg-binary   the prebuilt wheel that extra resolves to. Transitive.
#   greenlet         sqlalchemy's coroutine primitive, AND THE REASON IT IS
#                    NAMED EXPLICITLY IN THE INPUT SET rather than left to the
#                    resolver. SQLAlchemy requires it conditionally:
#
#                      greenlet>=1; platform_machine == "aarch64" or ... "x86_64" ...
#
#                    Apple Silicon reports `arm64`, which is NOT in that list.
#                    So a lock resolved on this laptop omitted greenlet, and the
#                    Linux x86_64 runner then needed a package the lock did not
#                    pin -- `--require-hashes` refused the whole install with
#                    "all requirements must have their versions pinned with ==".
#                    Naming it in the input makes the lock describe every
#                    platform rather than the one it happened to be built on.
#
# SCHEMATHESIS, AND WHY IT IS NOT A SEPARATE LOCK.
#
# It arrives with sixteen transitive packages, which is the same order of
# expansion that made pip-audit a separate lock. The reasoning does not carry
# over, and the difference is which JOB installs the thing.
#
# requirements-audit.lock exists because pip-audit runs in the ROOT bandit
# chain, so putting it here would make the learning-os job install a tool it
# never runs. Schemathesis runs in the job that already installs THIS lock.
#
# And this lock is not a production-only trusted base -- it has never been one.
# It already carries pytest, ruff and mypy, none of which ship. It is the
# learning-os job's toolchain, and a test tool belongs with the other test
# tools rather than in a second file that has to be kept in step by hand.
#
# What it buys: Schemathesis reads learning-os/openapi.json and generates
# hundreds of requests trying to break the promises that document makes.
# Hypothesis alone cannot do that -- it has no idea what an OpenAPI schema is --
# and the generator is the whole point, because the inputs nobody thought of are
# exactly the ones that are not in a hand-written test.
#
# The notable transitives, so none of them is a surprise later:
#
#   hypothesis           the generator underneath it. Already a ROOT dependency
#                        of this repository; this is the first time the
#                        learning-os job installs it.
#   hypothesis-graphql   GraphQL strategies. Unused here -- this API is REST --
#                        and it arrives as a hard dependency of schemathesis
#                        rather than as a choice.
#   jsonschema-rs        validates each response against its declared schema.
#                        This is the check that makes the fuzzing meaningful.
#   requests, urllib3    schemathesis's HTTP transport.
#   werkzeug             its WSGI/ASGI test transport.
#   starlette-testclient runs the generated cases against the app in-process,
#                        with no port and no network.
#   rich, markdown-it-py, mdurl   its terminal report.
#   pyrate-limiter       request rate limiting, unused at this scale.
#   graphql-core, harfile, pyyaml, charset-normalizer, sortedcontainers
#                        transitive, none imported by anything here.
#
# Four of those are dead weight for a REST API tested in-process. They are
# recorded rather than hidden: if schemathesis ever makes its GraphQL support
# optional, they should go.
#
# PACT, AND WHY IT IS NOT A DUPLICATE OF SCHEMATHESIS.
#
# They answer different questions and the difference is worth the seven
# packages:
#
#   schemathesis  does the API obey ITS OWN schema, for any input?
#   pact          does the API give THIS CONSUMER what it actually needs?
#
# The gap between those is one specific, expensive change: remove a field the
# canvas reads, update openapi.json in the same commit. Schemathesis stays green
# -- every response validates against the schema the API now has -- and the
# canvas breaks in a browser. The contract records what the CONSUMER read, so it
# fails.
#
#   pact-python      the verifier. Replays the recorded contract against a
#                    running provider.
#   pact-python-ffi  the compiled Pact core it drives. Where the protocol
#                    actually lives; not imported directly.
#   cffi, pycparser  how pact-python calls into that core. Transitive.
#   yarl, multidict, propcache
#                    URL handling underneath the verifier. Transitive, none
#                    imported by anything here.
#
# The CONSUMER half is not in this file at all -- it is
# @pact-foundation/pact in frontend/package.json, because the consumer is
# TypeScript and records what the TypeScript client needs. Two halves, two
# languages, one committed contract in pacts/.
#
# PYTEST-BDD, AND THE SAME QUESTION ASKED A THIRD TIME.
#
# Five packages, and the test that decided schemathesis decides this one the
# same way: is this a tool that runs in a job which already installs this lock,
# or a tool that would make some OTHER job install something it never runs?
# pip-audit was the second kind and got its own file. The human scenarios run
# in `learning-os.yml`, against this lock, in the same repository directory as
# the suite that already installs it. So it belongs here.
#
# What it buys is a layer none of the tools above can reach. Schemathesis asks
# whether the API obeys its own schema. Pact asks whether it gives one consumer
# what that consumer reads. Neither asks whether a PERSON can sign up, answer a
# question, be told what to do next, and be refused when they try to break out
# of the sandbox -- and a suite of route tests can be entirely green while that
# sequence is broken, because every one of those calls is correct in isolation
# and the ORDER is what carries the meaning.
#
#   pytest-bdd        binds Given/When/Then steps in tests/human/ to the
#                     `.feature` files beside them. Chosen over a hand-rolled
#                     runner because the binding is what makes a missing step
#                     an ERROR rather than a scenario that quietly does less
#                     than it says. It also tags every scenario function with
#                     `__scenario__`, which is the structural fact the human
#                     half of scripts/property_gate.py counts -- the same
#                     reasoning that made `is_hypothesis_test` the right thing
#                     to count for the property half, and for the same reason:
#                     nobody has to remember to apply it.
#   gherkin-official  the Gherkin parser it reads `.feature` files with.
#                     Transitive, not imported here.
#   parse, parse-type step-argument extraction. Transitive, not imported here.
#   six               parse-type's Python 2 compatibility shim. Transitive,
#                     unused at this Python version, and recorded rather than
#                     hidden: it is dead weight and should go if parse-type
#                     ever drops it.
#
# mako, packaging, pytest and typing-extensions gain pytest-bdd as a dependent.
# No version moved to admit it -- verified by diffing this file against a real
