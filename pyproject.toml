[project]
name = "final-countdown"
version = "0.1.0"
description = "Learning OS. Every function in src/ carries a Lean 4 specification kernel-checked by AXLE; the rest is gated by coverage, mutation and type checks"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
  # Calls the hosted AXLE service, so it needs network and takes seconds, not
  # milliseconds. Deselect with `-m "not axle"` for a fast local loop; CI runs
  # everything, because a correspondence nobody kernel-checks proves nothing.
  "axle: sends a proof to the AXLE service for kernel checking",
  # Walks the 414MB knowledge corpus and measures wall clock. Deselect with
  # `-m "not slow"`; CI runs it, because an unmeasured latency budget is not a
  # budget.
  "slow: measures wall-clock time against a stated budget",
]

[tool.coverage.run]
source = ["src"]
branch = true
# NOTHING IS ADDED HERE FOR SUBPROCESS COVERAGE, AND THAT IS DELIBERATE.
#
# 34 test files run the code under test with `subprocess.run`, and coverage
# measures only the process it started in, so all of that work was reported as
# zero --- `scripts/registry_gate.py` showed 294 statements at 0% while
# `tests/test_registries.py` ran the file and asserted on its output.
#
# The fix is `tests/coverage-subprocess.cfg`, armed by `tests/conftest.py`.
# `parallel = true` was tried HERE first and measured as making no difference:
# 270 lines of `registry_gate.py` were counted with it and 270 without. It is
# therefore absent, because an inert setting on a required gate is one more
# thing every future reader has to rule out.

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.pyright]
# tests and scripts import sibling modules from scripts/ after a sys.path
# insert; without this pyright reports every symbol from them as unknown.
#
# `learning-os/src` is here for the same reason, one package root over.
# scripts/openapi_drift.py imports `learning_os.http.app` to generate the
# schema it checks, and that package is not installed -- the learning-os job
# puts `src` on PYTHONPATH because tests/test_supply_chain.py forbids any pip
# install that is not `--require-hashes -r <lock>`, editable installs included.
# Without this line pyright reported the import unresolved and then every value
# derived from it as unknown, which is a config gap reported as four code
# errors.
extraPaths = ["scripts", "learning-os/src"]
# Without venvPath/venv, pyright cannot resolve hypothesis (which ships
# py.typed). Every unresolved import makes downstream values Unknown, which is
# where the bulk of the strict-mode errors came from - a config gap, not code.
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingImports = true

# NO [tool.mutmut] SECTION, DELIBERATELY. The mutmut PACKAGE was removed from
# requirements.txt because nothing imported it; the mutation scoring is done by
# scripts/mutation_gate.py, which reads none of mutmut's configuration. A config
# block for a tool that is neither installed nor consulted is a second source of
# truth that can only ever drift out of agreement with the first: someone edits
# `paths_to_mutate` here, nothing changes, and the next reader believes the gate
# was reconfigured. Verified before deleting -- `grep mutmut scripts/mutation_gate.py`
# returns only a docstring line saying it REPLACED mutmut.
#
# THE GATE ID STAYS `mutmut`. It is one of the 17 required status-check contexts
# in live ruleset 20990225, so renaming it would leave that context permanently
# pending and block every merge. It is a compatibility name for this repository's
# own AST mutation scorer, not a reference to the package.

[tool.bandit]
# `.claude/skills` holds 131 Python files from three third-party skill
# repositories. They are vendored, not authored here, and scanning them reports
# on other people's code while saying nothing about this product -- the same
# reason `node_modules` is never linted. They are still COMMITTED and therefore
# reviewable and diffable; excluding them from the scanners is about scope, not
# about trust.
exclude_dirs = ["tests", ".claude"]

[tool.ruff]
# See the note on `[tool.bandit]` above: vendored third-party skills, excluded
# from linting for the same reason `node_modules` is. `scripts/` and `tests/`
# and `src/` -- the code this repository actually writes -- are unaffected, and
# `ruff check scripts tests` is clean at the moment this line was added.
exclude = [".claude/skills"]

[tool.ruff.lint]
# THE RULE SET IS PINNED, AND LEAVING IT IMPLICIT WAS THE REAL RISK.
#
# Measured 2026-08-25 on `ruff check src scripts tests`:
#
#   with no `select` at all              258 findings
#   with select = E4, E7, E9, F           12 findings
#
# Both numbers came from the same ruff (0.16.3) against the same tree. The
# difference is entirely which rules ruff decided to run, and that decision
# moves between releases. A gate whose meaning is "whatever this version of
# ruff felt like checking" reports a different thing after every upgrade, and
# the day it reports MORE it fails a pull request that changed nothing. That is
# the same scope drift the coverage gate had: a threshold pinned, a scope not.
#
# So the scope is written down. E4 (imports), E7 (statement-level mistakes),
# E9 (syntax and IO errors) and F (pyflakes -- undefined names, unused imports,
# broken f-strings) are the rules that find defects rather than opinions.
#
# WHAT IS DELIBERATELY NOT ENABLED YET, WITH THE COUNT THAT MAKES IT A
# SEPARATE PIECE OF WORK. Of the 246 findings outside this set:
#
#   78  PLW1510  subprocess.run without explicit check=. Mechanical, but it is
#                78 call sites across the test suite and each one deserves a
#                glance at whether the return code is being read.
#   66  RUF100   unused `# noqa`. ALREADY DOCUMENTED BELOW AS A FALSE POSITIVE
#                HERE -- ruff judges `# noqa: S603` unused against its own rule
#                set while bandit still runs B603 in CI. 48 were deleted on an
#                earlier pass before that was understood.
#   36  ISC004   implicit string concatenation
#   30  EXE001   shebang present, file not executable
#   12  BLE001   blind `except Exception`. Needs care rather than a sweep: the
#                gate lifecycle catches Exception ON PURPOSE, to record an
#                INFRASTRUCTURE_FAILURE instead of crashing. Some of these are
#                the documented design and some may be real.
#
# Enabling those is a rule-by-rule decision with real judgement in it, not a
# `--fix` run. Recorded here with numbers so the next person inherits a
# measurement instead of a vague intention.
select = ["E4", "E7", "E9", "F"]

# UP040/UP047 rewrite type aliases and generic functions into PEP 695 syntax.
# Semantically equivalent, structurally not -- `X: TypeAlias = Y` parses as an
# AnnAssign, `type X = Y` parses as a TypeAlias node that did not exist before
# 3.12. The files those rules touched include scripts/security_gate.py, which
# inspects ASTs for a living. A matcher that stops matching does not fail; it
# passes everything.
#
# `unfixable`, deliberately NOT `ignore`: the finding stays visible, ruff simply
# will not perform the rewrite unasked. Declining an automatic rewrite is an
# engineering choice; silencing a diagnostic is not. If PEP 695 is ever wanted
# here it gets done by hand, in its own commit, with the gate re-verified.
# SIM114 merges `elif A: X` / `elif B: X` into `elif A or B: X`. When the two
# guards NARROW differently -- `isinstance(n, AnnAssign) and n.value is not None`
# beside `isinstance(n, AugAssign)` -- the merged form is still correct at runtime
# (`(A and B) or C` short-circuits) but the type checker can no longer prove the
# narrowing, and pyright fails. Caught in tests/test_codeql_naming.py:276.
# Identical bodies do not imply identical context.
# RUF100 deletes `# noqa` comments it judges unused. It judges that against ITS
# OWN selected rules -- so every `# noqa: S603 - argv only, no shell` in this
# repository looks unused to ruff while bandit is still running B603 in CI and
# scripts/security_gate.py is still re-deriving the safe pattern from the AST.
# Those comments are the human-readable reason each call is safe, sitting on the
# call. A tool deleting a justification it does not understand is not a cleanup.
# 48 of them were removed on the first pass.
unfixable = ["UP040", "UP047", "SIM114", "RUF100"]
