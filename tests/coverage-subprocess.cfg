# The coverage configuration a CHILD PROCESS starts itself with.
#
# WHY THIS IS A SEPARATE FILE FROM pyproject.toml
#
# `COVERAGE_PROCESS_START` names the config a subprocess reads at interpreter
# startup. Pointing it at `pyproject.toml` was tried first and measured as not
# working: that file sets `source = ["src"]`, so a child dutifully measured
# `src/` and ignored the `scripts/` module it had been started to run. The
# parent's `--cov=scripts` never reaches the child, because the child reads a
# config file and not the parent's command line.
#
# So this config deliberately declares NO `source`. The child measures whatever
# it actually executes, and the PARENT's `--cov=` argument decides what appears
# in the report. That keeps one rule -- the scope is whatever the caller asked
# for -- instead of two lists that can disagree.
#
# Measured, not assumed:
#
#   child config = pyproject.toml (source = ["src"])   ->    0 lines counted
#   child config = this file (no source)               ->  270 lines counted
#
# `parallel` lives here rather than in `pyproject.toml` because that is where
# it does something. Adding it to `pyproject.toml` as well was tried and
# changed nothing -- 270 lines either way -- so it is not there.

[run]
# Each child writes its own data file instead of racing every other child for
# one path. pytest-cov combines them at the end of the run.
parallel = true

# Matches `[tool.coverage.run] branch = true` in pyproject.toml. If the parent
# measures branches and the child does not, the combined report is two
# different measurements added together.
branch = true

# TEST FILES ARE NOT PRODUCTION CODE, AND LEAVING THEM IN BROKE THE GATE.
#
# Several tests here run `pytest` itself in a child process. With no `omit`,
# those children measured the test files they were executing, the data was
# combined into the parent's, and the required `coverage` gate --- which asks
# for 95% of `src/` --- reported 16.52% over 13,655 statements it was never
# meant to see. Measured, on the exact CI command.
#
# `source` is still deliberately not set: the child must be free to measure
# whatever production module it was launched to run, because the parent's
# `--cov=` never reaches it. `omit` removes the noise without reintroducing a
# second scope list that can drift from the first.
omit =
    */tests/*
    */test_*.py
    */conftest.py
    */.venv/*
    */site-packages/*
